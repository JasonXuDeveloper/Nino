name: A/B Benchmark

# Runs the benchmarks on a GitHub runner: Arm64 by default, for the Arm64 paths (AdvSimd, TBL) that x64 runners never
# take, or x64, the runners (AMD EPYC, with or without AVX-512) the release reports run on. It measures
# the ref chosen in "Use workflow from" (a branch or tag of this repository), and with "compare" also the release tag
# before it, on the same runner, one after the other, with this ref's benchmark code against each ref's library; the
# summary compares them. Numbers for development only: the published ones come from report.yml, which runs these
# benchmarks on Arm64 for every release.
#
# No ref is taken from an input: an input ref would run code that is not the workflow's own in its cache scope (cache
# poisoning). The compared tag is a release tag found in this ref's own history.
on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner'
        required: false
        default: ubuntu-24.04-arm
        type: choice
        options:
          - ubuntu-24.04-arm
          - ubuntu-24.04
      compare:
        description: 'Also measure the previous release tag, for an A/B comparison'
        required: false
        default: false
        type: boolean
      filter:
        description: 'BenchmarkDotNet filters, separated by spaces'
        required: false
        default: '*'
        type: string
      bisect:
        description: 'Measure every commit since the previous release tag that changes Nino.Core or the generator (experiment)'
        required: false
        default: false
        type: boolean
      quick:
        description: 'Quick mode (NINO_BENCH_QUICK): shorter iterations, stopping at 2% error'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  bench:
    name: Benchmark on ${{ inputs.runner || 'ubuntu-24.04-arm' }}
    runs-on: ${{ inputs.runner || 'ubuntu-24.04-arm' }}
    timeout-minutes: 240
    env:
      NINO_BENCH_QUICK: ${{ inputs.quick && '1' || '0' }}
      # The settings of report.yml when not in quick mode.
      BDN_ARGS: ${{ !inputs.quick && '--launchCount 3 --warmupCount 5 --iterationCount 15' || '' }}
      FILTER: ${{ inputs.filter || '*' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: head
          fetch-depth: 0
          persist-credentials: false

      # The newest release tag before this ref (not the Unity package's -preview.N alias of it), from its own history:
      # a release, never a ref named by whoever dispatched.
      - name: Check out the previous release
        if: inputs.compare
        run: |
          set -euo pipefail
          BASE=$(git -C head describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-preview.*' HEAD^)
          echo "Comparing with $BASE"
          git -C head worktree add --detach ../base "refs/tags/$BASE"

      # The commits of this ref's own first-parent history since that tag that change the library: never a ref named
      # by whoever dispatched.
      - name: Check out the commits to bisect
        if: inputs.bisect
        run: |
          set -euo pipefail
          BASE=$(git -C head describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-preview.*' HEAD^)
          COMMITS="$(git -C head rev-parse --short "refs/tags/$BASE") $(git -C head log --first-parent --reverse --format=%h "$BASE..HEAD" -- src/Nino.Core src/Nino.Generator | tr '\n' ' ')"
          echo "Bisecting from $BASE: $COMMITS"
          N=0
          mkdir -p bisect
          for C in $COMMITS; do
            N=$((N + 1))
            D=$(printf 'bisect/%03d-%s' $N $C)
            git -C head worktree add --detach "../$D" "$C"
            rm -rf "$D/src/Nino.Benchmark"
            cp -r head/src/Nino.Benchmark "$D/src/Nino.Benchmark"
          done

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            ${{ vars.DOTNET_VERSION || '10.0.x' }}
            10.0.x
            8.0.x

      # The same benchmarks for both refs: head's benchmark project, built against base's library.
      - name: Build
        run: |
          set -euo pipefail
          if [[ -d bisect ]]; then
            for D in bisect/*/; do
              dotnet build -c Release "$D/src/Nino.Benchmark" -v q -nologo || echo "::warning::$D did not build"
            done
          fi
          if [[ -d base ]]; then
            rm -rf base/src/Nino.Benchmark
            cp -r head/src/Nino.Benchmark base/src/Nino.Benchmark
            dotnet build -c Release base/src/Nino.Benchmark
          fi
          dotnet build -c Release head/src/Nino.Benchmark
          lscpu | grep -E 'Model name|Flags' || true

      - name: Run
        run: |
          set -euo pipefail
          # BenchmarkDotNet runs each benchmark at high priority, which a user may not set ("Failed to set up high
          # priority (Permission denied)"): raise this shell's nice limit (RLIMIT_NICE 40, down to nice -20), which
          # dotnet and the benchmark processes inherit. Without it they run at normal priority, as before.
          sudo prlimit --pid $$ --nice=40:40 || echo "::warning::could not raise the nice limit: normal priority"
          echo "nice limit: $(ulimit -e)"
          set -f  # the filters are patterns for BenchmarkDotNet, not for the shell
          read -ra FILTERS <<< "$FILTER"
          SIDES="base head"
          if [[ -d bisect ]]; then SIDES="$(ls -d bisect/*) head"; fi
          for SIDE in $SIDES; do
            [[ -d $SIDE ]] || continue
            [[ -f $SIDE/src/Nino.Benchmark/bin/Release/net10.0/Nino.Benchmark.dll ]] || continue
            echo "== $SIDE $(git -C $SIDE rev-parse --short HEAD)"
            # shellcheck disable=SC2086 # BDN_ARGS is a list of arguments
            (cd $SIDE/src/Nino.Benchmark && dotnet bin/Release/net10.0/Nino.Benchmark.dll --filter "${FILTERS[@]}" $BDN_ARGS \
              --artifacts "$GITHUB_WORKSPACE/results/$SIDE")
          done

      - name: Summary
        env:
          RUNNER: ${{ inputs.runner || 'ubuntu-24.04-arm' }}
        run: |
          set -euo pipefail
          HEAD_REPORT=$(find results/head/results -name '*-report-github.md' | sort | head -n1)
          if [[ -d results/bisect ]]; then
            FIRST=$(find results/bisect -name '*-report-github.md' | sort | head -n1)
            for R in results/bisect/*/; do
              echo "### $(basename "$R") against the release"
              python3 head/benchmarks/ab.py "$FIRST" "$(find "$R" -name '*-report-github.md' | sort | head -n1)"
            done >> "$GITHUB_STEP_SUMMARY"
          fi
          {
            echo "## Benchmark on $RUNNER: $GITHUB_REF_NAME ($(git -C head rev-parse --short HEAD))"
            echo ""
            if [[ -d base ]]; then
              BASE_REPORT=$(find results/base/results -name '*-report-github.md' | sort | head -n1)
              echo "Against $(git -C base describe --tags --exclude '*-preview.*') ($(git -C base rev-parse --short HEAD)), on the same runner."
              echo ""
              python3 head/benchmarks/ab.py "$BASE_REPORT" "$HEAD_REPORT"
            else
              python3 head/benchmarks/ab.py "$HEAD_REPORT" "$HEAD_REPORT"
            fi
            echo ""
            echo "<details><summary>Report</summary>"
            echo ""
            cat "$HEAD_REPORT"
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-${{ inputs.runner || 'ubuntu-24.04-arm' }}
          path: results
          retention-days: 30
