name: A/B Benchmark

# Runs the benchmarks on a GitHub runner: Arm64 by default, for the Arm64 paths (AdvSimd, TBL) that x64 runners never
# take, or x64, the runners (AMD EPYC, with or without AVX-512) the release reports run on. It measures
# the ref chosen in "Use workflow from" (a branch or tag of this repository), and with "compare" also the release tag
# before it (or, with "against" main, the commit where this ref left main), on the same runner, one after the other,
# with this ref's benchmark code against each ref's library; the summary compares them. Numbers for development only: the published ones come from report.yml, which runs these
# benchmarks on Arm64 for every release.
#
# No ref is taken from an input: an input ref would run code that is not the workflow's own in its cache scope (cache
# poisoning). The compared tag is a release tag found in this ref's own history, and the compared main commit is in it too.
on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner'
        required: false
        default: ubuntu-26.04-arm
        type: choice
        options:
          - ubuntu-26.04-arm
          - ubuntu-26.04
      compare:
        description: 'Also measure the previous release tag, for an A/B comparison'
        required: false
        default: false
        type: boolean
      against:
        description: 'What "compare" measures: the previous release tag, or the commit where this ref left main (its parent on main)'
        required: false
        default: release
        type: choice
        options:
          - release
          - main
      filter:
        description: 'BenchmarkDotNet filters, separated by spaces'
        required: false
        default: '*'
        type: string
      bisect:
        description: 'Measure every commit since the previous release tag that changes Nino.Core or the generator (experiment)'
        required: false
        default: false
        type: boolean
      quick:
        description: 'Quick mode (NINO_BENCH_QUICK): shorter iterations, stopping at 2% error'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

# Bash with -e and -o pipefail for every run step: a command piped into tee, grep or sed fails its step when it fails.
defaults:
  run:
    shell: bash

jobs:
  # The whole suite runs in shards (benchmarks/shards.json, "ab"), one runner each, in parallel: on one runner, both
  # refs in full mode took over three and a half hours. Each shard measures both refs one after the other on its
  # runner, so each comparison is still made on one machine; the summary job merges the shards. A filter of its own is
  # one shard. The shards hold Nino and MemoryPack only (MessagePack and protobuf-net do not change between the refs;
  # MemoryPack shows how much the runner moved), and leave the probe classes out: run them with a filter.
  plan:
    name: Plan shards
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - name: Checkout the shard list
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: benchmarks/shards.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Plan shards
        id: plan
        env:
          FILTER: ${{ inputs.filter || '*' }}
        run: |
          set -euo pipefail
          if [[ $FILTER == '*' ]]; then
            SHARDS=$(jq -c '[.ab[] | {id, filters: (.filters | join(" "))}]' benchmarks/shards.json)
          else
            SHARDS=$(jq -cn --arg f "$FILTER" '[{id: "filter", filters: $f}]')
          fi
          echo "shards=$SHARDS" >> "$GITHUB_OUTPUT"

  bench:
    name: Benchmark on ${{ inputs.runner || 'ubuntu-26.04-arm' }} (${{ matrix.shard.id }})
    needs: plan
    runs-on: ${{ inputs.runner || 'ubuntu-26.04-arm' }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      # Grows with shards.json's "ab" list: capped like every matrix a file or a request can grow (audit-ci).
      max-parallel: 6
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    env:
      # The job's counts, quick or those of the published numbers: head's benchmarks/Nino.Benchmark/NinoJobAttribute.cs.
      NINO_BENCH_QUICK: ${{ inputs.quick && '1' || '0' }}
      FILTER: ${{ matrix.shard.filters }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: head
          fetch-depth: 0
          persist-credentials: false

      # The newest release tag before this ref (not the Unity package's -preview.N alias of it), or the commit where it
      # left main (its parent, on main itself), from its own history: never a ref named by whoever dispatched. A bisect
      # measures that release as its first commit.
      - name: Check out the previous release
        if: inputs.compare && !inputs.bisect
        env:
          AGAINST: ${{ inputs.against || 'release' }}
        run: |
          set -euo pipefail
          if [[ $AGAINST == main ]]; then
            BASE=$(git -C head merge-base HEAD refs/remotes/origin/main)
            if [[ $BASE == $(git -C head rev-parse HEAD) ]]; then BASE=$(git -C head rev-parse HEAD^); fi
          else
            BASE=refs/tags/$(git -C head describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-preview.*' HEAD^)
          fi
          echo "Comparing with $BASE"
          git -C head worktree add --detach ../base "$BASE"

      # The commits of this ref's own first-parent history since that tag that change the library: never a ref named
      # by whoever dispatched.
      - name: Check out the commits to bisect
        if: inputs.bisect
        run: |
          set -euo pipefail
          BASE=$(git -C head describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-preview.*' HEAD^)
          COMMITS="$(git -C head rev-parse --short "refs/tags/$BASE") $(git -C head log --first-parent --reverse --format=%h "$BASE..HEAD" -- src/Nino.Core src/Nino.Generator | tr '\n' ' ')"
          echo "Bisecting from $BASE: $COMMITS"
          N=0
          mkdir -p bisect
          for C in $COMMITS; do
            N=$((N + 1))
            D=$(printf 'bisect/%03d-%s' "$N" "$C")
            git -C head worktree add --detach "../$D" "$C"
            rm -rf "$D/benchmarks/Nino.Benchmark"
            cp -r head/benchmarks/Nino.Benchmark "$D/benchmarks/Nino.Benchmark"
          done

      - name: Setup .NET
        # setup-dotnet itself, not ./.github/actions/setup-dotnet: the checkout is under head/.
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            10.0.x
            8.0.x

      # The same benchmarks for both refs: head's benchmark project, built against base's library.
      - name: Build
        run: |
          set -euo pipefail
          if [[ -d bisect ]]; then
            for D in bisect/*/; do
              dotnet build -c Release "$D/benchmarks/Nino.Benchmark" -v q -nologo || echo "::warning::$D did not build"
            done
          fi
          if [[ -d base ]]; then
            rm -rf base/benchmarks/Nino.Benchmark
            cp -r head/benchmarks/Nino.Benchmark base/benchmarks/Nino.Benchmark
            # A release older than a benchmark's types (one whose generator could not compile them) cannot run them:
            # base is built without them (NinoBenchLegacy, #if !NINO_BENCH_LEGACY), so they are measured on head alone;
            # if it still does not build, head alone is measured, and against main compares the code this ref changes.
            # The first build's output goes to a file: its compiler errors would otherwise show as the run's annotations,
            # although the build without those benchmarks is the expected outcome for an older release.
            if dotnet build -c Release base/benchmarks/Nino.Benchmark > base-build.log 2>&1; then
              echo "base builds every benchmark of head"
            elif dotnet build -c Release base/benchmarks/Nino.Benchmark -p:NinoBenchLegacy=true; then
              touch base/.bench-legacy
              echo "::notice::base does not build all of head's benchmarks (its generator predates them); the ones marked NINO_BENCH_LEGACY are measured on head alone"
            else
              sed 's/^/  /' base-build.log
              echo "::warning::base does not build head's benchmarks; measuring head only (try against: main)"
              rm -rf base
            fi
          fi
          dotnet build -c Release head/benchmarks/Nino.Benchmark
          lscpu | grep -E 'Model name|Flags' || true

      - name: Run
        run: |
          set -euo pipefail
          # BenchmarkDotNet runs each benchmark at high priority, which a user may not set ("Failed to set up high
          # priority (Permission denied)"): raise this shell's nice limit (RLIMIT_NICE 40, down to nice -20), which
          # dotnet and the benchmark processes inherit. Without it they run at normal priority, as before.
          sudo prlimit --pid $$ --nice=40:40 || echo "::warning::could not raise the nice limit: normal priority"
          echo "nice limit: $(ulimit -e)"
          SIDES="base head"
          if [[ -d bisect ]]; then SIDES="$(ls -d bisect/*) head"; fi
          set -f  # the filters are patterns for BenchmarkDotNet, not for the shell
          read -ra FILTERS <<< "$FILTER"
          for SIDE in $SIDES; do
            [[ -d $SIDE ]] || continue
            [[ -f $SIDE/benchmarks/Nino.Benchmark/bin/Release/net10.0/Nino.Benchmark.dll ]] || continue
            echo "== $SIDE $(git -C "$SIDE" rev-parse --short HEAD)"
            # BenchmarkDotNet builds the project again for its runs: a side built with NinoBenchLegacy (above) gets it
            # through the environment, which MSBuild reads as properties.
            LEGACY=""
            [[ -f $SIDE/.bench-legacy ]] && LEGACY=true
            (cd "$SIDE/benchmarks/Nino.Benchmark" && NinoBenchLegacy=$LEGACY dotnet bin/Release/net10.0/Nino.Benchmark.dll \
              --filter "${FILTERS[@]}" --artifacts "$GITHUB_WORKSPACE/results/$SIDE")
          done

      # What each side measured, for the summary job: the side's directory, then its description.
      - name: Record the sides
        if: always()
        run: |
          set -euo pipefail
          mkdir -p results
          for SIDE in base head $(ls -d bisect/* 2>/dev/null); do
            [[ -d $SIDE ]] || continue
            echo "$SIDE $(git -C "$SIDE" describe --tags --exclude '*-preview.*' --always) $(git -C "$SIDE" rev-parse --short HEAD)"
          done > results/sides.txt
          lscpu | grep 'Model name' > results/cpu.txt || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-${{ inputs.runner || 'ubuntu-26.04-arm' }}-${{ matrix.shard.id }}
          path: results
          retention-days: 30

  summary:
    name: Summary
    needs: bench
    if: always() && needs.bench.result != 'cancelled'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      # This ref's scripts (ab.py, merge_reports.py, bdn.py).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: benchmarks
          persist-credentials: false

      - name: Download results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: benchmark-${{ inputs.runner || 'ubuntu-26.04-arm' }}-*
          path: shards

      - name: Summary
        env:
          RUNNER: ${{ inputs.runner || 'ubuntu-26.04-arm' }}
        run: |
          set -euo pipefail
          # One report per side: its shards' reports merged, in shard order.
          report() {
            local files
            mapfile -t files < <(find shards/*/"$1"/results -name '*-report-github.md' 2>/dev/null | sort)
            ((${#files[@]})) || return 1
            if ((${#files[@]} == 1)); then cp "${files[0]}" "$2"; else python3 benchmarks/merge_reports.py "${files[@]}" > "$2"; fi
          }
          # download-artifact puts a single artifact (a filter run's one shard) straight into shards/, not into a
          # directory of its own.
          if [[ -f shards/sides.txt ]]; then mv shards one && mkdir shards && mv one shards/filter; fi
          SIDES=$(cat shards/*/sides.txt | sort -u)
          # The reports in a directory of their own: the sparse checkout also has the repository's root files.
          mkdir -p merged && cd merged
          ln -s ../shards ../benchmarks .
          report head head.md || { echo "No report of this ref" >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          {
            HEAD_LINE=$(grep '^head ' <<< "$SIDES" | head -n1)
            echo "## Benchmark on $RUNNER: $GITHUB_REF_NAME ($(cut -d' ' -f3 <<< "$HEAD_LINE"))"
            echo ""
            echo "Shards: $(find shards/ -mindepth 1 -maxdepth 1 | wc -l) runners ($(cat shards/*/cpu.txt | sed 's/Model name: *//' | sort | uniq -c | xargs))."
            echo ""
            if report base base.md; then
              BASE_LINE=$(grep '^base ' <<< "$SIDES" | head -n1)
              echo "Against $(cut -d' ' -f2 <<< "$BASE_LINE") ($(cut -d' ' -f3 <<< "$BASE_LINE")), each shard on one runner."
              echo ""
              python3 benchmarks/ab.py base.md head.md
            else
              python3 benchmarks/ab.py head.md head.md
            fi
            if grep -q '^bisect/' <<< "$SIDES"; then
              FIRST=""
              while read -r B; do
                report "$B" "$(basename "$B").md" || continue
                [[ -n $FIRST ]] || FIRST="$(basename "$B").md"
                echo ""
                echo "### $(basename "$B") against the release"
                python3 benchmarks/ab.py "$FIRST" "$(basename "$B").md"
              done < <(grep -o '^bisect/[^ ]*' <<< "$SIDES" | sort -u)
            fi
            echo ""
            echo "<details><summary>Report</summary>"
            echo ""
            cat head.md
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
          rm shards benchmarks

      - name: Upload merged reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-${{ inputs.runner || 'ubuntu-26.04-arm' }}-merged
          path: merged
          retention-days: 30
