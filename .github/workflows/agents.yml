name: Agent instructions

# The AGENTS.md indexes, the CLAUDE.md imports, the skills' metadata and every directory's file map stay current
# (tools/agents.sh --check). Runs on the paths that can make them stale: the instruction files and skills, and any
# file added to or removed from a mapped directory.
# It also checks that src/nuget-readme.md, the NuGet packages' README, is what .github/scripts/nuget_readme.py writes
# from README.md, and compiles the Python scripts that only report.yml, release.yml and triage.yml run (benchmarks/*/*.py,
# .github/scripts/*.py, .github/scripts/triage/*.py) and runs their tests, so a script that breaks fails on its push
# instead of at the next release or the next issue.
on:
  push:
    branches: [ "main" ]
    paths: &paths
      - '**/AGENTS.md'
      - '**/CLAUDE.md'
      - '.agents/**'
      - '.claude/**'
      - 'skills/**'
      - 'tools/agents.sh'
      - 'src/**'
      - 'tests/**'
      - 'benchmarks/**'
      - 'runtimes/**'
      - 'docs/**'
      - '.github/scripts/**'
      - '.github/workflows/agents.yml'
      - 'README.md'
      - 'src/nuget-readme.md'
  pull_request:
    branches: [ "main" ]
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agents-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # On maple, the repository's self-hosted runner (Python 3 and Git are all it needs), for trusted runs only (a push to
  # main, a manual run, a pull request from a branch of this repository that Dependabot did not open, while the
  # repository variable NINO_MAPLE is not false; ci.yml, at its jobs, says why and what keeps a fork off maple).
  check:
    name: Indexes, imports and file maps
    runs-on: >-
      ${{ vars.NINO_MAPLE != 'false' && github.actor != 'dependabot[bot]' &&
          (contains(fromJSON('["push", "workflow_dispatch", "schedule"]'), github.event_name) ||
           (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository &&
            github.event.pull_request.user.login != 'dependabot[bot]')) &&
          fromJSON('["self-hosted", "Linux", "X64", "maple"]') || 'ubuntu-26.04' }}
    timeout-minutes: 5
    steps:
      # maple (one runner process on a shared host, 72 GB of disk): stop at once on a nearly full disk, which would
      # otherwise surface as an odd build error, and keep every cache this job writes in RUNNER_TEMP, which "Free
      # maple's disk" deletes at its end. The toolchains stay installed (the .NET SDKs, rustup's toolchains in
      # RUSTUP_HOME); NuGet's, npm's, Cargo's and Go's caches, dotnet's home and the temporary files do not outlive the
      # job. GitHub's runners skip it.
      - name: Prepare maple
        if: runner.environment == 'self-hosted'
        run: |
          need_gb=10
          free_gb=$(df -Pk "$RUNNER_TEMP" | awk 'NR == 2 { print int($4 / 1048576) }')
          echo "maple: $free_gb GB free under $RUNNER_TEMP"
          if (( free_gb < need_gb )); then
            echo "::error::maple has $free_gb GB free, under the $need_gb GB a job may need: free its disk, then re-run"
            exit 1
          fi
          home="$RUNNER_TEMP/home"
          mkdir -p "$home/tmp"
          {
            echo "NUGET_PACKAGES=$home/nuget/packages"
            echo "NUGET_HTTP_CACHE_PATH=$home/nuget/http-cache"
            echo "NUGET_PLUGINS_CACHE_PATH=$home/nuget/plugins-cache"
            echo "DOTNET_CLI_HOME=$home"
            echo "npm_config_cache=$home/npm"
            echo "CARGO_HOME=$home/cargo"
            echo "GOMODCACHE=$home/go/mod"
            echo "GOCACHE=$home/go/build"
            echo "TMPDIR=$home/tmp"
          } >> "$GITHUB_ENV"

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check (tools/agents.sh --check)
        run: tools/agents.sh --check
      - name: Check the NuGet README (.github/scripts/nuget_readme.py --check)
        run: python3 .github/scripts/nuget_readme.py --check
      # In .github/scripts only test_changed_paths.py holds tests (test_shards.py is ci.yml's shard checker, no
      # tests), so it is named instead of discovered with test_*.py. The triage folder's tests (the milestone rule and
      # the checks of the model's answer) need no package, the anthropic SDK is imported only for the model call.
      - name: Compile and test the release scripts
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/pycache
        run: |
          python3 -m py_compile benchmarks/*/*.py .github/scripts/*.py .github/scripts/triage/*.py
          python3 -m unittest discover -s benchmarks/reports -p 'test_*.py'
          python3 -m unittest discover -s .github/scripts -p 'test_changed_paths.py'
          python3 -m unittest discover -s .github/scripts/triage -p 'test_*.py'

      # maple keeps a job's workspace and RUNNER_TEMP until its next job: give the disk back, whatever happened.
      - name: Free maple's disk
        if: always() && runner.environment == 'self-hosted'
        run: find "$GITHUB_WORKSPACE" "$RUNNER_TEMP" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
