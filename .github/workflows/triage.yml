name: Issue triage

# Labels a new or reopened issue, puts it in its milestone and asks Claude Haiku once for its kind, areas, a duplicate,
# a parent and a suggested split (.github/scripts/triage/triage.py, which checks every answer before applying it).
# Issue text comes from anyone, so this runs on a GitHub-hosted runner, never the self-hosted one, and the text only
# ever reaches the model as data: no step interpolates it. Claude is reached through Workload Identity Federation (the
# job's GitHub OIDC token exchanged for a short-lived Anthropic token), with no API key stored anywhere. If the model
# call fails, the labels and milestone the script computes itself still apply and the job still passes.
# Re-run one issue: Actions > Issue triage > Run workflow on main, with its number.
on:
  issues:
    types: [ opened, reopened ]
  workflow_dispatch:
    inputs:
      issue:
        description: Number of the issue to triage again
        required: true
        type: number

permissions:
  issues: write
  contents: read
  id-token: write

concurrency:
  group: triage-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: false

jobs:
  triage:
    name: Triage
    if: github.event_name == 'workflow_dispatch' || github.event.issue.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The federation rule, its organization and the service account it acts as, kept as repository secrets (not given
    # to workflows from forks; this one runs on issue events from the default branch).
    env:
      ANTHROPIC_FEDERATION_RULE_ID: ${{ secrets.ANTHROPIC_FEDERATION_RULE_ID }}
      ANTHROPIC_ORGANIZATION_ID: ${{ secrets.ANTHROPIC_ORGANIZATION_ID }}
      ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ secrets.ANTHROPIC_SERVICE_ACCOUNT_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts/triage
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install the Anthropic SDK (pinned, hashes checked)
        run: python -m pip install --quiet --require-hashes --only-binary ':all:' -r .github/scripts/triage/requirements.txt
      # The token lives about five minutes and is single use, so it is fetched right before the script. A failure here
      # leaves no token: the script's model call then fails, and it still applies its own labels and milestone.
      - name: Fetch the GitHub OIDC token for Anthropic
        env:
          ANTHROPIC_IDENTITY_TOKEN_FILE: ${{ runner.temp }}/gha-jwt
        run: |
          if token=$(curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" | jq -er .value); then
            echo "::add-mask::$token"
            printf '%s' "$token" > "$ANTHROPIC_IDENTITY_TOKEN_FILE"
          else
            echo "::warning::Could not fetch the OIDC token; triage runs without the model."
          fi
      - name: Triage
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue }}
          ANTHROPIC_IDENTITY_TOKEN_FILE: ${{ runner.temp }}/gha-jwt
        run: python .github/scripts/triage/triage.py --issue "$ISSUE_NUMBER"
