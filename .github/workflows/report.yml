name: Benchmark and Performance Report

on:
  workflow_dispatch: # Allow manual triggering
    inputs:
      tag_name:
        description: 'Tag to benchmark (optional, defaults to latest)'
        required: false
        type: string
  workflow_call: # Allow calling from other workflows
    inputs:
      tag_name:
        description: 'Tag to benchmark'
        required: false
        type: string
  release:
    types: [published] # Run when a release is published

# Security: Minimal required permissions
permissions:
  contents: write       # Update release notes
  actions: write        # Upload artifacts
  
# Prevent concurrent benchmark runs
concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: false

env:
  # Same settings for every run (docs/v4-benchmarks.md): ShortRun's 3 iterations are too few, and one process a
  # case leaves its layout to chance (a 12 ns case moved by 13% between processes); the mean of three does not.
  BDN_ARGS: --launchCount 3 --warmupCount 5 --iterationCount 15
  # The second section of the release body: Nino v3 3.3.13 against this release, on the SimpleTest runners.
  # The docs site (nino.docs scripts/sync-benchmarks.ts) looks for this heading.
  V3_HEADING: "## 📊 v3 3.3.13 vs v4 (same machine)"
  # The third section: the same benchmarks on an Arm64 runner. The docs site (sync-benchmarks.ts) looks for this
  # heading; it must never contain the words "Performance Report", by which parsers find the x64 report.
  ARM64_HEADING: "## 📊 Arm64 benchmark"
  # The last sections: the runtimes outside .NET (benchmarks/runtimes_report.py's HEADINGS, then its ARM64_HEADINGS),
  # appended after every other section by the runtimes jobs. Their headings and tables never contain "Performance
  # Report", "Method" or "Mean", so nothing reading the .NET report takes them for its own, and no Arm64 heading
  # contains an x64 one, which the docs site finds by its first occurrence.

jobs:
  target:
    name: Pick the release
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.determine_target.outputs.target_ref }}
      skip: ${{ steps.check_benchmark.outputs.skip }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Only a release tag of this repository whose commit is on main is benchmarked: the tag's code then runs in this
      # workflow's (main's) cache scope, so it must be code that was merged and released, never an arbitrary ref.
      # Values from the event and inputs reach the script through the environment, never pasted into it.
      - name: Determine target tag
        id: determine_target
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          TAG_NAME=${RELEASE_TAG:-${INPUT_TAG:-}}
          if [[ -z "$TAG_NAME" ]]; then
            TAG_NAME=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-preview.*' origin/main)
          fi
          if [[ ! "$TAG_NAME" =~ ^v[0-9][0-9A-Za-z.+-]*$ ]] || ! git rev-parse -q --verify "refs/tags/$TAG_NAME^{commit}" >/dev/null; then
            echo "::error::$TAG_NAME is not a release tag of this repository"
            exit 1
          fi
          if ! git merge-base --is-ancestor "refs/tags/$TAG_NAME" origin/main; then
            echo "::error::$TAG_NAME is not on main: only released code is benchmarked here"
            exit 1
          fi
          echo "Benchmarking $TAG_NAME"
          echo "target_ref=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Check if benchmark already exists
        id: check_benchmark
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.determine_target.outputs.target_ref }}
        run: |
          RELEASE_BODY=$(gh release view "$TAG_NAME" --json body --jq '.body')
          # Skip only when every section is there; otherwise run and add the missing ones.
          if [[ $RELEASE_BODY == *"Performance Report"* && $RELEASE_BODY == *"$V3_HEADING"* &&
                $RELEASE_BODY == *"$ARM64_HEADING"* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "⏭️ Benchmark, v3 comparison and Arm64 benchmark already exist for this release"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "✅ A section is missing, will run"
          fi

  # The benchmark classes run in parallel, two or more per runner (so each joined report has a Type column), every
  # serializer's runs of a case (Nino, MemoryPack, MessagePack, protobuf-net) always on one runner. Ten shards of 30
  # to 46 cases (about a minute each with three launches); BclTypesTest, CollectionsTest and CommonTypesTest are split
  # by type. SimpleTest is split into its serialize (a) and deserialize (h) cases, and on x64 each half of v3 runs
  # directly before the same half of v4, on its runner, as benchmarks/run.sh does (v3 takes about 10 minutes a half,
  # so these shards have fewer v4 cases). The publish job merges the reports into one table
  # (benchmarks/merge_reports.py). The same shards run on Arm64 runners too, for the Arm64 section of the release
  # (AdvSimd and TBL paths that x64 never takes); an Arm64 failure leaves that section out and never blocks the x64 report.
  bench:
    name: Benchmark (${{ matrix.arch }} ${{ matrix.shard }})
    needs: target
    if: needs.target.outputs.skip != 'true'
    # Named images, not ubuntu-latest: the OS under the benchmark changes only when these lines do.
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, shard: a, filters: "'*.SimpleTest.NinoSerialize*' '*.SimpleTest.MemoryPackSerialize*' '*.SimpleTest.MessagePackSerialize*' '*.SimpleTest.ProtobufSerialize*' '*.PooledTest.*' '*.ReferenceTest.*'", v3: "'*SimpleTest.NinoSerialize*' '*SimpleTest.MemoryPackSerialize*'" }
          - { arch: x64, shard: h, filters: "'*.SimpleTest.NinoDeserialize*' '*.SimpleTest.MemoryPackDeserialize*' '*.SimpleTest.MessagePackDeserialize*' '*.SimpleTest.ProtobufDeserialize*' '*.VersionTolerantTest.*'", v3: "'*SimpleTest.NinoDeserialize*' '*SimpleTest.MemoryPackDeserialize*'" }
          - { arch: x64, shard: b, filters: "'*.FixedSizeTest.*' '*.PooledGraphTest.*'" }
          - { arch: x64, shard: c, filters: "'*.GenericPolymorphicTest.*' '*.BclTypesTest.*BigInteger' '*.BclTypesTest.*BitArray'" }
          - { arch: x64, shard: d, filters: "'*.PolymorphicTest.*' '*.CommonTypesTest.*Players' '*.CommonTypesTest.*Orders'" }
          - { arch: x64, shard: e, filters: "'*.CommonTypesTest.*Shapes' '*.CommonTypesTest.*Tree' '*.CommonTypesTest.*Inventory' '*.CommonTypesTest.*Waypoints' '*.CommonTypesTest.*StringDictionary' '*.BclTypesTest.*CultureInfo' '*.BclTypesTest.*TimeZoneInfo'" }
          - { arch: x64, shard: f, filters: "'*.BclTypesTest.*ImmutableHashSet' '*.BclTypesTest.*ImmutableSortedSet' '*.BclTypesTest.*ImmutableQueue' '*.BclTypesTest.*ImmutableStack' '*.BclTypesTest.*ImmutableDictionary' '*.BclTypesTest.*BlockingCollection'" }
          - { arch: x64, shard: g, filters: "'*.BclTypesTest.*ImmutableSortedDictionary' '*.BclTypesTest.*Uri' '*.BclTypesTest.*Version' '*.BclTypesTest.*StringBuilder' '*.BclTypesTest.*Lazy' '*.BclTypesTest.*Memory' '*.BclTypesTest.*ReadOnlySequence'" }
          - { arch: x64, shard: i, filters: "'*.BclTypesTest.*ReadOnlyCollection' '*.BclTypesTest.*Lookup' '*.CollectionsTest.*TupleList' '*.CollectionsTest.*KeyValuePairs' '*.CollectionsTest.*HashSet' '*.CollectionsTest.*Queue'" }
          - { arch: x64, shard: j, filters: "'*.CollectionsTest.*LinkedList' '*.CollectionsTest.*SortedSet' '*.CollectionsTest.*SortedDictionary' '*.CollectionsTest.*SortedList' '*.CollectionsTest.*ConcurrentDictionary'" }
          - { arch: arm64, shard: a, filters: "'*.SimpleTest.NinoSerialize*' '*.SimpleTest.MemoryPackSerialize*' '*.SimpleTest.MessagePackSerialize*' '*.SimpleTest.ProtobufSerialize*' '*.PooledTest.*' '*.ReferenceTest.*'" }
          - { arch: arm64, shard: h, filters: "'*.SimpleTest.NinoDeserialize*' '*.SimpleTest.MemoryPackDeserialize*' '*.SimpleTest.MessagePackDeserialize*' '*.SimpleTest.ProtobufDeserialize*' '*.VersionTolerantTest.*'" }
          - { arch: arm64, shard: b, filters: "'*.FixedSizeTest.*' '*.PooledGraphTest.*'" }
          - { arch: arm64, shard: c, filters: "'*.GenericPolymorphicTest.*' '*.BclTypesTest.*BigInteger' '*.BclTypesTest.*BitArray'" }
          - { arch: arm64, shard: d, filters: "'*.PolymorphicTest.*' '*.CommonTypesTest.*Players' '*.CommonTypesTest.*Orders'" }
          - { arch: arm64, shard: e, filters: "'*.CommonTypesTest.*Shapes' '*.CommonTypesTest.*Tree' '*.CommonTypesTest.*Inventory' '*.CommonTypesTest.*Waypoints' '*.CommonTypesTest.*StringDictionary' '*.BclTypesTest.*CultureInfo' '*.BclTypesTest.*TimeZoneInfo'" }
          - { arch: arm64, shard: f, filters: "'*.BclTypesTest.*ImmutableHashSet' '*.BclTypesTest.*ImmutableSortedSet' '*.BclTypesTest.*ImmutableQueue' '*.BclTypesTest.*ImmutableStack' '*.BclTypesTest.*ImmutableDictionary' '*.BclTypesTest.*BlockingCollection'" }
          - { arch: arm64, shard: g, filters: "'*.BclTypesTest.*ImmutableSortedDictionary' '*.BclTypesTest.*Uri' '*.BclTypesTest.*Version' '*.BclTypesTest.*StringBuilder' '*.BclTypesTest.*Lazy' '*.BclTypesTest.*Memory' '*.BclTypesTest.*ReadOnlySequence'" }
          - { arch: arm64, shard: i, filters: "'*.BclTypesTest.*ReadOnlyCollection' '*.BclTypesTest.*Lookup' '*.CollectionsTest.*TupleList' '*.CollectionsTest.*KeyValuePairs' '*.CollectionsTest.*HashSet' '*.CollectionsTest.*Queue'" }
          - { arch: arm64, shard: j, filters: "'*.CollectionsTest.*LinkedList' '*.CollectionsTest.*SortedSet' '*.CollectionsTest.*SortedDictionary' '*.CollectionsTest.*SortedList' '*.CollectionsTest.*ConcurrentDictionary'" }
    env:
      V3_OUT: ${{ github.workspace }}/v3-results
      OUT: ${{ github.workspace }}/report
      FILTERS: ${{ matrix.filters }}
      V3_FILTERS: ${{ matrix.v3 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.target.outputs.tag }}
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            ${{ vars.DOTNET_VERSION || '10.0.x' }}
            10.0.x
            8.0.x

      # Releases before the move of the benchmarks out of src/ (rc.7 and older) keep the project in src/Nino.Benchmark.
      - name: Find the benchmark project
        run: |
          if [ -d benchmarks/Nino.Benchmark ]; then echo "BENCH=benchmarks/Nino.Benchmark" >> "$GITHUB_ENV"
          else echo "BENCH=src/Nino.Benchmark" >> "$GITHUB_ENV"; fi

      - name: Build benchmark project
        working-directory: ${{ env.BENCH }}
        run: |
          dotnet build -c Release
          # Every case reads back what the others read and writes its payload's bytes (Verify.cs).
          dotnet bin/Release/net10.0/Nino.Benchmark.dll --verify

      # Nino v3 3.3.13 from nuget.org, the same SimpleTest (the benchmark project built with NINO_BENCH_V3=true, into
      # bin/v3; releases up to rc.8's development kept it in benchmarks/v3, older ones have none). It runs once,
      # directly before the v4 run, as benchmarks/run.sh does; MemoryPack runs in both, so drift of the runner shows.
      # A v3 failure never blocks the Performance Report: the v3 section is then left out.
      - name: Build v3 benchmark (Nino 3.3.13)
        id: v3_build
        if: matrix.v3
        continue-on-error: true
        run: |
          if [ -d benchmarks/v3 ]; then
            echo "V3_DIR=benchmarks/v3" >> "$GITHUB_ENV"; echo "V3_DLL=bin/Release/net10.0/Nino.Benchmark.dll" >> "$GITHUB_ENV"
            (cd benchmarks/v3 && dotnet build -c Release && dotnet bin/Release/net10.0/Nino.Benchmark.dll --verify)
          else
            echo "V3_DIR=$BENCH" >> "$GITHUB_ENV"; echo "V3_DLL=bin/v3/Release/net10.0/Nino.Benchmark.dll" >> "$GITHUB_ENV"
            (cd "$BENCH" && NINO_BENCH_V3=true dotnet build -c Release && NINO_BENCH_V3=true dotnet bin/v3/Release/net10.0/Nino.Benchmark.dll --verify)
          fi

      - name: Run v3 benchmark
        if: matrix.v3 && steps.v3_build.outcome == 'success'
        continue-on-error: true
        working-directory: ${{ env.V3_DIR }}
        run: |
          # BenchmarkDotNet runs each benchmark at high priority, which a user may not set ("Failed to set up high
          # priority (Permission denied)"): raise this shell's nice limit (RLIMIT_NICE 40, down to nice -20), which
          # dotnet and the benchmark processes inherit. Without it they run at normal priority, as before.
          sudo prlimit --pid $$ --nice=40:40 || echo "::warning::could not raise the nice limit: normal priority"
          echo "nice limit: $(ulimit -e)"
          # Nino and MemoryPack only: nothing reads v3's MessagePack rows, and they were a third of this step.
          # This shard's half of SimpleTest (the matrix's v3 globs).
          eval "V3_PATTERNS=($V3_FILTERS)"
          # NINO_BENCH_V3: the benchmark project's v3 build, which BenchmarkDotNet builds again for its runs.
          # shellcheck disable=SC2086 # BDN_ARGS is a list of arguments
          NINO_BENCH_V3=true dotnet "$V3_DLL" --filter "${V3_PATTERNS[@]}" $BDN_ARGS \
            --artifacts "$V3_OUT"
          # Under BenchmarkDotNet's own file name, which names the class (benchmarks/bdn.py, class_name).
          mkdir -p "$OUT/v3-${{ matrix.shard }}"
          cp "$(find "$V3_OUT/results" -name '*-report-github.md' | head -n1)" "$OUT/v3-${{ matrix.shard }}/"

      - name: Run benchmarks
        working-directory: ${{ env.BENCH }}
        run: |
          # BenchmarkDotNet runs each benchmark at high priority, which a user may not set ("Failed to set up high
          # priority (Permission denied)"): raise this shell's nice limit (RLIMIT_NICE 40, down to nice -20), which
          # dotnet and the benchmark processes inherit. Without it they run at normal priority, as before.
          sudo prlimit --pid $$ --nice=40:40 || echo "::warning::could not raise the nice limit: normal priority"
          echo "nice limit: $(ulimit -e)"
          # The shard's filters, quoted globs (the matrix above).
          eval "PATTERNS=($FILTERS)"
          # The cases this shard runs, and on one shard every case, so the publish job can name a case no shard ran
          # (the BclTypesTest and CollectionsTest shards select types by name).
          mkdir -p "$OUT"
          dotnet bin/Release/net10.0/Nino.Benchmark.dll --list flat --filter "${PATTERNS[@]}" \
            | grep '^Nino\.Benchmark\.' > "$OUT/cases-${{ matrix.arch }}-${{ matrix.shard }}.txt" || true
          if [[ "${{ matrix.shard }}" == a ]]; then
            dotnet bin/Release/net10.0/Nino.Benchmark.dll --list flat --filter '*' \
              | grep '^Nino\.Benchmark\.' > "$OUT/cases-${{ matrix.arch }}-all.txt" || true
          fi
          # The settings of the published numbers (BDN_ARGS above, docs/v4-benchmarks.md).
          # shellcheck disable=SC2086 # BDN_ARGS is a list of arguments
          dotnet run -c Release --no-build -- --filter "${PATTERNS[@]}" $BDN_ARGS
          # The joined report of the shard's classes; a shard of one class has none, only that class's report.
          REPORT=$(find BenchmarkDotNet.Artifacts/results -name "*-joined-*-report-github.md" | head -n1)
          if [[ -z "$REPORT" ]]; then
            mapfile -t ONE < <(find BenchmarkDotNet.Artifacts/results -name "*-report-github.md")
            if (( ${#ONE[@]} == 1 )); then REPORT=${ONE[0]}; fi
          fi
          if [[ -z "$REPORT" ]]; then
            echo "❌ No joined report (or one class's report) in BenchmarkDotNet.Artifacts/results"
            ls -la BenchmarkDotNet.Artifacts/results || true
            exit 1
          fi
          # x64 reports go in v4-<shard>/, Arm64 ones in arm64-<shard>/ (the publish job tells them apart by that),
          # under BenchmarkDotNet's own file name, which names the class of a one-class report (bdn.py, class_name).
          DEST="$OUT/${{ matrix.arch == 'arm64' && 'arm64' || 'v4' }}-${{ matrix.shard }}"
          mkdir -p "$DEST"
          cp "$REPORT" "$DEST/"

      - name: Upload the report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report-${{ matrix.arch }}-${{ matrix.shard }}
          path: report
          retention-days: 1

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-results-${{ needs.target.outputs.tag }}-${{ matrix.arch }}-${{ matrix.shard }}
          path: |
            ${{ env.BENCH }}/BenchmarkDotNet.Artifacts/results
            v3-results/results
          retention-days: 90

  publish:
    name: Publish the report
    needs: [ target, bench ]
    # Also when an Arm64 shard failed: the x64 report is checked below, and a missing Arm64 one only drops its section.
    if: ${{ !cancelled() && needs.target.outputs.skip != 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      tag_name: ${{ needs.target.outputs.tag }}
      # The release asset that holds the whole Arm64 section (the docs site reads it when the body has only a link).
      ARM64_ASSET: arm64-benchmark.md
      # The full BenchmarkDotNet reports, attached to the release: the body has the short tables of compact_report.py.
      FULL_X64_ASSET: benchmark-x64-full.md
      FULL_ARM64_ASSET: benchmark-arm64-full.md
      FULL_V3_ASSET: benchmark-v3-full.md
      # Every benchmark class of benchmarks/Nino.Benchmark: one table in the Performance Report, its Type column naming the
      # class. A class missing from the table is reported as a warning.
      # The shards of the bench job's matrix, per architecture.
      SHARDS: 10
      # The x64 shards that run half of v3 each (matrix.v3): the v3 section needs both halves.
      V3_SHARDS: 2
      BENCH_CLASSES: SimpleTest PolymorphicTest GenericPolymorphicTest PooledTest PooledGraphTest ReferenceTest VersionTolerantTest FixedSizeTest CommonTypesTest CollectionsTest BclTypesTest

    steps:
      # This workflow's commit, for its scripts (merge_reports.py, compare.py, readme.py), whichever tag was measured.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download the reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: report-*
          merge-multiple: true
          path: ${{ runner.temp }}/reports

      - name: Merge the reports
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/reports"
          ls -laR "$DIR"
          shopt -s nullglob
          # One report per shard directory (v4-<shard>/, arm64-<shard>/, v3-<shard>/), in shard order.
          X64=("$DIR"/v4-*/*-report-github.md) ARM64=("$DIR"/arm64-*/*-report-github.md)
          if (( ${#X64[@]} != SHARDS )); then
            echo "❌ ${#X64[@]} of the $SHARDS x64 reports: not publishing a partial Performance Report"
            exit 1
          fi
          python3 benchmarks/merge_reports.py "${X64[@]}" > "$RUNNER_TEMP/v4-report.md"
          for CLASS in $BENCH_CLASSES; do
            if grep -qE "^\| *${CLASS} +\|" "$RUNNER_TEMP/v4-report.md"; then
              echo "  ✅ $CLASS"
            else
              echo "::warning::$CLASS is missing from the benchmark report"
            fi
          done
          echo "BENCHMARK_FILE=$RUNNER_TEMP/v4-report.md" >> "$GITHUB_ENV"
          # Arm64: every shard or no section (a partial table would read as the whole suite).
          if (( ${#ARM64[@]} == SHARDS )); then
            python3 benchmarks/merge_reports.py "${ARM64[@]}" > "$RUNNER_TEMP/arm64-report.md"
            echo "ARM64_REPORT=$RUNNER_TEMP/arm64-report.md" >> "$GITHUB_ENV"
          else
            echo "::warning::${#ARM64[@]} of the $SHARDS Arm64 reports: the Arm64 section is left out"
          fi
          V3=("$DIR"/v3-*/*-report-github.md)
          if (( ${#V3[@]} == V3_SHARDS )); then
            python3 benchmarks/merge_reports.py "${V3[@]}" > "$RUNNER_TEMP/v3-report.md"
            echo "V3_REPORT=$RUNNER_TEMP/v3-report.md" >> "$GITHUB_ENV"
          elif (( ${#V3[@]} )); then
            echo "::warning::${#V3[@]} of the $V3_SHARDS v3 reports: the v3 comparison is left out"
          fi
          # A case that no shard's filters select (a new one, say) is left out of the report: name it. The probes are
          # not run on purpose.
          if [[ -f "$DIR/cases-x64-all.txt" ]]; then
            grep -v 'Probe' "$DIR/cases-x64-all.txt" | sort -u > "$RUNNER_TEMP/all.txt"
            cat "$DIR"/cases-x64-[a-z].txt | sort -u > "$RUNNER_TEMP/run.txt"
            for CASE in $(comm -23 "$RUNNER_TEMP/all.txt" "$RUNNER_TEMP/run.txt"); do
              echo "::warning::$CASE is in no shard of report.yml: add it to the bench matrix"
            done
          fi

      - name: Update release notes with benchmark
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          
          TAG_NAME="${{ env.tag_name }}"
          
          # Get current release body
          gh release view "$TAG_NAME" --json body --jq '.body' > current_notes.md
          HAS_PERF=false; HAS_V3=false; HAS_ARM64=false
          grep -q "Performance Report" current_notes.md && HAS_PERF=true
          grep -qF "$V3_HEADING" current_notes.md && HAS_V3=true
          grep -qF "$ARM64_HEADING" current_notes.md && HAS_ARM64=true

          # The Performance Report section: the docs site reads its Method, Mean, Payload and Allocated columns. The body
          # has the short tables (benchmarks/compact_report.py), as the release notes of a major version take most of
          # GitHub's 125,000 characters; the full report is attached.
          : > perf_section.md
          if [[ $HAS_PERF == true ]]; then
            echo "⏭️ Performance Report already exists in release notes"
          else
            # The README numbers are regenerated only from the run the release body shows.
            echo "NEW_REPORT=true" >> "$GITHUB_ENV"
            {
              echo "## 📊 Performance Report"
              echo ""
              echo "<details>"
              echo "<summary>Click to expand benchmark results</summary>"
              echo ""
              python3 "$GITHUB_WORKSPACE/benchmarks/compact_report.py" "$BENCHMARK_FILE"
              echo ""
              echo "Median, Min, Max and the GC counts: [${FULL_X64_ASSET}](https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG_NAME}/${FULL_X64_ASSET})."
              echo ""
              echo "</details>"
              echo ""
              echo "---"
              echo "*Benchmark generated automatically on $(date -u '+%Y-%m-%d %H:%M:%S UTC')*"
            } > perf_section.md
          fi

          # The v3 section: the compare.py table (v4 against v3) and the v3 run's environment; the v3 report is attached.
          : > v3_section.md
          V3_REPORT=${V3_REPORT:-}
          if [[ $HAS_V3 == true ]]; then
            echo "⏭️ v3 comparison already exists in release notes"
          elif [[ -z "$V3_REPORT" ]]; then
            echo "⚠️ No v3 report (see the v3 steps): the v3 comparison is left out"
          else
            {
              echo "$V3_HEADING"
              echo ""
              echo "<details>"
              echo "<summary>Nino v3 3.3.13 (NuGet) against ${TAG_NAME}, back to back on the same runners</summary>"
              echo ""
              # Never write the words "Performance Report" here: parsers find the v4 report by them.
              echo "The v3 build of \`benchmarks/Nino.Benchmark\` (the Nino and MemoryPack cases of the same \`SimpleTest\`, built against Nino 3.3.13 from nuget.org) ran directly before the v4"
              echo "SimpleTest run below, its serialize and its deserialize cases each on the runner of the same v4 cases, with"
              echo "the same BenchmarkDotNet settings"
              echo "(\`${BDN_ARGS}\`). MemoryPack runs in both, so its two columns show how much the runner moved."
              echo ""
              echo "### v4 vs v3"
              echo ""
              COMPARE="$GITHUB_WORKSPACE/benchmarks/compare_v3.py"
              [ -f "$COMPARE" ] || COMPARE="$GITHUB_WORKSPACE/benchmarks/v3/compare.py"
              python3 "$COMPARE" "$V3_REPORT" "$BENCHMARK_FILE" \
                || echo "compare.py could not read the reports."
              echo ""
              # The environment block of the first half (the docs site names its machine from it), then the
              # runner of each half; the report is attached.
              echo "### v3 3.3.13 runners"
              echo ""
              awk '/^\|/{exit} {print}' "$V3_REPORT"
              awk 'seen && !/^\|/ {print} /^\|/ {seen=1}' "$V3_REPORT" | sed '1{/^$/d}'
              echo ""
              echo "The v3 report: [${FULL_V3_ASSET}](https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG_NAME}/${FULL_V3_ASSET})."
              echo ""
              echo "</details>"
            } > v3_section.md
          fi

          # The Arm64 section: the merged Arm64 report, in the format of the Performance Report's table.
          : > arm64_section.md
          ARM64_REPORT=${ARM64_REPORT:-}
          if [[ $HAS_ARM64 == true ]]; then
            echo "⏭️ Arm64 benchmark already exists in release notes"
          elif [[ -z "$ARM64_REPORT" ]]; then
            echo "⚠️ No Arm64 report (see the Arm64 jobs): the Arm64 section is left out"
          else
            {
              echo "$ARM64_HEADING"
              echo ""
              echo "<details>"
              echo "<summary>The same benchmarks of ${TAG_NAME} on an Arm64 runner</summary>"
              echo ""
              # Never write the words "Performance Report" here: parsers find the x64 report by them.
              echo "The benchmark classes of the x64 report below, with the same BenchmarkDotNet settings"
              echo "(\`${BDN_ARGS}\`), on GitHub's \`ubuntu-26.04-arm\` runners. Compare the serializers within"
              echo "this table: the runners differ from the x64 ones, so times across the two tables say little."
              echo ""
              python3 "$GITHUB_WORKSPACE/benchmarks/compact_report.py" "$ARM64_REPORT"
              echo ""
              echo "Median, Min, Max and the GC counts: [${FULL_ARM64_ASSET}](https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG_NAME}/${FULL_ARM64_ASSET})."
              echo ""
              echo "</details>"
            } > arm64_section.md
          fi

          if [[ ! -s perf_section.md && ! -s v3_section.md && ! -s arm64_section.md ]]; then
            echo "⏭️ Nothing to add"
            exit 0
          fi

          # The v3 section goes before the Performance Report: parsers that read every table from
          # "Performance Report" to the end of the body then never see the v3 tables.
          TAG_NAME="$TAG_NAME" python3 - <<'EOF'
          import os, re
          body = open("current_notes.md", encoding="utf-8").read().rstrip("\n")
          v3 = open("v3_section.md", encoding="utf-8").read().strip("\n")
          arm64 = open("arm64_section.md", encoding="utf-8").read().strip("\n")
          perf = open("perf_section.md", encoding="utf-8").read().strip("\n")
          match = re.search(r"^.*Performance Report", body, re.MULTILINE)
          if match:  # the report is already there: put the v3 section in front of its heading
              head, tail = body[:match.start()].rstrip("\n"), body[match.start():]
          else:
              head, tail = body, perf
          # The Arm64 section goes before the Performance Report too, for the same reason.
          text = "\n\n".join(part for part in (head, v3, arm64, tail) if part) + "\n"
          if len(text) > 125000 and arm64:  # GitHub's limit for a release body: the Arm64 section is attached instead
              arm64 = "\n\n".join((os.environ["ARM64_HEADING"],
                  f"The Arm64 report is attached to this release: [{os.environ['ARM64_ASSET']}]"
                  f"(https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/"
                  f"{os.environ['TAG_NAME']}/{os.environ['ARM64_ASSET']}) (the release notes have no room for it)."))
              text = "\n\n".join(part for part in (head, v3, arm64, tail) if part) + "\n"
          open("updated_notes.md", "w", encoding="utf-8").write(text)
          EOF

          # The whole Arm64 section is attached to the release too, where the docs site reads it when the body has
          # only a link to it, and so are the full reports the body links to.
          if [[ -s arm64_section.md ]]; then
            cp arm64_section.md "$ARM64_ASSET"
            gh release upload "$TAG_NAME" "$ARM64_ASSET" --clobber
          fi
          if [[ -s perf_section.md ]]; then
            cp "$BENCHMARK_FILE" "$FULL_X64_ASSET"
            gh release upload "$TAG_NAME" "$FULL_X64_ASSET" --clobber
          fi
          if [[ -s arm64_section.md ]]; then
            cp "$ARM64_REPORT" "$FULL_ARM64_ASSET"
            gh release upload "$TAG_NAME" "$FULL_ARM64_ASSET" --clobber
          fi
          if [[ -s v3_section.md ]]; then
            cp "$V3_REPORT" "$FULL_V3_ASSET"
            gh release upload "$TAG_NAME" "$FULL_V3_ASSET" --clobber
          fi

          # Update the release
          gh release edit "$TAG_NAME" --notes-file updated_notes.md
          echo "✅ Release notes updated with benchmark results"
      
      # The chart crop below needs Pillow; the runner's system Python does not take pip installs.
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'

      # README.md, README.zh.md, the README chart and the runtime tables of docs/v4-benchmarks.md show the newest v4
      # release: regenerate them (benchmarks/readme.py, between the <!--bench:...--> markers) from this run and push
      # them to main.
      - name: Update the README benchmark numbers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          LATEST=$(gh release list --limit 50 --json tagName,publishedAt \
            --jq '[.[] | select(.tagName | startswith("v4."))] | sort_by(.publishedAt) | last | .tagName')
          if [[ "$tag_name" != "$LATEST" ]]; then
            echo "⏭️ $tag_name is not the newest v4 release ($LATEST): README left as it is"
            exit 0
          fi
          if [[ "${NEW_REPORT:-}" != true ]]; then
            echo "⏭️ The release already had its Performance Report: README left as it is"
            exit 0
          fi

          # This run's reports, then main's README and script
          V3_ARGS=()
          if [[ -n "${V3_REPORT:-}" ]]; then
            V3_ARGS+=(--v3 "$V3_REPORT")
          fi
          git fetch origin main
          git checkout --detach origin/main

          if ! python3 benchmarks/readme.py --v4 "$BENCHMARK_FILE" ${V3_ARGS[@]+"${V3_ARGS[@]}"} \
            --tag "$tag_name" --png-html "$RUNNER_TEMP/chart.html"; then
            echo "::warning::benchmarks/readme.py could not read this run: README left as it is"
            exit 0
          fi
          # README.md goes into the NuGet packages, and nuget.org shows no SVG: render the PNG with Chrome.
          # Headless Chrome paints less than its window, so it gets a taller window and the image is cropped.
          HEIGHT=$(grep -oE 'viewBox="0 0 820 [0-9]+"' docs/assets/benchmark.svg | grep -oE '[0-9]+"$' | tr -d '"')
          google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars --force-device-scale-factor=2 \
            --default-background-color=00000000 --window-size=820,$((HEIGHT + 300)) \
            --screenshot="$RUNNER_TEMP/chart.png" "file://$RUNNER_TEMP/chart.html"
          python3 -m pip install --quiet pillow
          python3 -c 'import sys; from PIL import Image; Image.open(sys.argv[1]).crop((0, 0, 1640, 2 * int(sys.argv[2]))).save(sys.argv[3])' \
            "$RUNNER_TEMP/chart.png" "$HEIGHT" docs/assets/benchmark.png

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.zh.md docs/v4-benchmarks.md docs/assets/benchmark.svg docs/assets/benchmark.png
          if git diff --cached --quiet; then
            echo "⏭️ README numbers unchanged"
            exit 0
          fi
          git commit -m "Update README benchmark numbers for $tag_name"
          for _ in 1 2 3; do
            if git push origin HEAD:main; then
              echo "✅ README benchmark numbers updated"
              exit 0
            fi
            git pull --rebase origin main
          done
          echo "::warning::Could not push the README update to main"

      # The docs site reads the "Performance Report" and v3 sections of the latest v4 release at build time: rebuild it.
      - name: Rebuild the docs site
        env:
          DOCS_DEPLOY_HOOK: ${{ secrets.DOCS_DEPLOY_HOOK }}
        run: |
          if [[ -z "$DOCS_DEPLOY_HOOK" ]]; then
            echo "DOCS_DEPLOY_HOOK is not set: skipping the docs rebuild"
            exit 0
          fi
          curl -fsS -X POST "$DOCS_DEPLOY_HOOK" > /dev/null
          echo "✅ Docs rebuild started"

      - name: Benchmark summary
        run: |
          {
            echo "## 📊 Benchmark Summary"
            echo ""
            echo "- **Target**: ${{ env.tag_name }}"
            echo "- **Status**: ✅ Completed"
            echo "- **Results**: Uploaded as artifacts"
            if [[ "${{ github.event_name }}" == "release" ]]; then
              echo "- **Release Notes**: Updated automatically"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # The runtimes outside .NET (runtimes/typescript, runtimes/go, runtimes/rust), each against the serializers of its
  # language on one runner: one section per language, appended to the release body after the others. Independent of
  # the .NET benchmark: a release that has its .NET sections still gets these, and a failure here never touches them.
  # Each also runs on an Arm64 runner (the Go string writer's NEON assembly, the Rust crate's NEON steps, V8 on
  # Arm64), for sections of its own after the x64 ones (runtimes_report.py --arch arm64: headings the docs site does
  # not take for the x64 sections, which keep their format); an Arm64 failure leaves its section out.
  runtimes:
    name: Runtime benchmark (${{ matrix.lang }}, ${{ matrix.arch }})
    needs: target
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
    timeout-minutes: 40
    env:
      TAG_NAME: ${{ needs.target.outputs.tag }}
      # Empty on x64: runtimes_report.py's x64 headings.
      REPORT_ARCH: ${{ matrix.arch == 'arm64' && 'arm64' || '' }}
    strategy:
      fail-fast: false
      matrix:
        lang: [ typescript, go, rust ]
        arch: [ x64, arm64 ]
    steps:
      # The tag's runtimes and benchmarks; this workflow's commit for the report script.
      - name: Checkout the release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.target.outputs.tag }}
          path: release

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: workflow

      - name: Setup .NET
        if: matrix.lang == 'typescript'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            10.0.x
            8.0.x

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: matrix.lang == 'typescript'
        with:
          node-version: current

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.lang == 'go'
        with:
          go-version: stable
          cache-dependency-path: release/runtimes/go/bench/go.sum

      # Node only: the Chromium run of runtimes/typescript/bench/run.sh needs Playwright.
      - name: Run the TypeScript benchmark
        if: matrix.lang == 'typescript'
        working-directory: release/runtimes/typescript/bench
        run: |
          set -euo pipefail
          dotnet build -c Release ../../../src/Nino.Codegen > /dev/null
          dotnet build -c Release . > /dev/null
          dotnet bin/Release/net10.0/Bench.dll out/data
          dotnet ../../../src/Nino.Codegen/bin/Release/net8.0/nino-gen.dll --assembly bin/Release/net10.0/Bench.dll \
            --lang ts --out gen --import-extension .ts
          # tinybench, protobuf-es and msgpackr (releases before them compared with JSON only, without a lockfile).
          if [[ -f package-lock.json ]]; then npm ci --no-audit --no-fund; fi
          NINO_BENCH_JSON="$RUNNER_TEMP/bench.json" node --no-warnings node.ts out/data
          python3 "$GITHUB_WORKSPACE/workflow/benchmarks/runtimes_report.py" ${REPORT_ARCH:+--arch "$REPORT_ARCH"} typescript "$RUNNER_TEMP/bench.json" \
            "$TAG_NAME" > "$RUNNER_TEMP/section.md"

      - name: Run the Go benchmark
        if: matrix.lang == 'go'
        working-directory: release/runtimes/go/bench
        run: |
          set -euo pipefail
          # Six runs of each benchmark, summarized by benchstat (medians and their confidence intervals).
          go install golang.org/x/perf/cmd/benchstat@v0.0.0-20261009192801-be2c69fb417e
          go test -run '^$' -bench . -benchmem -count 6 . | tee "$RUNNER_TEMP/bench.txt"
          "$(go env GOPATH)/bin/benchstat" -format csv "$RUNNER_TEMP/bench.txt" > "$RUNNER_TEMP/bench.csv"
          python3 "$GITHUB_WORKSPACE/workflow/benchmarks/runtimes_report.py" ${REPORT_ARCH:+--arch "$REPORT_ARCH"} go "$RUNNER_TEMP/bench.csv" \
            "$TAG_NAME" > "$RUNNER_TEMP/section.md"

      - name: Run the Rust benchmark
        if: matrix.lang == 'rust'
        working-directory: release/runtimes/rust
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/target
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          # The output too: compare.rs prints each case's encoded sizes.
          cargo bench -p nino-bench --bench compare --locked 2>&1 | tee "$RUNNER_TEMP/bench.log"
          python3 "$GITHUB_WORKSPACE/workflow/benchmarks/runtimes_report.py" ${REPORT_ARCH:+--arch "$REPORT_ARCH"} rust "$CARGO_TARGET_DIR/criterion" \
            "$TAG_NAME" "$RUNNER_TEMP/bench.log" > "$RUNNER_TEMP/section.md"

      - name: Upload the section
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-section-${{ matrix.lang }}${{ matrix.arch == 'arm64' && '-arm64' || '' }}
          path: ${{ runner.temp }}/section.md
          retention-days: 30

  # After the .NET report (publish), so the two never edit the release body at once; also when publish was skipped
  # (its sections were there) or failed.
  publish-runtimes:
    name: Publish the runtime benchmarks
    needs: [ target, runtimes, publish ]
    if: ${{ always() && needs.target.result == 'success' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG_NAME: ${{ needs.target.outputs.tag }}
    steps:
      - name: Download the sections
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: runtime-section-*
          path: sections

      - name: Append the missing sections to the release body
        run: |
          set -euo pipefail
          gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --json body --jq '.body' > current_notes.md
          cp current_notes.md updated_notes.md
          added=0
          # One section per language, in this order, each only once: x64, then Arm64.
          for lang in typescript go rust typescript-arm64 go-arm64 rust-arm64; do
            file="sections/runtime-section-$lang/section.md"
            if [[ ! -s "$file" ]]; then
              echo "⚠️ No $lang section (see its runtimes job): left out"
              continue
            fi
            heading=$(head -n 1 "$file")
            if grep -qF "$heading" current_notes.md; then
              echo "⏭️ $heading already in the release notes"
              continue
            fi
            if (( $(wc -c < updated_notes.md) + $(wc -c < "$file") > 124000 )); then
              echo "::warning::No room for the $lang section in the release body (GitHub's 125,000 characters)"
              continue
            fi
            printf '\n\n' >> updated_notes.md
            cat "$file" >> updated_notes.md
            added=$((added + 1))
          done
          if (( added == 0 )); then
            echo "⏭️ Nothing to add"
            exit 0
          fi
          gh release edit "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --notes-file updated_notes.md
          echo "✅ Added $added runtime section(s)"
