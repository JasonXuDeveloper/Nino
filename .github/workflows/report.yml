name: Benchmark and Performance Report

on:
  workflow_dispatch: # Allow manual triggering
    inputs:
      tag_name:
        description: 'Tag to benchmark (optional, defaults to latest)'
        required: false
        type: string
  workflow_call: # Allow calling from other workflows
    inputs:
      tag_name:
        description: 'Tag to benchmark'
        required: false
        type: string
  release:
    types: [published] # Run when a release is published

# Security: Minimal required permissions
permissions:
  contents: write       # Update release notes
  actions: write        # Upload artifacts
  
# Prevent concurrent benchmark runs
concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  target:
    name: Pick the release
    runs-on: ubuntu-26.04
    outputs:
      tag: ${{ steps.determine_target.outputs.target_ref }}
      skip: ${{ steps.check_benchmark.outputs.skip }}
    env:
      V3_HEADING: "## 📊 v3 3.3.13 vs v4 (same machine)"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine target tag/ref
        id: determine_target
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            TAG_NAME="${{ github.event.release.tag_name }}"
            echo "Using release tag: $TAG_NAME"
          elif [[ -n "${{ inputs.tag_name }}" ]]; then
            TAG_NAME="${{ inputs.tag_name }}"
            echo "Using input tag: $TAG_NAME"
          else
            # Get latest tag
            TAG_NAME=$(git describe --tags $(git rev-list --tags --max-count=1) 2>/dev/null || echo "main")
            echo "Using latest tag: $TAG_NAME"
          fi
          echo "target_ref=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Check if benchmark already exists
        id: check_benchmark
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.determine_target.outputs.target_ref }}
        run: |
          RELEASE_BODY=$(gh release view "$TAG_NAME" --json body --jq '.body')
          # Skip only when both sections are there; otherwise run and add the missing one.
          if [[ $RELEASE_BODY == *"Performance Report"* && $RELEASE_BODY == *"$V3_HEADING"* ]]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "⏭️ Benchmark and v3 comparison already exist for this release"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "✅ A section is missing, will run"
          fi

  # The benchmark classes run in parallel, two or more per runner (so each joined report has a Type column), a class's
  # Nino and MemoryPack cases always on one runner; the publish job merges the reports into one table
  # (benchmarks/merge_reports.py). v3 runs on the SimpleTest runner, directly before its v4 run, as benchmarks/run.sh does.
  bench:
    name: Benchmark (${{ matrix.shard }})
    needs: target
    if: needs.target.outputs.skip != 'true'
    # A named image, not ubuntu-latest: the OS under the benchmark changes only when this line does.
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: a
            classes: SimpleTest PooledTest
            v3: true
          - shard: b
            classes: CommonTypesTest FixedSizeTest
          - shard: c
            classes: PolymorphicTest VersionTolerantTest
          - shard: d
            classes: CollectionsTest ReferenceTest PooledGraphTest
    env:
      # Same settings for every run (docs/v4-benchmarks.md): ShortRun's 3 iterations are too few.
      BDN_ARGS: --launchCount 1 --warmupCount 5 --iterationCount 15
      V3_OUT: ${{ github.workspace }}/v3-results
      OUT: ${{ github.workspace }}/report
      CLASSES: ${{ matrix.classes }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.target.outputs.tag }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            ${{ vars.DOTNET_VERSION || '10.0.x' }}
            10.0.x
            8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-benchmark-${{ hashFiles('**/*.csproj') }}

      - name: Build benchmark project
        working-directory: ./src/Nino.Benchmark
        run: dotnet build -c Release

      # Nino v3 3.3.13 from nuget.org (benchmarks/v3 has its own nuget.config), the same SimpleTest. It runs once,
      # directly before the v4 run, as benchmarks/run.sh does; MemoryPack runs in both, so drift of the runner shows.
      # A v3 failure never blocks the Performance Report: the v3 section is then left out.
      - name: Build v3 benchmark (Nino 3.3.13)
        id: v3_build
        if: matrix.v3
        continue-on-error: true
        run: |
          dotnet build -c Release benchmarks/v3
          dotnet benchmarks/v3/bin/Release/net10.0/Nino.Benchmark.dll --verify

      - name: Run v3 benchmark
        if: matrix.v3 && steps.v3_build.outcome == 'success'
        continue-on-error: true
        working-directory: ./benchmarks/v3
        run: |
          # shellcheck disable=SC2086 # BDN_ARGS is a list of arguments
          # Nino and MemoryPack only: nothing reads v3's MessagePack rows, and they were a third of this step.
          dotnet bin/Release/net10.0/Nino.Benchmark.dll --filter '*SimpleTest.Nino*' '*SimpleTest.MemoryPack*' $BDN_ARGS \
            --artifacts "$V3_OUT"
          mkdir -p "$OUT"
          cp "$(find "$V3_OUT/results" -name '*-report-github.md' | head -n1)" "$OUT/v3.md"

      - name: Run benchmarks
        working-directory: ./src/Nino.Benchmark
        run: |
          FILTERS=()
          for CLASS in $CLASSES; do FILTERS+=("*.$CLASS.*"); done
          # The settings of the published numbers (BDN_ARGS above, docs/v4-benchmarks.md).
          # shellcheck disable=SC2086 # BDN_ARGS is a list of arguments
          dotnet run -c Release --no-build -- --filter "${FILTERS[@]}" $BDN_ARGS
          REPORT=$(find BenchmarkDotNet.Artifacts/results -name "*-joined-*-report-github.md" | head -n1)
          if [[ -z "$REPORT" ]]; then
            echo "❌ No joined report in BenchmarkDotNet.Artifacts/results"
            ls -la BenchmarkDotNet.Artifacts/results || true
            exit 1
          fi
          mkdir -p "$OUT"
          cp "$REPORT" "$OUT/v4-${{ matrix.shard }}.md"

      - name: Upload the report
        uses: actions/upload-artifact@v7
        with:
          name: report-${{ matrix.shard }}
          path: report
          retention-days: 1

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results-${{ needs.target.outputs.tag }}-${{ matrix.shard }}
          path: |
            src/Nino.Benchmark/BenchmarkDotNet.Artifacts/results
            v3-results/results
          retention-days: 90

  publish:
    name: Publish the report
    needs: [ target, bench ]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      tag_name: ${{ needs.target.outputs.tag }}
      BDN_ARGS: --launchCount 1 --warmupCount 5 --iterationCount 15
      # The second section of the release body: Nino v3 3.3.13 against this release, on the SimpleTest runner.
      # The docs site (nino.docs scripts/sync-benchmarks.ts) looks for this heading.
      V3_HEADING: "## 📊 v3 3.3.13 vs v4 (same machine)"
      # Every benchmark class of src/Nino.Benchmark: one table in the Performance Report, its Type column naming the
      # class. A class missing from the table is reported as a warning.
      BENCH_CLASSES: SimpleTest PolymorphicTest PooledTest PooledGraphTest ReferenceTest VersionTolerantTest FixedSizeTest CommonTypesTest CollectionsTest

    steps:
      # This workflow's commit, for its scripts (merge_reports.py, compare.py, readme.py), whichever tag was measured.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download the reports
        uses: actions/download-artifact@v8
        with:
          pattern: report-*
          merge-multiple: true
          path: ${{ runner.temp }}/reports

      - name: Merge the reports
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/reports"
          ls -la "$DIR"
          python3 benchmarks/merge_reports.py "$DIR"/v4-*.md > "$RUNNER_TEMP/v4-report.md"
          for CLASS in $BENCH_CLASSES; do
            if grep -qE "^\| *${CLASS} +\|" "$RUNNER_TEMP/v4-report.md"; then
              echo "  ✅ $CLASS"
            else
              echo "::warning::$CLASS is missing from the benchmark report"
            fi
          done
          echo "BENCHMARK_FILE=$RUNNER_TEMP/v4-report.md" >> "$GITHUB_ENV"
          if [[ -f "$DIR/v3.md" ]]; then
            echo "V3_REPORT=$DIR/v3.md" >> "$GITHUB_ENV"
          fi

      - name: Update release notes with benchmark
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          
          TAG_NAME="${{ env.tag_name }}"
          
          # Get current release body
          gh release view "$TAG_NAME" --json body --jq '.body' > current_notes.md
          HAS_PERF=false; HAS_V3=false
          grep -q "Performance Report" current_notes.md && HAS_PERF=true
          grep -qF "$V3_HEADING" current_notes.md && HAS_V3=true

          # The Performance Report section, in the format the docs site has always parsed: keep it as it is.
          : > perf_section.md
          if [[ $HAS_PERF == true ]]; then
            echo "⏭️ Performance Report already exists in release notes"
          else
            {
              echo "## 📊 Performance Report"
              echo ""
              echo "<details>"
              echo "<summary>Click to expand benchmark results</summary>"
              echo ""
              cat "$BENCHMARK_FILE"
              echo ""
              echo "</details>"
              echo ""
              echo "---"
              echo "*Benchmark generated automatically on $(date -u '+%Y-%m-%d %H:%M:%S UTC')*"
            } > perf_section.md
          fi

          # The v3 section: the compare.py table (v4 against v3) and the v3 report.
          : > v3_section.md
          V3_REPORT=${V3_REPORT:-}
          if [[ $HAS_V3 == true ]]; then
            echo "⏭️ v3 comparison already exists in release notes"
          elif [[ -z "$V3_REPORT" ]]; then
            echo "⚠️ No v3 report (see the v3 steps): the v3 comparison is left out"
          else
            {
              echo "$V3_HEADING"
              echo ""
              echo "<details>"
              echo "<summary>Nino v3 3.3.13 (NuGet) against ${TAG_NAME}, back to back on the same runner</summary>"
              echo ""
              # Never write the words "Performance Report" here: parsers find the v4 report by them.
              echo "\`benchmarks/v3\` (the Nino and MemoryPack cases of the same \`SimpleTest\`, built against Nino 3.3.13 from nuget.org) ran directly before the v4"
              echo "SimpleTest run below, on the same runner, with the same BenchmarkDotNet settings"
              echo "(\`${BDN_ARGS}\`). MemoryPack runs in both, so its two columns show how much the runner moved."
              echo ""
              echo "### v4 vs v3"
              echo ""
              python3 "$GITHUB_WORKSPACE/benchmarks/v3/compare.py" "$V3_REPORT" "$BENCHMARK_FILE" \
                || echo "compare.py could not read the reports."
              echo ""
              echo "### v3 3.3.13 report"
              echo ""
              cat "$V3_REPORT"
              echo ""
              echo "</details>"
            } > v3_section.md
          fi

          if [[ ! -s perf_section.md && ! -s v3_section.md ]]; then
            echo "⏭️ Nothing to add"
            exit 0
          fi

          # The v3 section goes before the Performance Report: parsers that read every table from
          # "Performance Report" to the end of the body then never see the v3 tables.
          python3 - <<'EOF'
          import re
          body = open("current_notes.md", encoding="utf-8").read().rstrip("\n")
          v3 = open("v3_section.md", encoding="utf-8").read().strip("\n")
          perf = open("perf_section.md", encoding="utf-8").read().strip("\n")
          match = re.search(r"^.*Performance Report", body, re.MULTILINE)
          if match:  # the report is already there: put the v3 section in front of its heading
              head, tail = body[:match.start()].rstrip("\n"), body[match.start():]
          else:
              head, tail = body, perf
          parts = [part for part in (head, v3, tail) if part]
          text = "\n\n".join(parts) + "\n"
          if len(text) > 125000:  # GitHub's limit for a release body: drop the raw v3 reports, keep the tables
              v3 = re.sub(r"\n### v3 3\.3\.13 report.*?(?=\n</details>)", "\n\n(The raw v3 reports are in the workflow artifacts.)", v3, flags=re.S)
              text = "\n\n".join(part for part in (head, v3, tail) if part) + "\n"
          open("updated_notes.md", "w", encoding="utf-8").write(text)
          EOF

          # Update the release
          gh release edit "$TAG_NAME" --notes-file updated_notes.md
          echo "✅ Release notes updated with benchmark results"
      
      # The chart crop below needs Pillow; the runner's system Python does not take pip installs.
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # README.md, README.zh.md, the README chart and the runtime tables of docs/v4-benchmarks.md show the newest v4
      # release: regenerate them (benchmarks/readme.py, between the <!--bench:...--> markers) from this run and push
      # them to main.
      - name: Update the README benchmark numbers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          LATEST=$(gh release list --limit 50 --json tagName,publishedAt \
            --jq '[.[] | select(.tagName | startswith("v4."))] | sort_by(.publishedAt) | last | .tagName')
          if [[ "$tag_name" != "$LATEST" ]]; then
            echo "⏭️ $tag_name is not the newest v4 release ($LATEST): README left as it is"
            exit 0
          fi

          # This run's reports, then main's README and script
          V3_ARGS=()
          if [[ -n "${V3_REPORT:-}" ]]; then
            V3_ARGS+=(--v3 "$V3_REPORT")
          fi
          git fetch origin main
          git checkout --detach origin/main

          if ! python3 benchmarks/readme.py --v4 "$BENCHMARK_FILE" ${V3_ARGS[@]+"${V3_ARGS[@]}"} \
            --tag "$tag_name" --png-html "$RUNNER_TEMP/chart.html"; then
            echo "::warning::benchmarks/readme.py could not read this run: README left as it is"
            exit 0
          fi
          # README.md goes into the NuGet packages, and nuget.org shows no SVG: render the PNG with Chrome.
          # Headless Chrome paints less than its window, so it gets a taller window and the image is cropped.
          HEIGHT=$(grep -oE 'viewBox="0 0 820 [0-9]+"' docs/assets/benchmark.svg | grep -oE '[0-9]+"$' | tr -d '"')
          google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars --force-device-scale-factor=2 \
            --default-background-color=00000000 --window-size=820,$((HEIGHT + 300)) \
            --screenshot="$RUNNER_TEMP/chart.png" "file://$RUNNER_TEMP/chart.html"
          python3 -m pip install --quiet pillow
          python3 -c 'import sys; from PIL import Image; Image.open(sys.argv[1]).crop((0, 0, 1640, 2 * int(sys.argv[2]))).save(sys.argv[3])' \
            "$RUNNER_TEMP/chart.png" "$HEIGHT" docs/assets/benchmark.png

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.zh.md docs/v4-benchmarks.md docs/assets/benchmark.svg docs/assets/benchmark.png
          if git diff --cached --quiet; then
            echo "⏭️ README numbers unchanged"
            exit 0
          fi
          git commit -m "Update README benchmark numbers for $tag_name"
          for _ in 1 2 3; do
            if git push origin HEAD:main; then
              echo "✅ README benchmark numbers updated"
              exit 0
            fi
            git pull --rebase origin main
          done
          echo "::warning::Could not push the README update to main"

      # The docs site reads the "Performance Report" and v3 sections of the latest v4 release at build time: rebuild it.
      - name: Rebuild the docs site
        env:
          DOCS_DEPLOY_HOOK: ${{ secrets.DOCS_DEPLOY_HOOK }}
        run: |
          if [[ -z "$DOCS_DEPLOY_HOOK" ]]; then
            echo "DOCS_DEPLOY_HOOK is not set: skipping the docs rebuild"
            exit 0
          fi
          curl -fsS -X POST "$DOCS_DEPLOY_HOOK" > /dev/null
          echo "✅ Docs rebuild started"

      - name: Benchmark summary
        run: |
          echo "## 📊 Benchmark Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Target**: ${{ env.tag_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ✅ Completed" >> $GITHUB_STEP_SUMMARY
          echo "- **Results**: Uploaded as artifacts" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "- **Release Notes**: Updated automatically" >> $GITHUB_STEP_SUMMARY
          fi
