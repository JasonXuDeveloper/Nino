name: Benchmark and Performance Report

on:
  workflow_dispatch: # Allow manual triggering
    inputs:
      tag_name:
        description: 'Tag to benchmark (optional, defaults to latest)'
        required: false
        type: string
  release:
    types: [published] # Run when a release is published

# Security: Minimal required permissions
permissions:
  contents: write       # Update release notes, upload release assets

# Prevent concurrent benchmark runs
concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: false

env:
  # Same settings for every run (docs/v4-benchmarks.md): ShortRun's 3 iterations are too few, and one process a
  # case leaves its layout to chance (a 12 ns case moved by 13% between processes); the mean of three does not.
  # benchmarks/Nino.Benchmark/Harness/NinoJobAttribute.cs sets them since 4.0.0-rc.8; they are passed here too, for the tags
  # before it (remove once no report is run for v4.0.0-rc.7 or older), and named in the report's text.
  BDN_ARGS: --launchCount 3 --warmupCount 5 --iterationCount 15
  # Every publish job attaches its results to the release under fixed names, lists them in benchmarks-manifest.json,
  # draws a chart of each section (a light and a dark SVG on the release-notes branch, charts/<tag>/) and rewrites the body's benchmark
  # part from the manifest: benchmarks/reports/release_body.py publish (the names: release_assets.py). README, docs and
  # the docs site (nino.docs scripts/sync-benchmarks.ts) read the assets, never the body. The jobs that publish run
  # one after another (publish, publish-runtimes, publish-generator, publish-unity), so no two edit the manifest or the
  # body at once.
  # The benchmark the Unity section comes from; a tag without it has no Unity section.
  UNITY_BENCHMARK: src/Nino.Unity/Assets/Test/Runtime/Burst/BurstBenchmark.cs
  # The benchmark the build section comes from; a tag without it (v4.0.0-rc.7 and older) has no build section.
  GENERATOR_BENCHMARK: benchmarks/Nino.GeneratorBenchmark

# Bash with -e and -o pipefail for every run step: a command piped into tee, grep or sed fails its step when it fails.
defaults:
  run:
    shell: bash

jobs:
  target:
    name: Pick the release
    # A pre-release's Unity tag (vX.Y.Z-preview.N) has a release of its own for the signed Unity package
    # (unity-sign.yml); the numbers belong to the main release, so it starts nothing here.
    if: ${{ !contains(github.event.release.tag_name || '', '-preview.') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.determine_target.outputs.target_ref }}
      skip: ${{ steps.check_benchmark.outputs.skip }}
      matrix: ${{ steps.shards.outputs.matrix }}
      unity_skip: ${{ steps.check_unity.outputs.skip }}
      generator_skip: ${{ steps.check_generator.outputs.skip }}
      runtimes: ${{ steps.release_tree.outputs.runtimes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Only a release tag of this repository whose commit is on main is benchmarked: the tag's code then runs in this
      # workflow's (main's) cache scope, so it must be code that was merged and released, never an arbitrary ref.
      # Values from the event and inputs reach the script through the environment, never pasted into it.
      - name: Determine target tag
        id: determine_target
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          TAG_NAME=${RELEASE_TAG:-${INPUT_TAG:-}}
          if [[ -z "$TAG_NAME" ]]; then
            TAG_NAME=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-preview.*' origin/main)
          fi
          if [[ ! "$TAG_NAME" =~ ^v[0-9][0-9A-Za-z.+-]*$ ]] || ! git rev-parse -q --verify "refs/tags/$TAG_NAME^{commit}" >/dev/null; then
            echo "::error::$TAG_NAME is not a release tag of this repository"
            exit 1
          fi
          if ! git merge-base --is-ancestor "refs/tags/$TAG_NAME" origin/main; then
            echo "::error::$TAG_NAME is not on main: only released code is benchmarked here"
            exit 1
          fi
          echo "Benchmarking $TAG_NAME"
          echo "target_ref=$TAG_NAME" >> "$GITHUB_OUTPUT"

      # What the tag's tree has: a manual run for an older tag (v4.0.0-rc.7 has neither the runtimes outside .NET nor
      # the Unity benchmark) runs only the sections it can, instead of failing a job for each one it lacks.
      - name: Check what the release has
        id: release_tree
        env:
          TAG_NAME: ${{ steps.determine_target.outputs.target_ref }}
        run: |
          set -euo pipefail
          langs=()
          for lang in typescript go rust; do
            if git cat-file -e "refs/tags/$TAG_NAME:runtimes/$lang/bench" 2>/dev/null; then
              langs+=("$lang")
            else
              echo "::notice::$TAG_NAME has no runtimes/$lang/bench: no $lang benchmark"
            fi
          done
          echo "runtimes=$(printf '%s\n' "${langs[@]}" | jq -Rnc '[inputs | select(length > 0)]')" >> "$GITHUB_OUTPUT"
          if git cat-file -e "refs/tags/$TAG_NAME:$UNITY_BENCHMARK" 2>/dev/null; then
            echo "unity=true" >> "$GITHUB_OUTPUT"
          else
            echo "unity=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$TAG_NAME has no $UNITY_BENCHMARK: no Unity benchmark"
          fi
          if git cat-file -e "refs/tags/$TAG_NAME:$GENERATOR_BENCHMARK" 2>/dev/null; then
            echo "generator=true" >> "$GITHUB_OUTPUT"
          else
            echo "generator=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$TAG_NAME has no $GENERATOR_BENCHMARK: no build section"
          fi

      # The bench job's matrix: every shard of benchmarks/shards.json (this workflow's commit) on x64 and on Arm64, the
      # v3 globs on x64 only.
      - name: Plan the shards
        id: shards
        run: |
          set -euo pipefail
          MATRIX=$(jq -c '[.report[] as $s | ("x64", "arm64") as $a
            | {arch: $a, shard: $s.id, filters: $s.filters} + (if $a == "x64" and $s.v3 then {v3: $s.v3} else {} end)]' \
            benchmarks/shards.json)
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

      # What the release has: the assets its manifest lists, or, for a release from before the manifest (v4.0.0-rc.9 and
      # older), the sections of its body (benchmarks/reports/release_assets.py has).
      - name: Check if benchmark already exists
        id: check_benchmark
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.determine_target.outputs.target_ref }}
        run: |
          # Skip only when every .NET result is there; otherwise run and publish them all.
          if [[ $(python3 benchmarks/reports/release_assets.py has --tag "$TAG_NAME" dotnet-x64.md dotnet-v3-x64.md dotnet-arm64.md) == true ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "⏭️ Benchmark, v3 comparison and Arm64 benchmark already exist for this release"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "✅ A section is missing, will run"
          fi

      # The Unity benchmark takes the Unity license's seat for most of an hour: it runs only when the release has no
      # Unity results yet (for a manual run too).
      - name: Check if the Unity benchmark already exists
        id: check_unity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.determine_target.outputs.target_ref }}
          HAS_UNITY: ${{ steps.release_tree.outputs.unity }}
        run: |
          if [[ "$HAS_UNITY" != true ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ $(python3 benchmarks/reports/release_assets.py has --tag "$TAG_NAME" unity-x64.md) == true ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "⏭️ The Unity benchmark already exists for this release"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # The build benchmark takes a runner for about half an hour (v3 at 1,100 types): only when the release lacks it.
      - name: Check if the build section already exists
        id: check_generator
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.determine_target.outputs.target_ref }}
          HAS_GENERATOR: ${{ steps.release_tree.outputs.generator }}
        run: |
          if [[ "$HAS_GENERATOR" != true ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ $(python3 benchmarks/reports/release_assets.py has --tag "$TAG_NAME" build-x64.md) == true ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "⏭️ The build section already exists for this release"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  # The benchmark classes run in parallel, two or more per runner (so each joined report has a Type column), every
  # serializer's runs of a case (Nino, MemoryPack, MessagePack, protobuf-net, and in SimpleTest, PolymorphicTest and
  # WorkloadTest Google.Protobuf and System.Text.Json) always on one runner. Fourteen shards of 24 to 52 cases (just under a minute each with three
  # launches, a million-object ScatteredTest case over one), balanced by the shards' times in the last report
  # (v4.0.0-rc.9's took 34 to 47 minutes); BclTypesTest, CollectionsTest, CommonTypesTest and WorkloadTest are split by
  # type, ScatteredTest by data. SimpleTest is
  # split into its serialize (a) and deserialize (h) cases, and on x64 each half of v3 runs directly before the same
  # half of v4, on its runner, as benchmarks/run.sh does (v3 takes about 10 minutes a half, so these shards have fewer
  # v4 cases); v3's PolymorphicTest runs the same way before v4's, on its shard (d), and v3's NullableTest and nullable
  # collections before v4's on theirs (o and p, and j for NullableDecimals), v3's WorkloadTest before each workload shard's
  # v4 (d, k to n) and its PooledGraphTest Leaves before v4's (b). The publish job merges the reports into one table (benchmarks/reports/merge_reports.py). The same shards run on
  # Arm64 runners too, for the Arm64 section of the release (AdvSimd and TBL paths that x64 never takes); an Arm64
  # failure leaves that section out and never blocks the x64 report.
  bench:
    name: Benchmark (${{ matrix.arch }} ${{ matrix.shard }})
    needs: target
    if: needs.target.outputs.skip != 'true'
    # Named images, not ubuntu-latest: the OS under the benchmark changes only when these lines do.
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      # The matrix grows with shards.json (two jobs a shard): capped, so a release takes at most 12 of the account's
      # concurrent jobs here, beside the runtime benchmarks and Unity, and pushes to main still find runners.
      max-parallel: 12
      matrix:
        # benchmarks/shards.json, "report" (the target job's Plan the shards step).
        include: ${{ fromJSON(needs.target.outputs.matrix) }}
    env:
      V3_OUT: ${{ github.workspace }}/v3-results
      OUT: ${{ github.workspace }}/report
      # JSON arrays of BenchmarkDotNet globs (benchmarks/shards.json).
      FILTERS: ${{ toJSON(matrix.filters) }}
      V3_FILTERS: ${{ toJSON(matrix.v3) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.target.outputs.tag }}
          persist-credentials: false

      - name: Setup .NET
        # setup-dotnet itself, not ./.github/actions/setup-dotnet: this job checks out another commit.
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            10.0.x
            8.0.x

      # Releases before the move of the benchmarks out of src/ (rc.7 and older) keep the project in src/Nino.Benchmark.
      - name: Find the benchmark project
        run: |
          if [ -d benchmarks/Nino.Benchmark ]; then echo "BENCH=benchmarks/Nino.Benchmark" >> "$GITHUB_ENV"
          else echo "BENCH=src/Nino.Benchmark" >> "$GITHUB_ENV"; fi

      - name: Build benchmark project
        working-directory: ${{ env.BENCH }}
        run: |
          # The probes (classes named *Probe) are experiments that never run in this report; v4.0.0-rc.8's --verify
          # still set them up, and one called x86's CpuId, which failed every Arm64 shard. Left out of the build.
          rm -f CpuProbe.cs
          dotnet build -c Release
          # Every case reads back what the others read and writes its payload's bytes (Verify.cs).
          dotnet bin/Release/net10.0/Nino.Benchmark.dll --verify

      # Nino v3 3.3.13 from nuget.org, the same SimpleTest, PolymorphicTest, NullableTest, nullable collections,
      # WorkloadTest and PooledGraphTest's Leaves (the benchmark project built with NINO_BENCH_V3=true, into
      # bin/v3; releases up to rc.8's development kept it in benchmarks/v3, older ones have none). It runs once,
      # directly before the v4 run, as benchmarks/run.sh does; MemoryPack runs in both, so drift of the runner shows.
      # A v3 failure never blocks the Performance Report: the v3 section is then left out.
      - name: Build v3 benchmark (Nino 3.3.13)
        id: v3_build
        if: matrix.v3
        continue-on-error: true
        run: |
          if [ -d benchmarks/v3 ]; then
            echo "V3_DIR=benchmarks/v3" >> "$GITHUB_ENV"; echo "V3_DLL=bin/Release/net10.0/Nino.Benchmark.dll" >> "$GITHUB_ENV"
            (cd benchmarks/v3 && dotnet build -c Release && dotnet bin/Release/net10.0/Nino.Benchmark.dll --verify)
          else
            echo "V3_DIR=$BENCH" >> "$GITHUB_ENV"; echo "V3_DLL=bin/v3/Release/net10.0/Nino.Benchmark.dll" >> "$GITHUB_ENV"
            (cd "$BENCH" && NINO_BENCH_V3=true dotnet build -c Release && NINO_BENCH_V3=true dotnet bin/v3/Release/net10.0/Nino.Benchmark.dll --verify)
          fi

      - name: Run v3 benchmark
        if: matrix.v3 && steps.v3_build.outcome == 'success'
        continue-on-error: true
        working-directory: ${{ env.V3_DIR }}
        run: |
          # BenchmarkDotNet runs each benchmark at high priority, which a user may not set ("Failed to set up high
          # priority (Permission denied)"): raise this shell's nice limit (RLIMIT_NICE 40, down to nice -20), which
          # dotnet and the benchmark processes inherit. Without it they run at normal priority, as before.
          sudo prlimit --pid $$ --nice=40:40 || echo "::warning::could not raise the nice limit: normal priority"
          echo "nice limit: $(ulimit -e)"
          # Nino and MemoryPack only: nothing reads v3's MessagePack rows, and they were a third of this step.
          # This shard's v3 cases (the matrix's v3 globs: a half of SimpleTest, PolymorphicTest, the nullable cases,
          # workloads or the Leaves).
          mapfile -t V3_PATTERNS < <(jq -r '.[]' <<< "$V3_FILTERS")
          mkdir -p "$OUT/v3-${{ matrix.shard }}"
          # A release from before a class's v3 port (PolymorphicTest's, NullableTest's, the nullable collections',
          # WorkloadTest's and the Leaves': v4.0.0-rc.9 and older) has no case these globs
          # select: a marker in place of the report, so the publish job still makes the v3 section from the other shards.
          V3_CASES=$(NINO_BENCH_V3=true dotnet "$V3_DLL" --list flat --filter "${V3_PATTERNS[@]}")
          if [[ -z "$V3_CASES" ]]; then
            echo "::notice::this release's v3 build has no case for ${V3_PATTERNS[*]}"
            touch "$OUT/v3-${{ matrix.shard }}/none"
            exit 0
          fi
          # NINO_BENCH_V3: the benchmark project's v3 build, which BenchmarkDotNet builds again for its runs.
          # shellcheck disable=SC2086 # BDN_ARGS is a list of arguments
          NINO_BENCH_V3=true dotnet "$V3_DLL" --filter "${V3_PATTERNS[@]}" $BDN_ARGS \
            --artifacts "$V3_OUT"
          # Under BenchmarkDotNet's own file name, which names the class (benchmarks/reports/bdn.py, class_name): one
          # report a shard (Program.cs joins the summary when a shard's globs reach several classes).
          cp "$(find "$V3_OUT/results" -name '*-report-github.md' | head -n1)" "$OUT/v3-${{ matrix.shard }}/"

      - name: Run benchmarks
        working-directory: ${{ env.BENCH }}
        run: |
          # BenchmarkDotNet runs each benchmark at high priority, which a user may not set ("Failed to set up high
          # priority (Permission denied)"): raise this shell's nice limit (RLIMIT_NICE 40, down to nice -20), which
          # dotnet and the benchmark processes inherit. Without it they run at normal priority, as before.
          sudo prlimit --pid $$ --nice=40:40 || echo "::warning::could not raise the nice limit: normal priority"
          echo "nice limit: $(ulimit -e)"
          # The shard's filters (benchmarks/shards.json).
          mapfile -t PATTERNS < <(jq -r '.[]' <<< "$FILTERS")
          # The cases this shard runs, and on one shard every case, so the publish job can name a case no shard ran
          # (the BclTypesTest and CollectionsTest shards select types by name).
          mkdir -p "$OUT"
          dotnet bin/Release/net10.0/Nino.Benchmark.dll --list flat --filter "${PATTERNS[@]}" \
            | grep '^Nino\.Benchmark\.' > "$OUT/cases-${{ matrix.arch }}-${{ matrix.shard }}.txt" || true
          if [[ "${{ matrix.shard }}" == a ]]; then
            dotnet bin/Release/net10.0/Nino.Benchmark.dll --list flat --filter '*' \
              | grep '^Nino\.Benchmark\.' > "$OUT/cases-${{ matrix.arch }}-all.txt" || true
          fi
          # The settings of the published numbers (BDN_ARGS above, docs/v4-benchmarks.md).
          # shellcheck disable=SC2086 # BDN_ARGS is a list of arguments
          dotnet run -c Release --no-build -- --filter "${PATTERNS[@]}" $BDN_ARGS
          # The joined report of the shard's classes; a shard of one class has none, only that class's report.
          REPORT=$(find BenchmarkDotNet.Artifacts/results -name "*-joined-*-report-github.md" | head -n1)
          if [[ -z "$REPORT" ]]; then
            mapfile -t ONE < <(find BenchmarkDotNet.Artifacts/results -name "*-report-github.md")
            if (( ${#ONE[@]} == 1 )); then REPORT=${ONE[0]}; fi
          fi
          if [[ -z "$REPORT" ]]; then
            echo "❌ No joined report (or one class's report) in BenchmarkDotNet.Artifacts/results"
            ls -la BenchmarkDotNet.Artifacts/results || true
            exit 1
          fi
          # x64 reports go in v4-<shard>/, Arm64 ones in arm64-<shard>/ (the publish job tells them apart by that),
          # under BenchmarkDotNet's own file name, which names the class of a one-class report (bdn.py, class_name).
          DEST="$OUT/${{ matrix.arch == 'arm64' && 'arm64' || 'v4' }}-${{ matrix.shard }}"
          mkdir -p "$DEST"
          cp "$REPORT" "$DEST/"

      - name: Upload the report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report-${{ matrix.arch }}-${{ matrix.shard }}
          path: report
          retention-days: 1

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-results-${{ needs.target.outputs.tag }}-${{ matrix.arch }}-${{ matrix.shard }}
          path: |
            ${{ env.BENCH }}/BenchmarkDotNet.Artifacts/results
            v3-results/results
          retention-days: 90

  publish:
    name: Publish the report
    needs: [ target, bench ]
    # Also when an Arm64 shard failed: the x64 report is checked below, and a missing Arm64 one only drops its section.
    if: ${{ !cancelled() && needs.target.outputs.skip != 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      TAG_NAME: ${{ needs.target.outputs.tag }}
      # Every benchmark class of benchmarks/Nino.Benchmark: one table in the Performance Report, its Type column naming the
      # class. A class missing from the table is reported as a warning.
      # The shards (per architecture), the x64 shards that run part of v3 each (the v3 section needs every one) and the
      # benchmark classes: benchmarks/shards.json, read in the Merge the reports step.

    steps:
      # This workflow's commit, for its scripts (merge_reports.py, release_body.py, readme.py), whichever tag was measured,
      # with the credentials that push the charts to the release-notes branch.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download the reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: report-*
          merge-multiple: true
          path: ${{ runner.temp }}/reports

      - name: Merge the reports
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/reports"
          ls -laR "$DIR"
          SHARDS=$(jq '.report | length' benchmarks/shards.json)
          V3_SHARDS=$(jq '[.report[] | select(.v3)] | length' benchmarks/shards.json)
          BENCH_CLASSES=$(jq -r '.classes | join(" ")' benchmarks/shards.json)
          shopt -s nullglob
          # One report per shard directory (v4-<shard>/, arm64-<shard>/, v3-<shard>/), in shard order.
          X64=("$DIR"/v4-*/*-report-github.md) ARM64=("$DIR"/arm64-*/*-report-github.md)
          if (( ${#X64[@]} != SHARDS )); then
            echo "❌ ${#X64[@]} of the $SHARDS x64 reports: not publishing a partial Performance Report"
            exit 1
          fi
          python3 benchmarks/reports/merge_reports.py "${X64[@]}" > "$RUNNER_TEMP/v4-report.md"
          for CLASS in $BENCH_CLASSES; do
            if grep -qE "^\| *${CLASS} +\|" "$RUNNER_TEMP/v4-report.md"; then
              echo "  ✅ $CLASS"
            else
              echo "::warning::$CLASS is missing from the benchmark report"
            fi
          done
          echo "BENCHMARK_FILE=$RUNNER_TEMP/v4-report.md" >> "$GITHUB_ENV"
          # Arm64: every shard or no section (a partial table would read as the whole suite).
          if (( ${#ARM64[@]} == SHARDS )); then
            python3 benchmarks/reports/merge_reports.py "${ARM64[@]}" > "$RUNNER_TEMP/arm64-report.md"
            echo "ARM64_REPORT=$RUNNER_TEMP/arm64-report.md" >> "$GITHUB_ENV"
          else
            echo "::warning::${#ARM64[@]} of the $SHARDS Arm64 reports: the Arm64 section is left out"
          fi
          # A shard whose globs select no case of the release's v3 build leaves a marker (v3-<shard>/none) instead.
          V3=("$DIR"/v3-*/*-report-github.md) V3_NONE=("$DIR"/v3-*/none)
          if (( ${#V3[@]} && ${#V3[@]} + ${#V3_NONE[@]} == V3_SHARDS )); then
            python3 benchmarks/reports/merge_reports.py "${V3[@]}" > "$RUNNER_TEMP/v3-report.md"
            echo "V3_REPORT=$RUNNER_TEMP/v3-report.md" >> "$GITHUB_ENV"
          elif (( ${#V3[@]} )); then
            echo "::warning::${#V3[@]} of the $V3_SHARDS v3 reports: the v3 comparison is left out"
          fi
          # A case that no shard's filters select (a new one, say) is left out of the report: name it. The probes are
          # not run on purpose.
          if [[ -f "$DIR/cases-x64-all.txt" ]]; then
            grep -v 'Probe' "$DIR/cases-x64-all.txt" | sort -u > "$RUNNER_TEMP/all.txt"
            cat "$DIR"/cases-x64-[a-z].txt | sort -u > "$RUNNER_TEMP/run.txt"
            for CASE in $(comm -23 "$RUNNER_TEMP/all.txt" "$RUNNER_TEMP/run.txt"); do
              echo "::warning::$CASE is in no shard: add it to a shard of benchmarks/shards.json"
            done
          fi

      # The merged reports as assets (dotnet-x64.md, dotnet-v3-x64.md, dotnet-arm64.md; a re-run replaces them), their
      # charts on the release-notes branch, and the body's benchmark part (benchmarks/reports/release_body.py publish).
      - name: Publish the results
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 benchmarks/reports/release_body.py publish --tag "$TAG_NAME" --dir "$RUNNER_TEMP/assets" \
            dotnet-x64.md="$BENCHMARK_FILE" ${V3_REPORT:+dotnet-v3-x64.md="$V3_REPORT"} \
            ${ARM64_REPORT:+dotnet-arm64.md="$ARM64_REPORT"}
          echo "✅ Release assets and notes updated with benchmark results"

      # README.md, README.zh.md, the README chart and the runtime tables of docs/v4-benchmarks.md show the newest v4
      # release: regenerate them (benchmarks/reports/readme.py, between the <!--bench:...--> markers) from the assets
      # this run attached and push them to main. readme.py --png renders the PNGs (light and dark theme) with Chrome:
      # README.md goes into the NuGet packages, and nuget.org shows no SVG.
      - name: Update the README benchmark numbers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          LATEST=$(gh release list --limit 50 --json tagName,publishedAt \
            --jq '[.[] | select(.tagName | startswith("v4."))] | sort_by(.publishedAt) | last | .tagName')
          if [[ "$TAG_NAME" != "$LATEST" ]]; then
            echo "⏭️ $TAG_NAME is not the newest v4 release ($LATEST): README left as it is"
            exit 0
          fi
          # main's README and script, on this run's assets
          git fetch origin main
          git checkout --detach origin/main
          if ! python3 benchmarks/reports/readme.py --assets "$RUNNER_TEMP/assets" --tag "$TAG_NAME" --png; then
            echo "::warning::benchmarks/reports/readme.py could not read this run: README left as it is"
            exit 0
          fi
          # main's script (this checkout), as readme.py above.
          .github/scripts/push_main.sh "docs(benchmarks): update README numbers for $TAG_NAME" README.md README.zh.md \
            docs/v4-benchmarks.md docs/assets/benchmark.svg docs/assets/benchmark.png docs/assets/benchmark-dark.svg \
            docs/assets/benchmark-dark.png

      # The docs site reads the assets of the latest v4 release at build time (benchmarks-manifest.json): rebuild it.
      - &rebuild-docs
        name: Rebuild the docs site
        env:
          DOCS_DEPLOY_HOOK: ${{ secrets.DOCS_DEPLOY_HOOK }}
        run: |
          if [[ -z "$DOCS_DEPLOY_HOOK" ]]; then
            echo "DOCS_DEPLOY_HOOK is not set: skipping the docs rebuild"
            exit 0
          fi
          curl -fsS -X POST "$DOCS_DEPLOY_HOOK" > /dev/null
          echo "✅ Docs rebuild started"

      # After a failure too, with what failed: the benchmark shards' result and this job's.
      - name: Benchmark summary
        if: always()
        env:
          BENCH_RESULT: ${{ needs.bench.result }}
          PUBLISH_RESULT: ${{ job.status }}
          EVENT: ${{ github.event_name }}
        run: |
          status() { [[ $1 == success ]] && echo "✅ $1" || echo "❌ $1"; }
          {
            echo "## 📊 Benchmark Summary"
            echo ""
            echo "- **Target**: $TAG_NAME"
            echo "- **Benchmarks**: $(status "$BENCH_RESULT")"
            echo "- **Report**: $(status "$PUBLISH_RESULT")"
            echo "- **Results**: Uploaded as artifacts"
            if [[ "$EVENT" == release && "$PUBLISH_RESULT" == success ]]; then
              echo "- **Release Notes**: Updated automatically"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # The runtimes outside .NET (runtimes/typescript, runtimes/go, runtimes/rust), each against the serializers of its
  # language on one runner: one section per language, appended to the release body after the others. Independent of
  # the .NET benchmark: a release that has its .NET sections still gets these, and a failure here never touches them.
  # Each also runs on an Arm64 runner (the Go string writer's NEON assembly, the Rust crate's NEON steps, V8 on
  # Arm64), for sections of its own after the x64 ones (runtimes_report.py --arch arm64: headings the docs site does
  # not take for the x64 sections, which keep their format); an Arm64 failure leaves its section out.
  runtimes:
    name: Runtime benchmark (${{ matrix.lang }}, ${{ matrix.arch }})
    needs: target
    if: needs.target.outputs.runtimes != '[]'
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
    timeout-minutes: 40
    env:
      TAG_NAME: ${{ needs.target.outputs.tag }}
      # Empty on x64: runtimes_report.py's x64 headings.
      REPORT_ARCH: ${{ matrix.arch == 'arm64' && 'arm64' || '' }}
      # The release assets this job writes into $RUNNER_TEMP/out: <ASSET>.md (the section) and its data (.json for
      # TypeScript, .csv for Go; benchmarks/reports/release_assets.py).
      ASSET: runtime-${{ matrix.lang }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        lang: ${{ fromJSON(needs.target.outputs.runtimes) }}
        arch: [ x64, arm64 ]
    steps:
      # The tag's runtimes and benchmarks; this workflow's commit for the report script.
      - name: Checkout the release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.target.outputs.tag }}
          path: release
          persist-credentials: false

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: workflow
          persist-credentials: false

      - name: Setup .NET
        if: matrix.lang == 'typescript'
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            10.0.x
            8.0.x

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: matrix.lang == 'typescript'
        with:
          node-version: current

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.lang == 'go'
        with:
          go-version: stable
          cache-dependency-path: release/runtimes/go/bench/go.sum

      # Node only: the Chromium run of runtimes/typescript/bench/run.sh needs Playwright.
      - name: Run the TypeScript benchmark
        if: matrix.lang == 'typescript'
        working-directory: release/runtimes/typescript/bench
        run: |
          set -euo pipefail
          dotnet build -c Release ../../../src/Nino.Codegen > /dev/null
          dotnet build -c Release . > /dev/null
          dotnet bin/Release/net10.0/Bench.dll out/data
          dotnet ../../../src/Nino.Codegen/bin/Release/net8.0/nino-gen.dll --assembly bin/Release/net10.0/Bench.dll \
            --lang ts --out gen --import-extension .ts
          # tinybench, protobuf-es and msgpackr (releases before them compared with JSON only, without a lockfile).
          if [[ -f package-lock.json ]]; then npm ci --no-audit --no-fund; fi
          NINO_BENCH_JSON="$RUNNER_TEMP/bench.json" node --no-warnings node.ts out/data
          mkdir -p "$RUNNER_TEMP/out"
          cp "$RUNNER_TEMP/bench.json" "$RUNNER_TEMP/out/$ASSET.json"
          python3 "$GITHUB_WORKSPACE/workflow/benchmarks/reports/runtimes_report.py" ${REPORT_ARCH:+--arch "$REPORT_ARCH"} typescript "$RUNNER_TEMP/bench.json" \
            "$TAG_NAME" > "$RUNNER_TEMP/out/$ASSET.md"

      - name: Run the Go benchmark
        if: matrix.lang == 'go'
        working-directory: release/runtimes/go/bench
        run: |
          set -euo pipefail
          # Six runs of each benchmark, summarized by benchstat (medians and their confidence intervals).
          go install golang.org/x/perf/cmd/benchstat@v0.0.0-20261009192801-be2c69fb417e
          go test -run '^$' -bench . -benchmem -count 6 . | tee "$RUNNER_TEMP/bench.txt"
          mkdir -p "$RUNNER_TEMP/out"
          "$(go env GOPATH)/bin/benchstat" -format csv "$RUNNER_TEMP/bench.txt" > "$RUNNER_TEMP/out/$ASSET.csv"
          python3 "$GITHUB_WORKSPACE/workflow/benchmarks/reports/runtimes_report.py" ${REPORT_ARCH:+--arch "$REPORT_ARCH"} go "$RUNNER_TEMP/out/$ASSET.csv" \
            "$TAG_NAME" > "$RUNNER_TEMP/out/$ASSET.md"

      - name: Run the Rust benchmark
        if: matrix.lang == 'rust'
        working-directory: release/runtimes/rust
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/target
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          # The output too: compare.rs prints each case's encoded sizes.
          cargo bench -p nino-bench --bench compare --locked 2>&1 | tee "$RUNNER_TEMP/bench.log"
          mkdir -p "$RUNNER_TEMP/out"
          python3 "$GITHUB_WORKSPACE/workflow/benchmarks/reports/runtimes_report.py" ${REPORT_ARCH:+--arch "$REPORT_ARCH"} rust "$CARGO_TARGET_DIR/criterion" \
            "$TAG_NAME" "$RUNNER_TEMP/bench.log" > "$RUNNER_TEMP/out/$ASSET.md"

      - name: Upload the section
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-section-${{ matrix.lang }}${{ matrix.arch == 'arm64' && '-arm64' || '' }}
          path: ${{ runner.temp }}/out
          retention-days: 30

  # After the .NET report (publish), so the two never edit the release body at once; also when publish was skipped
  # (its sections were there) or failed.
  publish-runtimes:
    name: Publish the runtime benchmarks
    needs: [ target, runtimes, publish ]
    if: ${{ always() && needs.target.result == 'success' && needs.target.outputs.runtimes != '[]' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG_NAME: ${{ needs.target.outputs.tag }}
    steps:
      # This workflow's commit, for benchmarks/reports/release_body.py, with the credentials that push the charts to the
      # release-notes branch.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: benchmarks

      # runtime-<lang>-<arch>.md and its data, from every language and architecture that finished.
      - name: Download the sections
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: runtime-section-*
          merge-multiple: true
          path: sections

      # The sections and their data as assets, a chart each, the body's benchmark part (benchmarks/reports/release_body.py).
      - name: Publish the results
        run: |
          set -euo pipefail
          shopt -s nullglob
          ARGS=()
          for FILE in sections/runtime-*; do ARGS+=("$(basename "$FILE")=$FILE"); done
          if (( ${#ARGS[@]} == 0 )); then
            echo "::warning::No runtime benchmark results (see the runtime benchmark jobs): nothing to publish"
            exit 0
          fi
          python3 benchmarks/reports/release_body.py publish --tag "$TAG_NAME" --dir "$RUNNER_TEMP/assets" "${ARGS[@]}"

  # Build time: Nino v3 3.3.13's source generator (NuGet) against the release's, on one x64 runner, at 330 and 1,100
  # types (benchmarks/Nino.GeneratorBenchmark: generator time, generated size, emit, re-generation after edits, IL).
  # This workflow's harness (its --json is newer than most tags) loads each side's Nino.Generator and Nino.Core by
  # path, as runtime-ab's generator lines do. Independent of the other sections; a failure leaves only this one out.
  generator:
    name: Build-time benchmark (source generator)
    needs: target
    if: needs.target.outputs.generator_skip != 'true'
    runs-on: ubuntu-26.04
    # v3 at 1,100 types emits 62 MB of generated source: 8 minutes a run on a 4-core Xeon.
    timeout-minutes: 120
    env:
      TAG_NAME: ${{ needs.target.outputs.tag }}
      # net8.0 harness on .NET 10, the runtime of the SDK's compiler.
      DOTNET_ROLL_FORWARD: LatestMajor
    steps:
      # The tag's generator and runtime; this workflow's commit for the harness and the report script.
      - name: Checkout the release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.target.outputs.tag }}
          path: release
          persist-credentials: false

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: workflow
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            10.0.x
            8.0.x

      # The harness's restore downloads v3's Nino.Generator and Nino.Serialization 3.3.13 (PackageDownload) into the
      # NuGet cache.
      - name: Build
        run: |
          set -euo pipefail
          dotnet build -c Release workflow/benchmarks/Nino.GeneratorBenchmark
          dotnet build -c Release release/src/Nino.Generator
          dotnet build -c Release -f net8.0 release/src/Nino.Core
          PACKAGES=$(dotnet nuget locals global-packages --list | sed 's/^global-packages: *//')
          {
            echo "HARNESS=$GITHUB_WORKSPACE/workflow/benchmarks/Nino.GeneratorBenchmark/bin/Release/net8.0/Nino.GeneratorBenchmark.dll"
            echo "V3_GENERATOR=${PACKAGES%/}/nino.generator/3.3.13/analyzers/dotnet/cs/Nino.Generator.dll"
            echo "V3_CORE=${PACKAGES%/}/nino.serialization/3.3.13/lib/net8.0/Nino.Core.dll"
            echo "V4_GENERATOR=$GITHUB_WORKSPACE/release/src/Nino.Generator/bin/Release/netstandard2.0/Nino.Generator.dll"
            echo "V4_CORE=$GITHUB_WORKSPACE/release/src/Nino.Core/bin/Release/net8.0/Nino.Core.dll"
          } >> "$GITHUB_ENV"

      # v3 then v4 at each size, one process each; the median of the measured runs, after warm-up runs (the harness's
      # --warmup: 60 s, at least one run). Fewer runs for v3 at 1,100 types (8 minutes each), and no analysis
      # (--no-analyzers): no row of the section reads it, and v3's analyzers bind its generated code, which doubles
      # its time.
      - name: Measure
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/generator"
          mkdir -p "$OUT"
          for roots in 30 100; do
            v3_runs=3; [[ $roots == 100 ]] && v3_runs=2
            dotnet "$HARNESS" "$roots" 8 --runs "$v3_runs" --no-analyzers --json "$OUT/v3-$roots.json" \
              --generator "$V3_GENERATOR" --core "$V3_CORE" < /dev/null
            dotnet "$HARNESS" "$roots" 8 --runs 5 --no-analyzers --json "$OUT/v4-$roots.json" \
              --generator "$V4_GENERATOR" --core "$V4_CORE" < /dev/null
          done
          python3 workflow/benchmarks/reports/test_generator_report.py
          python3 workflow/benchmarks/reports/generator_report.py section "$TAG_NAME" \
            --v3 "$OUT"/v3-*.json --v4 "$OUT"/v4-*.json > "$OUT/section.md"
          cat "$OUT/section.md"

      - name: Upload the section
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generator-section
          path: ${{ runner.temp }}/generator
          retention-days: 30

  # After publish and publish-runtimes (no two jobs edit the manifest or the body at once); also when they were skipped
  # or failed. Publishes the build section and its data (build-x64.md, build-<v3|v4>-<roots>.json), then, for the
  # newest v4 release, fills the README's Build row and the build tables of docs/v4-benchmarks.md from that asset
  # (benchmarks/reports/readme.py --assets) and pushes them to main: here, not in publish, which runs only for a
  # release without its .NET results and before this one exists.
  publish-generator:
    name: Publish the build-time benchmark
    needs: [ target, generator, publish, publish-runtimes ]
    if: ${{ always() && needs.target.result == 'success' && needs.target.outputs.generator_skip != 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG_NAME: ${{ needs.target.outputs.tag }}
    steps:
      # This workflow's commit for the report script; main's README, docs and readme.py below.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download the section
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: generator-section
          path: ${{ runner.temp }}/generator

      - name: Publish the results
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/generator/generator-section"
          if [[ ! -s "$DIR/section.md" ]]; then
            echo "::warning::No build section (see the build-time benchmark job): it is left out"
            exit 0
          fi
          ARGS=(build-x64.md="$DIR/section.md")
          for FILE in "$DIR"/v3-*.json "$DIR"/v4-*.json; do ARGS+=("build-$(basename "$FILE")=$FILE"); done
          python3 benchmarks/reports/release_body.py publish --tag "$TAG_NAME" --dir "$RUNNER_TEMP/assets" "${ARGS[@]}"
          echo "PUBLISHED=true" >> "$GITHUB_ENV"

      # README.md, README.zh.md and docs/v4-benchmarks.md show the newest v4 release, from the asset just published.
      - name: Update the README build numbers
        if: env.PUBLISHED == 'true'
        run: |
          set -euo pipefail
          LATEST=$(gh release list --limit 50 --json tagName,publishedAt \
            --jq '[.[] | select(.tagName | startswith("v4."))] | sort_by(.publishedAt) | last | .tagName')
          if [[ "$TAG_NAME" != "$LATEST" ]]; then
            echo "⏭️ $TAG_NAME is not the newest v4 release ($LATEST): README left as it is"
            exit 0
          fi
          git fetch origin main
          git checkout --detach origin/main
          if ! python3 benchmarks/reports/readme.py --assets "$RUNNER_TEMP/assets" --tag "$TAG_NAME"; then
            echo "::warning::benchmarks/reports/readme.py could not read the build section: README left as it is"
            exit 0
          fi
          .github/scripts/push_main.sh "docs(benchmarks): update build numbers for $TAG_NAME" README.md README.zh.md \
            docs/v4-benchmarks.md

      # The docs site reads the build asset too (its build tables): rebuild it once the asset is attached.
      - *rebuild-docs

  # The Burst kernels in a Unity IL2CPP player, each Unity version unity.yml tests: its benchmark run (a release
  # player, the correctness tests and Test.Runtime.Burst.BurstBenchmark), which waits in unity.yml's concurrency group
  # for any running Unity job (one license seat at a time) and is never cancelled while it runs. A failure here
  # fails this run, visibly, and leaves only the Unity section out: no other job needs it.
  unity:
    name: Unity benchmark
    needs: target
    if: needs.target.outputs.unity_skip != 'true'
    permissions:
      contents: read
      checks: write
    uses: ./.github/workflows/unity.yml
    with:
      benchmark: true
      tag: ${{ needs.target.outputs.tag }}
    secrets: inherit

  # After the other publish jobs (publish, publish-runtimes, publish-generator), so no two jobs edit the manifest or the
  # body at once; also when they were skipped or failed. Publishes the Unity section (unity-x64.md) and its chart.
  publish-unity:
    name: Publish the Unity benchmark
    needs: [ target, unity, publish, publish-runtimes, publish-generator ]
    if: ${{ always() && needs.target.result == 'success' && needs.target.outputs.unity_skip != 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG_NAME: ${{ needs.target.outputs.tag }}
    steps:
      # This workflow's commit, for the report scripts, with the credentials that push the chart to the release-notes
      # branch.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: benchmarks

      # One folder per Unity version (unity-bench/unity-bench-<version>: results.xml and build.txt).
      - name: Download the benchmark results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: unity-bench-*
          path: unity-bench

      - name: Publish the results
        run: |
          set -euo pipefail
          shopt -s nullglob
          # One folder per Unity version, oldest first.
          mapfile -t FILES < <(printf '%s\n' unity-bench/unity-bench-*/ | sort -V)
          if (( ${#FILES[@]} == 0 )); then
            echo "::warning::No Unity benchmark results (see the Unity benchmark job): the Unity section is left out"
            exit 0
          fi
          python3 benchmarks/reports/test_unity_report.py
          if ! python3 benchmarks/reports/unity_report.py "$TAG_NAME" "${FILES[@]}" > section.md; then
            echo "::warning::benchmarks/reports/unity_report.py found no performance test results: the Unity section is left out"
            exit 0
          fi
          cat section.md
          python3 benchmarks/reports/release_body.py publish --tag "$TAG_NAME" --dir "$RUNNER_TEMP/assets" \
            unity-x64.md=section.md
