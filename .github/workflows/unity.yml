name: Unity

# The Unity tests, apart from ci.yml: they activate the Unity license, which has few seats. A seat is taken when a job
# activates and given back when its tests end; a job cancelled in between never gives it back (it stays taken until
# it is returned on id.unity.com). So this workflow never cancels a running job (a newer run waits in the queue, and
# GitHub replaces a waiting run with a newer one before it starts), runs one Unity version at a time, and runs only
# when what Unity loads changes. CI therefore takes at most one seat at any moment, whatever is pushed.
#
# report.yml calls it for each release with `benchmark: true`: the editor's tests are skipped, the IL2CPP player is
# built as a release build (Test.Editor.Burst.BenchmarkPlayerBuild) and runs the correctness tests and the Burst
# benchmark (Test.Runtime.Burst.BurstBenchmark), and the lines the benchmark logs are uploaded per Unity version
# (artifacts unity-bench-<version>) for benchmarks/unity_report.py. A called run joins the same concurrency group, so
# it waits for a running Unity job and is never cancelled while it runs.

on:
  push:
    # TEST BRANCH ONLY (never on main): claude/zen-goldberg-5qqqcu runs the benchmark once.
    branches: [ "main", "develop", "claude/zen-goldberg-5qqqcu" ]
    paths:
      - 'src/Nino.Core/**'
      - 'src/Nino.Generator/**'
      - 'src/Nino.Generator.CodeFixes/**'
      - 'src/Nino.UnityTypes/**'
      - 'src/Nino.Unity/**'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'nuget.config'
      - '.github/workflows/unity.yml'
  pull_request:
    branches: [ "main", "develop" ]
    paths:
      - 'src/Nino.Core/**'
      - 'src/Nino.Generator/**'
      - 'src/Nino.Generator.CodeFixes/**'
      - 'src/Nino.UnityTypes/**'
      - 'src/Nino.Unity/**'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'nuget.config'
      - '.github/workflows/unity.yml'
  workflow_dispatch:
    inputs:
      benchmark:
        description: 'Run the Burst benchmark in a release IL2CPP player (skips the editor tests)'
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      benchmark:
        description: 'Run the Burst benchmark in a release IL2CPP player (skips the editor tests)'
        required: false
        type: boolean
        default: false
      ref:
        description: 'The ref to check out (the release tag); empty for the calling workflow''s commit'
        required: false
        type: string
        default: ''

# One group for every ref and every caller (report.yml's call included): one Unity run at a time in the repository,
# never cancelled while it runs.
concurrency:
  group: unity-license
  cancel-in-progress: false

permissions:
  contents: read
  # unity-test-runner posts its results as a check run, even without githubToken.
  checks: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  # The benchmark's run: the release player, and Nino.Core's Release build (the one the package ships).
  BENCHMARK: ${{ (inputs.benchmark || github.ref == 'refs/heads/claude/zen-goldberg-5qqqcu') && 'true' || 'false' }}

jobs:
  unity-tests:
    name: Unity tests (${{ matrix.unity }})
    runs-on: ubuntu-26.04
    # The editor's tests, then an IL2CPP player build (the test player, the Burst AOT library) and its tests.
    # The benchmark's run skips the editor's tests and adds a few minutes of timing to the player's.
    timeout-minutes: 100
    strategy:
      fail-fast: false
      # One version after the other: each run activates the license, holds a seat until its tests end and returns it.
      max-parallel: 1
      matrix:
        # The oldest Unity the package supports (package.json: 2022.3) at its newest patch outside Extended LTS (later
        # 2022.3 builds need an Industry or Enterprise license), the project's own version, and the newest Unity 6 LTS.
        unity: [ '2022.3.62f2', '6000.3.27f1' ]
    # Pull requests from forks and from Dependabot get no repository secrets, so they cannot activate the license.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login != 'dependabot[bot]')

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || '' }}
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            ${{ vars.DOTNET_VERSION || '10.0.x' }}
            10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-unity-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ runner.arch }}-unity-
            nuget-${{ runner.os }}-${{ runner.arch }}-

      # Debug builds for the tests (their assertions), Release for the benchmark (what the package ships).
      - name: Build the DLLs Unity loads
        env:
          CONFIG: ${{ env.BENCHMARK == 'true' && 'Release' || 'Debug' }}
        run: |
          dotnet build src/Nino.Core/Nino.Core.csproj -c "$CONFIG" -f netstandard2.1
          dotnet build src/Nino.Generator/Nino.Generator.csproj -c "$CONFIG"
          dotnet build src/Nino.Generator.CodeFixes/Nino.Generator.CodeFixes.csproj -c "$CONFIG"
          dotnet build src/Nino.UnityTypes/Nino.UnityTypes.csproj -c "$CONFIG"
          cp "./src/Nino.Core/bin/$CONFIG/netstandard2.1/Nino.Core.dll" ./src/Nino.Unity/Packages/com.jasonxudeveloper.nino/Runtime/Nino.Core.dll
          # The Roslyn 4.3 build: Unity's compiler cannot load the 4.12 one.
          cp "./src/Nino.Generator/bin/$CONFIG/netstandard2.0/Nino.Generator.dll" ./src/Nino.Unity/Packages/com.jasonxudeveloper.nino/Runtime/Nino.Generator.dll
          # Code fixes, for Rider and Visual Studio: Unity lists RoslynAnalyzer DLLs in the projects it generates.
          cp "./src/Nino.Generator.CodeFixes/bin/$CONFIG/netstandard2.0/Nino.Generator.CodeFixes.dll" ./src/Nino.Unity/Packages/com.jasonxudeveloper.nino/Runtime/Nino.Generator.CodeFixes.dll
          cp "./src/Nino.UnityTypes/bin/$CONFIG/netstandard2.1/Nino.UnityTypes.dll" ./src/Nino.Unity/Packages/com.jasonxudeveloper.nino/Runtime/Nino.UnityTypes.dll
          echo "NINO_CONFIG=$CONFIG" >> "$GITHUB_ENV"

      - name: Cache Unity Library
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src/Nino.Unity/Library
          key: Library-Nino-${{ runner.os }}-${{ matrix.unity }}-${{ hashFiles('src/Nino.Unity/Assets/**', 'src/Nino.Unity/Packages/**', 'src/Nino.Unity/ProjectSettings/**') }}
          restore-keys: |
            Library-Nino-${{ runner.os }}-${{ matrix.unity }}-

      # Edit mode and play mode tests in the editor (Mono, Burst's JIT).
      - name: Run the editor's tests
        if: env.BENCHMARK != 'true'
        uses: game-ci/unity-test-runner@32e57712352b500e17974b245a6dce9e11a73213 # v4.4.0
        id: editor-tests
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: ./src/Nino.Unity
          testMode: all
          artifactsPath: artifacts/editor
          # The image with the Linux IL2CPP module, which the player step below needs: one image for both steps.
          customImage: unityci/editor:ubuntu-${{ matrix.unity }}-linux-il2cpp-3
          # No githubToken: posting the results as a check run calls the GitHub API, and a timeout there failed a run
          # whose tests had all passed. The results are uploaded below, and a failed test still fails this step.
          unityVersion: ${{ matrix.unity }}
          # A fixed release: "latest" asks the GitHub API for it on every run, and a 403 from its rate limit failed the job.
          cliVersion: 'v0.1.72'

      # The play mode tests in a Linux player built with IL2CPP (ProjectSettings: Standalone scripting backend 1) and
      # Burst AOT, where the paths through the runtime's own collections and the Burst function pointers run as they do
      # on devices. It runs after a failure of the editor's tests too, so one run shows both; the steps run one after
      # the other, so the job still holds one seat at a time.
      # Code coverage off: it instruments only the editor's code (game-ci's own note), and its -debugCodeOptimization
      # compiled the player's scripts as Debug. With the benchmark, -ninoBenchmark builds the player without the
      # Development flag and with the benchmark in it (Test.Editor.Burst.BenchmarkPlayerBuild).
      - name: Run the IL2CPP player's tests
        if: success() || steps.editor-tests.conclusion == 'failure'
        uses: game-ci/unity-test-runner@32e57712352b500e17974b245a6dce9e11a73213 # v4.4.0
        id: player-tests
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: ./src/Nino.Unity
          testMode: standalone
          artifactsPath: artifacts/player
          customImage: unityci/editor:ubuntu-${{ matrix.unity }}-linux-il2cpp-3
          coverageEnabled: false
          customParameters: ${{ env.BENCHMARK == 'true' && '-ninoBenchmark' || '' }}
          unityVersion: ${{ matrix.unity }}
          # A fixed release: "latest" asks the GitHub API for it on every run, and a 403 from its rate limit failed the job.
          cliVersion: 'v0.1.72'

      # The benchmark's lines: the editor's NINO_UNITY_BUILD (how the player was built), the player's NINO_UNITY_ENV and
      # NINO_UNITY_BENCH lines, and this job's NINO_UNITY_CI line. Fails (after the results are uploaded below) when
      # the player logged no benchmark line, so a release whose Unity section is missing shows why.
      - name: Collect the benchmark lines
        id: bench
        if: always() && env.BENCHMARK == 'true' && steps.player-tests.conclusion != 'skipped'
        env:
          UNITY_VERSION: ${{ matrix.unity }}
        run: |
          set -euo pipefail
          mkdir -p bench
          OUT="bench/unity-bench-$UNITY_VERSION.txt"
          {
            grep -ho 'NINO_UNITY_[A-Z]*|.*' artifacts/player/standalone.log artifacts/player/standalone-player.log || true
            echo "NINO_UNITY_CI|nino_core=$NINO_CONFIG|runner=$ImageOS ($ImageVersion)"
          } > "$OUT"
          cat "$OUT"
          if ! grep -q '^NINO_UNITY_BENCH|' "$OUT"; then
            echo "has_rows=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_rows=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the benchmark lines
        if: always() && steps.bench.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unity-bench-${{ matrix.unity }}
          path: bench/unity-bench-${{ matrix.unity }}.txt
          retention-days: 30

      - name: Upload Unity results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        # A storage timeout is not a test result.
        continue-on-error: true
        with:
          name: test-results-unity-${{ matrix.unity }}
          path: |
            ./artifacts
            ${{ steps.editor-tests.outputs.coveragePath }}
          retention-days: 30

      - name: Check the benchmark ran
        if: always() && steps.bench.outputs.has_rows == 'false'
        run: |
          echo "::error::The IL2CPP player logged no NINO_UNITY_BENCH line (see its log in test-results-unity-${{ matrix.unity }})"
          exit 1
