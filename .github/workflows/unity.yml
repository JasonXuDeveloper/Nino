name: Unity

# The Unity tests, apart from ci.yml: they activate the Unity license, which has few seats. A seat is taken when a job
# activates and given back when its tests end; a job cancelled in between never gives it back (it stays taken until
# it is returned on id.unity.com). So this workflow never cancels a running job (a newer run waits in the queue, and
# GitHub replaces a waiting run with a newer one before it starts), runs one Unity version at a time, and runs only
# when what Unity loads changes. CI therefore takes at most one seat at any moment, whatever is pushed.
#
# report.yml calls it for each release with `benchmark: true`: the editor's tests are skipped, the IL2CPP player is
# built as a release build (Test.Editor.Burst.BenchmarkPlayerBuild) and runs the correctness tests and the Burst
# benchmark (Test.Runtime.Burst.BurstBenchmark, measured with the Unity Performance Testing package), and its results
# are uploaded per Unity version (artifacts unity-bench-<version>) for benchmarks/reports/unity_report.py. A called run joins the same concurrency group, so
# it waits for a running Unity job and is never cancelled while it runs. The webgl job then builds a WebGL player per
# version and runs it in headless Chrome (Nino.WebGL's kernels; timed too in the benchmark's run).

on:
  push:
    branches: [ "main", "claude/magical-gauss-7fd7mj" ]
    paths: &paths
      - 'src/Nino.Core/**'
      - 'src/Nino.Generator/**'
      - 'src/Nino.Generator.CodeFixes/**'
      - 'src/Nino.UnityTypes/**'
      - 'src/Nino.Unity/**'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'nuget.config'
      - '.github/workflows/unity.yml'
      - '.github/scripts/webgl_run.mjs'
      - '!**/AGENTS.md'      # agent instructions only: nothing to build or test
      - '!**/CLAUDE.md'
  pull_request:
    branches: [ "main" ]
    paths: *paths
  workflow_dispatch:
    inputs:
      benchmark:
        description: 'Run the Burst benchmark in a release IL2CPP player (skips the editor tests)'
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      benchmark:
        description: 'Run the Burst benchmark in a release IL2CPP player (skips the editor tests)'
        required: false
        type: boolean
        default: false
      tag:
        description: 'The release tag to check out (vX.Y.Z); empty for the calling workflow''s commit'
        required: false
        type: string
        default: ''

# One group for every ref and every caller (report.yml's call included): one Unity run at a time in the repository,
# never cancelled while it runs. A pull request from a fork or Dependabot skips every job (no secrets, no license), so
# it gets a group of its own: in the shared group it would replace the waiting run, as one did to report.yml's
# rc.9 call (GitHub keeps one waiting run per group and cancels the older one).
concurrency:
  group: >-
    ${{ github.event_name == 'pull_request' &&
        (github.event.pull_request.head.repo.full_name != github.repository ||
         github.event.pull_request.user.login == 'dependabot[bot]') &&
        format('unity-unlicensed-{0}', github.run_id) || 'unity-license' }}
  cancel-in-progress: false

permissions:
  contents: read
  # unity-test-runner posts its results as a check run, even without githubToken.
  checks: write

# Bash with -e and -o pipefail for every run step: a command piped into tee, grep or sed fails its step when it fails.
defaults:
  run:
    shell: bash

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  # The benchmark's run: the release player, and Nino.Core's Release build (the one the package ships).
  BENCHMARK: ${{ inputs.benchmark && 'true' || 'false' }}

jobs:
  unity-tests:
    name: Unity tests (${{ matrix.unity }})
    runs-on: ubuntu-26.04
    # The editor's tests, then an IL2CPP player build (the test player, the Burst AOT library) and its tests.
    # The benchmark's run skips the editor's tests and adds a few minutes of timing to the player's.
    timeout-minutes: 100
    strategy:
      fail-fast: false
      # One version after the other: each run activates the license, holds a seat until its tests end and returns it.
      max-parallel: 1
      matrix:
        # One row per Burst major the package supports, since Burst versions compile the same kernels differently
        # (a combined Neon/SSE2 test passed on 1.8 and threw on 2.0): the oldest Unity the package supports
        # (package.json: 2022.3, the project's own version) at its newest patch outside Extended LTS (later 2022.3
        # builds need an Industry or Enterprise license) with Burst 1.8.29 (Packages/manifest.json), and Unity
        # 6000.6, whose editor bundles Burst 2.0 as a built-in module (Editor/Data/Tools/Burst; the manifest's
        # com.unity.burst resolves to its 2.0.0 shim there). A new Burst major gets a row before the package claims it.
        unity: [ '2022.3.62f2', '6000.6.9f1' ]
    # Pull requests from forks and from Dependabot get no repository secrets, so they cannot activate the license.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login != 'dependabot[bot]')

    env:
      # The image with the Linux IL2CPP module, which the player step below needs: one image for both steps.
      UNITY_IMAGE: unityci/editor:ubuntu-${{ matrix.unity }}-linux-il2cpp-3
      # Debug builds for the tests (their assertions), Release for the benchmark (what the package ships).
      NINO_CONFIG: ${{ inputs.benchmark && 'Release' || 'Debug' }}

    steps:
      - &check-tag
        name: Check the release tag
        if: inputs.tag != ''
        env:
          TAG: ${{ inputs.tag }}
        run: |
          # Only a release tag (release.yml makes them from main): never a branch or another ref.
          [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::not a release tag: $TAG"; exit 1; }

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || '' }}
          persist-credentials: false

      # The editor's image is some 5.5 GB, and pulling it took over a minute and a half of the editor's test step.
      # Pulled in the background instead, while .NET is set up, the DLLs built and the Library restored; the test
      # step waits for it (and pulls it itself if this pull failed). The license is activated in the test step only.
      - name: Pull the Unity image (in the background)
        run: |
          # shellcheck disable=SC2016  # expanded by the inner bash
          nohup bash -c 'docker pull -q "$UNITY_IMAGE" > "$RUNNER_TEMP/pull.log" 2>&1; echo $? > "$RUNNER_TEMP/pull.status"' \
            > /dev/null 2>&1 &

      # setup-dotnet itself, not ./.github/actions/setup-dotnet: report.yml calls this workflow on a release tag's
      # tree, and tags up to v4.0.0-rc.7 have no such action.
      - &setup-dotnet
        name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      # Restored here and saved below only when the job runs the calling workflow's own commit: a run on a release
      # tag (report.yml) reads the caches and never writes them, so no checked-out ref other than this commit's can
      # fill a cache the default branch restores (cache poisoning; audit-ci, "Least privilege").
      - name: Restore NuGet packages
        id: nuget-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-unity-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ runner.arch }}-unity-
            nuget-${{ runner.os }}-${{ runner.arch }}-

      # The commit's code over the DLLs committed in the package, in the job's NINO_CONFIG.
      - &build-dlls
        name: Build the DLLs Unity loads
        run: |
          dotnet build src/Nino.Core/Nino.Core.csproj -c "$NINO_CONFIG" -f netstandard2.1
          dotnet build src/Nino.Generator/Nino.Generator.csproj -c "$NINO_CONFIG"
          dotnet build src/Nino.Generator.CodeFixes/Nino.Generator.CodeFixes.csproj -c "$NINO_CONFIG"
          dotnet build src/Nino.UnityTypes/Nino.UnityTypes.csproj -c "$NINO_CONFIG"
          runtime=./src/Nino.Unity/Packages/com.jasonxudeveloper.nino/Runtime
          cp "./src/Nino.Core/bin/$NINO_CONFIG/netstandard2.1/Nino.Core.dll" "$runtime/"
          # The Roslyn 4.3 build: Unity's compiler cannot load the 4.12 one.
          cp "./src/Nino.Generator/bin/$NINO_CONFIG/netstandard2.0/Nino.Generator.dll" "$runtime/"
          # Code fixes, for Rider and Visual Studio: Unity lists RoslynAnalyzer DLLs in the projects it generates.
          cp "./src/Nino.Generator.CodeFixes/bin/$NINO_CONFIG/netstandard2.0/Nino.Generator.CodeFixes.dll" "$runtime/"
          cp "./src/Nino.UnityTypes/bin/$NINO_CONFIG/netstandard2.1/Nino.UnityTypes.dll" "$runtime/"

      - name: Save NuGet packages
        if: inputs.tag == '' && steps.nuget-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ steps.nuget-cache.outputs.cache-primary-key }}

      # Keyed by the project's sources, not by the DLLs the step above built into Packages: those differ in every
      # commit, so every run missed the key and saved another 800 MB per version, which pushed the other caches out
      # of the repository's 10 GB. Unity reimports what changed since the cached Library.
      - name: Restore the Unity Library
        id: library-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src/Nino.Unity/Library
          key: Library-Nino-${{ runner.os }}-${{ matrix.unity }}-${{ hashFiles('src/Nino.Unity/Assets/**', 'src/Nino.Unity/ProjectSettings/**', 'src/Nino.Unity/Packages/**', '!src/Nino.Unity/Packages/**/*.dll') }}
          restore-keys: |
            Library-Nino-${{ runner.os }}-${{ matrix.unity }}-

      - name: Wait for the Unity image
        timeout-minutes: 15
        # A stuck pull is not a test result: the test step pulls the image itself.
        continue-on-error: true
        run: |
          until [[ -f $RUNNER_TEMP/pull.status ]]; do sleep 2; done
          cat "$RUNNER_TEMP/pull.log"
          if [[ $(cat "$RUNNER_TEMP/pull.status") != 0 ]]; then
            echo "::warning::pulling $UNITY_IMAGE failed; the test step pulls it again"
          fi

      # Who sends a fatal signal, recorded by the host's kernel for the Unity steps below and printed by "Show the
      # kernel's kills". The 6000.6.9f1 editor was SIGKILLed 1.2 to 1.5 s after launch, each time right after
      # "Registered in ... seconds." in its first domain reload (runs 43290338104 and 43299892840), with no OOM in the
      # kernel's log, 14 GB free and /dev/shm at 1025 MB or 2 GB alike: something sent it. The tracepoint
      # signal:signal_generate names the sender (the task before the colon: its thread name and host PID, then its
      # process's PID in parentheses: record-tgid) and the target (comm=, pid=), the kernel stack says how
      # (__x64_sys_kill or tgkill from a process, oom_kill_process, a seccomp or fault path from the kernel) and the
      # user stack from where in the sender. Filtered to SIGKILL, SIGABRT, SIGBUS, SIGSEGV and SIGSYS, the buffer holds
      # a handful of lines. Runs 43309471749 and 43316317360 showed the sender of each kill as a thread named "Unity
      # Main Thread" and targets named like the editor's threads (llvmpipe-2, Unity:disk$0, AssetDatabase.I), not
      # which process either belonged to: the instance nino-procs records every task's creation (sched_process_fork),
      # program (sched_process_exec), name changes (task_rename) and end (sched_process_exit) in a buffer of its own,
      # without user stacks, so the report can name the sender's process, its program and its parents, and each
      # task's PID inside its container (a container numbers its tasks 1, 2, 3, ... in creation order from the task
      # runc's [1:CHILD] creates).
      - name: Trace fatal signals
        continue-on-error: true
        run: |
          sudo sh -eu <<'EOF'
          t=/sys/kernel/tracing
          [ -d "$t/events" ] || mount -t tracefs nodev "$t"
          echo 4096 > "$t/buffer_size_kb"
          # The header's thread names and process IDs, kept for every task the run creates (record-cmd keeps 128).
          echo 32768 > "$t/saved_cmdlines_size" || echo "saved_cmdlines_size stays $(cat "$t/saved_cmdlines_size")"
          for option in record-tgid record-cmd userstacktrace sym-userobj; do
            echo 1 > "$t/options/$option" || echo "no trace option $option"
          done
          event=$t/events/signal/signal_generate
          echo 'sig == 9 || sig == 6 || sig == 7 || sig == 11 || sig == 31' > "$event/filter"
          echo 'stacktrace if sig == 9' > "$event/trigger"
          echo 1 > "$event/enable"
          if [ -d "$t/events/oom/mark_victim" ]; then echo 1 > "$t/events/oom/mark_victim/enable"; fi
          echo 1 > "$t/tracing_on"
          procs=$t/instances/nino-procs
          mkdir -p "$procs"
          echo 16384 > "$procs/buffer_size_kb"
          for option in userstacktrace sym-userobj; do echo 0 > "$procs/options/$option"; done
          for event in sched/sched_process_fork sched/sched_process_exec sched/sched_process_exit task/task_rename; do
            echo 1 > "$procs/events/$event/enable"
          done
          echo 1 > "$procs/tracing_on"
          EOF

      # Unity can hang in batch mode: the 2022.3 editor stopped twice after loading the project, its log ending at
      # "Unloading 3 Unused Serialized files" where a normal launch goes on to "Unloading 45 unused Assets" and quits
      # (runs 41082628657 and 41172149972, each a later launch in its container, licensing already done), and the job
      # held the license seat until its 100-minute timeout. So every Unity launch is bounded inside the container:
      # game-ci CLI v0.1.72 prefixes each `unity-editor` call (activation, tests, builds; not the license return) with
      # ENGINE_LAUNCH_WRAPPER, read from the action's environment. `timeout` kills the editor's process group (SIGKILL a
      # minute after SIGTERM), the step fails, and the container's script still returns the license. The step's own
      # timeout-minutes is only the backstop: a cancelled step never returns the seat (the script in the container
      # runs as PID 1 and gets no signal it handles), and the next step would start Unity beside the hung one. Bounds
      # are some five to ten times the normal durations (run 41169746541 and the nine runs before it: both editor test
      # launches together at most 2.7 minutes, a player step 3.5, a WebGL build 8.5).
      #
      # Edit mode and play mode tests in the editor (Mono, Burst's JIT), one step each: `testMode: all` adds a third
      # launch (COMBINE_RESULTS: the editor opened with -quit, for the Code Coverage package to merge its results),
      # and the project has no such package, so that launch did nothing ("Coverage results directory does not exist")
      # but take another 10 seconds and another chance to hang. The edit mode step runs after a failure of the play
      # mode one too, so one run shows both.
      #
      # Code coverage off in every step (GAME_CI_COVERAGE_ENABLED, the CLI's coverageEnabled option: the action's own
      # coverageEnabled: false passes --no-coverageEnabled, which CLI v0.1.72 rejects as an unknown argument, while
      # the variable reaches the CLI because the action passes no coverage flag at its default). On, the CLI adds
      # -enableCodeCoverage -debugCodeOptimization -coverageOptions to each editor launch: the project has no Code
      # Coverage package, so it collected nothing ("Coverage results directory does not exist"), but the editor ran
      # in Debug code optimization with Mono's coverage instrumentation, slower, and every 6000.6.9f1 SIGKILL
      # (runs 43290338104, 43299892840) came in the first domain reload right after "Code Coverage is enabled".
      - name: Run the editor's play mode tests
        if: env.BENCHMARK != 'true'
        uses: game-ci/unity-test-runner@32e57712352b500e17974b245a6dce9e11a73213 # v4.4.0
        id: playmode-tests
        timeout-minutes: 25
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          ENGINE_LAUNCH_WRAPPER: timeout -k 60 15m
          GAME_CI_COVERAGE_ENABLED: 'false'
        with:
          projectPath: ./src/Nino.Unity
          testMode: playmode
          artifactsPath: artifacts/editor
          customImage: ${{ env.UNITY_IMAGE }}
          # No githubToken: posting the results as a check run calls the GitHub API, and a timeout there failed a run
          # whose tests had all passed. The results are uploaded below, and a failed test still fails this step.
          unityVersion: ${{ matrix.unity }}
          # A fixed release: "latest" asks the GitHub API for it on every run, and a 403 from its rate limit failed the job.
          cliVersion: 'v0.1.72'

      - name: Run the editor's edit mode tests
        if: env.BENCHMARK != 'true' && (success() || steps.playmode-tests.conclusion == 'failure')
        uses: game-ci/unity-test-runner@32e57712352b500e17974b245a6dce9e11a73213 # v4.4.0
        id: editmode-tests
        timeout-minutes: 25
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          ENGINE_LAUNCH_WRAPPER: timeout -k 60 15m
          GAME_CI_COVERAGE_ENABLED: 'false'
        with:
          projectPath: ./src/Nino.Unity
          testMode: editmode
          artifactsPath: artifacts/editor
          customImage: ${{ env.UNITY_IMAGE }}
          unityVersion: ${{ matrix.unity }}
          cliVersion: 'v0.1.72'

      # The play mode tests in a Linux player built with IL2CPP (ProjectSettings: Standalone scripting backend 1) and
      # Burst AOT, where the paths through the runtime's own collections and the Burst function pointers run as they do
      # on devices. It runs after a failure of the editor's tests too, so one run shows both; the steps run one after
      # the other, so the job still holds one seat at a time. The player itself runs outside ENGINE_LAUNCH_WRAPPER (under
      # xvfb-run), bounded only by the step's timeout.
      # With the benchmark, -ninoBenchmark builds the player without the Development flag and with the benchmark in it
      # (Test.Editor.Burst.BenchmarkPlayerBuild).
      - name: Run the IL2CPP player's tests
        if: >-
          success() || steps.playmode-tests.conclusion == 'failure' || steps.editmode-tests.conclusion == 'failure'
        uses: game-ci/unity-test-runner@32e57712352b500e17974b245a6dce9e11a73213 # v4.4.0
        id: player-tests
        # The benchmark's run adds a few minutes of timing to the player.
        timeout-minutes: 35
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          ENGINE_LAUNCH_WRAPPER: timeout -k 60 20m
          GAME_CI_COVERAGE_ENABLED: 'false'
        with:
          projectPath: ./src/Nino.Unity
          testMode: standalone
          artifactsPath: artifacts/player
          customImage: ${{ env.UNITY_IMAGE }}
          customParameters: ${{ env.BENCHMARK == 'true' && '-ninoBenchmark' || '' }}
          unityVersion: ${{ matrix.unity }}
          # A fixed release: "latest" asks the GitHub API for it on every run, and a 403 from its rate limit failed the job.
          cliVersion: 'v0.1.72'

      # Who killed a Unity process. A SIGKILL leaves only "Killed" (xvfb-run's dash, for the editor alone) and exit
      # code 137 in the step's log, the editor's log ends wherever it was, and the container is gone (--rm): only the
      # host's kernel log tells an OOM kill (the container's cgroup: game-ci passes --memory at 95% of the RAM, and
      # Unity 6000.6's Data Store maps 1 GiB of the container's 1025 MB /dev/shm) from a kill by another process
      # (run 43290338104: the 6000.6.9f1 player step's editor, 1.3 s after launch, in its first domain reload). The
      # trace started by "Trace fatal signals" names the sender of every SIGKILL; the script below adds, for each one
      # sent by a process, the sender thread's creation and names, the sender's process with its program and parents,
      # the target's, and their PIDs inside the container, and lists every Unity editor and Data Store started with
      # its PID in its container. Runs on a green job too: a passing launch's Data Store got a SIGKILL at shutdown
      # from a thread named "Unity Main Thread" (run 43316317360's player step), and a kill that missed the editor
      # shows only here. The last dmesg
      # lines prove the kernel's log was readable when the grep finds nothing.
      - name: Show the kernel's kills
        if: always()
        continue-on-error: true
        run: |
          sudo dmesg -T | grep -iE 'out of memory|oom|killed process|segfault|traps:' | tail -n 40 || true
          sudo dmesg -T | tail -n 3
          free -m
          t=/sys/kernel/tracing
          echo 0 | sudo tee "$t/tracing_on" "$t/instances/nino-procs/tracing_on" > /dev/null || true
          sudo python3 -I - "$t/trace" "$t/instances/nino-procs/trace" <<'EOF'
          import re, sys
          head = re.compile(r'\s*(?P<comm>.*?)-(?P<tid>\d+)\s+\(\s*(?P<tgid>[\d-]+)\)\s+\[\d+\]\s+\S+\s+[\d.]+:\s+(?P<event>\w+):\s*(?P<rest>.*)')
          field = re.compile(r'(\w+)=(.*?)(?=\s\w+=|$)')
          def read(path):
              try:
                  with open(path) as f: return [line.rstrip() for line in f if not line.startswith('#')]
              except OSError as e:
                  print(f'cannot read {path}: {e}'); return []
          kills, tasks, nspid, count = [], {}, {}, {}  # tasks: host PID -> its fork (as the child), exec, rename and exit lines
          for line in read(sys.argv[1]):
              m = head.match(line)
              if m and m['event'] in ('signal_generate', 'mark_victim'): kills.append((m, [line]))
              elif kills: kills[-1][1].append(line)
          for line in read(sys.argv[2]):
              if not (m := head.match(line)): continue
              f = dict(field.findall(m['rest']))
              pid = int(f.get('child_pid') or f['pid'])
              tasks.setdefault(pid, []).append((m, f, line))
              if m['event'] != 'sched_process_fork': continue
              # A pid namespace numbers its tasks 1, 2, 3, ... in creation order: its init is the task runc's [1:CHILD]
              # (unshare -fp's child, locally) creates, and every task a task inside creates counts.
              if f['comm'].startswith('runc:[1:CHILD]') or f['comm'] == 'unshare': nspid[pid] = (pid, 1); count[pid] = 1
              elif (parent := nspid.get(int(m['tid']))):
                  count[parent[0]] += 1; nspid[pid] = (parent[0], count[parent[0]])
          def ns(pid): return f' (PID {nspid[pid][1]} in the container of host PID {nspid[pid][0]})' if pid in nspid else ''
          def creator(pid):  # the process that created pid
              return next((int(m['tgid']) for m, f, _ in tasks.get(pid, []) if m['event'] == 'sched_process_fork' and m['tgid'].isdigit()), None)
          def show(label, pid, seen, walk=True):
              print(f'  {label} {pid}{ns(pid)}:')
              while pid and pid not in seen:
                  seen.add(pid)
                  for _, _, line in tasks.get(pid, [(None, None, f'{pid}: nothing recorded (started before the trace)')]): print('    ' + line.strip())
                  pid = creator(pid) if walk else None
          print('--- Unity editors and Data Stores started (host PID, then PID in its container) ---')
          for pid, lines in tasks.items():
              for m, f, line in lines:
                  if m['event'] == 'sched_process_exec' and re.search(r'/Unity(\.DataStore)?$', f['filename']): print(f'  {line.strip()}{ns(pid)}')
          print('--- fatal signals (sender thread-host PID (its process), then the target: comm=, pid=) ---')
          for m, lines in kills:
              print('\n'.join(lines))
              if m['event'] != 'signal_generate' or not m['tgid'].isdigit(): continue
              if any('zap_pid_ns_processes' in line for line in lines):
                  print('  (the container ending: its init exited and the kernel killed what was left)'); continue
              tid, tgid, target, seen = int(m['tid']), int(m['tgid']), int(dict(field.findall(m['rest']))['pid']), set()
              process = next((t['tgid'] for t, _, _ in tasks.get(target, []) if int(t['tid']) == target), '?')
              print(f'  sender: thread {tid}{ns(tid)} of process {tgid}; target: {target}{ns(target)} of process {process}')
              if tid != tgid: show('sender thread', tid, seen, walk=False)
              show('sender process and its parents', tgid, seen)
              show('target and its parents (those not listed above)', target, seen)
          EOF
      - name: Save the Unity Library
        if: success() && inputs.tag == '' && steps.library-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src/Nino.Unity/Library
          key: ${{ steps.library-cache.outputs.cache-primary-key }}

      # The benchmark's results, per Unity version: the player's NUnit results (results.xml), whose test output holds
      # the Performance Testing package's results and run metadata and the player's NINO_UNITY_ENV line, and
      # build.txt: the editor's NINO_UNITY_BUILD line (how the player was built) and this job's NINO_UNITY_CI line.
      # Fails (after the results are uploaded below) when the player measured nothing, so a release whose Unity
      # section is missing shows why.
      - name: Collect the benchmark results
        id: bench
        if: always() && env.BENCHMARK == 'true' && steps.player-tests.conclusion != 'skipped'
        env:
          UNITY_VERSION: ${{ matrix.unity }}
        run: |
          set -euo pipefail
          OUT="bench/unity-bench-$UNITY_VERSION"
          mkdir -p "$OUT"
          cp artifacts/player/standalone-results.xml "$OUT/results.xml" || true
          {
            grep -ho 'NINO_UNITY_BUILD|.*' artifacts/player/standalone.log || true
            echo "NINO_UNITY_CI|nino_core=$NINO_CONFIG|runner=$ImageOS ($ImageVersion)"
          } > "$OUT/build.txt"
          cat "$OUT/build.txt"
          if grep -q '##performancetestresult2:' "$OUT/results.xml" 2>/dev/null; then
            echo "has_rows=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_rows=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the benchmark results
        if: always() && steps.bench.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unity-bench-${{ matrix.unity }}
          path: bench/unity-bench-${{ matrix.unity }}
          retention-days: 30

      - name: Upload Unity results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        # A storage timeout is not a test result.
        continue-on-error: true
        with:
          name: test-results-unity-${{ matrix.unity }}
          path: ./artifacts
          retention-days: 30

      - name: Check the benchmark ran
        if: always() && steps.bench.outputs.has_rows == 'false'
        run: |
          echo "::error::The IL2CPP player's results hold no performance test result (see its log in test-results-unity-${{ matrix.unity }})"
          exit 1

  # Nino.WebGL's WebAssembly SIMD kernels (Packages/com.jasonxudeveloper.nino/WebGL) in a WebGL player run in headless
  # Chrome: the kernels against Nino.Core's scalar references, and every case's bytes with and without them; the
  # benchmark's run also times each case both ways (artifact webgl-<version>). Unity 6 builds with WebAssembly 2023
  # (SIMD on); 2022.3, which has no such setting, with -msimd128 passed to the compiler, as a project that opts in would.
  webgl:
    name: WebGL (${{ matrix.unity }})
    needs: unity-tests
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      # The player as it ships.
      NINO_CONFIG: Release
    strategy:
      fail-fast: false
      # One version after the other, as unity-tests: the build activates the license.
      max-parallel: 1
      matrix:
        include:
          - unity: '2022.3.62f2'
            il2cpp_args: '--compiler-flags=-msimd128'
          - unity: '6000.6.9f1'
            il2cpp_args: ''
    steps:
      - *check-tag

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || '' }}
          persist-credentials: false

      - *setup-dotnet

      - *build-dlls

      - name: Set the IL2CPP arguments
        if: matrix.il2cpp_args != ''
        env:
          ARGS: ${{ matrix.il2cpp_args }}
        run: |
          sed -i "s|^  additionalIl2CppArgs:.*|  additionalIl2CppArgs: $ARGS|" src/Nino.Unity/ProjectSettings/ProjectSettings.asset
          grep -q "additionalIl2CppArgs: $ARGS" src/Nino.Unity/ProjectSettings/ProjectSettings.asset

      # Each Unity launch bounded, as in unity-tests (ENGINE_LAUNCH_WRAPPER there).
      - name: Build the WebGL player
        uses: game-ci/unity-builder@eb1b9fba120c6e62c9fb7a7a81d6c107ce004c45 # v6.0.0
        timeout-minutes: 40
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          ENGINE_LAUNCH_WRAPPER: timeout -k 60 25m
        with:
          projectPath: ./src/Nino.Unity
          targetPlatform: WebGL
          unityVersion: ${{ matrix.unity }}
          customImage: unityci/editor:ubuntu-${{ matrix.unity }}-webgl-3
          buildMethod: Test.Editor.WebGL.WebGLBenchBuild.Build
          customParameters: ${{ env.BENCHMARK == 'true' && '-ninoTiming' || '' }}
          versioning: None
          allowDirtyBuild: true
          # unity-builder 6 runs the game-ci CLI, as unity-test-runner does: the same fixed release, since "latest"
          # asks the GitHub API for it on every run.
          cliVersion: 'v0.1.72'

      - name: Run the player in headless Chrome
        timeout-minutes: 10
        run: |
          sudo chmod -R a+rX src/Nino.Unity/Build
          (cd src/Nino.Unity/Build/WebGL && python3 -m http.server 8123 > "$RUNNER_TEMP/http.log" 2>&1 &)
          mkdir -p "$RUNNER_TEMP/pw"
          (cd "$RUNNER_TEMP/pw" && npm init -y > /dev/null && npm install --no-audit --no-fund playwright-core@1.55.0 > /dev/null)
          cp .github/scripts/webgl_run.mjs "$RUNNER_TEMP/pw/"
          node "$RUNNER_TEMP/pw/webgl_run.mjs" http://localhost:8123/index.html 2400 | tee webgl.txt
          # Both builds have SIMD: the kernels must be registered.
          grep -q 'simd=True|registered=True' webgl.txt

      - name: Upload the WebGL results
        if: always() && env.BENCHMARK == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: webgl-${{ matrix.unity }}
          path: webgl.txt
          retention-days: 30
