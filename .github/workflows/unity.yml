name: Unity

# The Unity tests, apart from ci.yml: they activate the Unity license, which has few seats. A seat is taken when a job
# activates and given back when its tests end; a job cancelled in between never gives it back (it stays taken until
# it is returned on id.unity.com). So this workflow never cancels a running job (a newer run waits in the queue, and
# GitHub replaces a waiting run with a newer one before it starts), runs one Unity version at a time, and runs only
# when what Unity loads changes. CI therefore takes at most one seat at any moment, whatever is pushed.

on:
  push:
    branches: [ "main" ]
    paths: &paths
      - 'src/Nino.Core/**'
      - 'src/Nino.Generator/**'
      - 'src/Nino.Generator.CodeFixes/**'
      - 'src/Nino.UnityTypes/**'
      - 'src/Nino.Unity/**'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'nuget.config'
      - '.github/workflows/unity.yml'
  pull_request:
    branches: [ "main" ]
    paths: *paths
  workflow_dispatch:

# One group for every ref: one Unity run at a time in the repository, never cancelled while it runs.
concurrency:
  group: unity-license
  cancel-in-progress: false

permissions:
  contents: read
  # unity-test-runner posts its results as a check run, even without githubToken.
  checks: write

# Bash with -e and -o pipefail for every run step: a command piped into tee, grep or sed fails its step when it fails.
defaults:
  run:
    shell: bash

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  unity-tests:
    name: Unity tests (${{ matrix.unity }})
    runs-on: ubuntu-26.04
    # The editor's tests, then an IL2CPP player build (the test player, the Burst AOT library) and its tests.
    timeout-minutes: 100
    strategy:
      fail-fast: false
      # One version after the other: each run activates the license, holds a seat until its tests end and returns it.
      max-parallel: 1
      matrix:
        # The oldest Unity the package supports (package.json: 2022.3) at its newest patch outside Extended LTS (later
        # 2022.3 builds need an Industry or Enterprise license), the project's own version, and the newest Unity 6 LTS.
        unity: [ '2022.3.62f2', '6000.3.27f1' ]
    # Pull requests from forks and from Dependabot get no repository secrets, so they cannot activate the license.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login != 'dependabot[bot]')

    env:
      # The image with the Linux IL2CPP module, which the player step below needs: one image for both steps.
      UNITY_IMAGE: unityci/editor:ubuntu-${{ matrix.unity }}-linux-il2cpp-3

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The editor's image is some 5.5 GB, and pulling it took over a minute and a half of the editor's test step.
      # Pulled in the background instead, while .NET is set up, the DLLs built and the Library restored; the test
      # step waits for it (and pulls it itself if this pull failed). The license is activated in the test step only.
      - name: Pull the Unity image (in the background)
        run: |
          # shellcheck disable=SC2016  # expanded by the inner bash
          nohup bash -c 'docker pull -q "$UNITY_IMAGE" > "$RUNNER_TEMP/pull.log" 2>&1; echo $? > "$RUNNER_TEMP/pull.status"' \
            > /dev/null 2>&1 &

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            ${{ vars.DOTNET_VERSION || '10.0.x' }}
            10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-unity-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ runner.arch }}-unity-
            nuget-${{ runner.os }}-${{ runner.arch }}-

      - name: Build the DLLs Unity loads
        run: |
          dotnet build src/Nino.Core/Nino.Core.csproj -c Debug -f netstandard2.1
          dotnet build src/Nino.Generator/Nino.Generator.csproj -c Debug
          dotnet build src/Nino.Generator.CodeFixes/Nino.Generator.CodeFixes.csproj -c Debug
          dotnet build src/Nino.UnityTypes/Nino.UnityTypes.csproj -c Debug
          cp ./src/Nino.Core/bin/Debug/netstandard2.1/Nino.Core.dll ./src/Nino.Unity/Packages/com.jasonxudeveloper.nino/Runtime/Nino.Core.dll
          # The Roslyn 4.3 build: Unity's compiler cannot load the 4.12 one.
          cp ./src/Nino.Generator/bin/Debug/netstandard2.0/Nino.Generator.dll ./src/Nino.Unity/Packages/com.jasonxudeveloper.nino/Runtime/Nino.Generator.dll
          # Code fixes, for Rider and Visual Studio: Unity lists RoslynAnalyzer DLLs in the projects it generates.
          cp ./src/Nino.Generator.CodeFixes/bin/Debug/netstandard2.0/Nino.Generator.CodeFixes.dll ./src/Nino.Unity/Packages/com.jasonxudeveloper.nino/Runtime/Nino.Generator.CodeFixes.dll
          cp ./src/Nino.UnityTypes/bin/Debug/netstandard2.1/Nino.UnityTypes.dll ./src/Nino.Unity/Packages/com.jasonxudeveloper.nino/Runtime/Nino.UnityTypes.dll

      # Keyed by the project's sources, not by the DLLs the step above built into Packages: those differ in every
      # commit, so every run missed the key and saved another 800 MB per version, which pushed the other caches out
      # of the repository's 10 GB. Unity reimports what changed since the cached Library.
      - name: Cache Unity Library
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src/Nino.Unity/Library
          key: Library-Nino-${{ runner.os }}-${{ matrix.unity }}-${{ hashFiles('src/Nino.Unity/Assets/**', 'src/Nino.Unity/ProjectSettings/**', 'src/Nino.Unity/Packages/**', '!src/Nino.Unity/Packages/**/*.dll') }}
          restore-keys: |
            Library-Nino-${{ runner.os }}-${{ matrix.unity }}-

      - name: Wait for the Unity image
        timeout-minutes: 15
        # A stuck pull is not a test result: the test step pulls the image itself.
        continue-on-error: true
        run: |
          until [[ -f $RUNNER_TEMP/pull.status ]]; do sleep 2; done
          cat "$RUNNER_TEMP/pull.log"
          if [[ $(cat "$RUNNER_TEMP/pull.status") != 0 ]]; then
            echo "::warning::pulling $UNITY_IMAGE failed; the test step pulls it again"
          fi

      # Edit mode and play mode tests in the editor (Mono, Burst's JIT).
      - name: Run the editor's tests
        uses: game-ci/unity-test-runner@32e57712352b500e17974b245a6dce9e11a73213 # v4.4.0
        id: editor-tests
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: ./src/Nino.Unity
          testMode: all
          artifactsPath: artifacts/editor
          customImage: ${{ env.UNITY_IMAGE }}
          # No githubToken: posting the results as a check run calls the GitHub API, and a timeout there failed a run
          # whose tests had all passed. The results are uploaded below, and a failed test still fails this step.
          unityVersion: ${{ matrix.unity }}
          # A fixed release: "latest" asks the GitHub API for it on every run, and a 403 from its rate limit failed the job.
          cliVersion: 'v0.1.72'

      # The play mode tests in a Linux player built with IL2CPP (ProjectSettings: Standalone scripting backend 1) and
      # Burst AOT, where the paths through the runtime's own collections and the Burst function pointers run as they do
      # on devices. It runs after a failure of the editor's tests too, so one run shows both; the steps run one after
      # the other, so the job still holds one seat at a time.
      - name: Run the IL2CPP player's tests
        if: success() || steps.editor-tests.conclusion == 'failure'
        uses: game-ci/unity-test-runner@32e57712352b500e17974b245a6dce9e11a73213 # v4.4.0
        id: player-tests
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: ./src/Nino.Unity
          testMode: standalone
          artifactsPath: artifacts/player
          customImage: ${{ env.UNITY_IMAGE }}
          unityVersion: ${{ matrix.unity }}
          # A fixed release: "latest" asks the GitHub API for it on every run, and a 403 from its rate limit failed the job.
          cliVersion: 'v0.1.72'

      - name: Upload Unity results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        # A storage timeout is not a test result.
        continue-on-error: true
        with:
          name: test-results-unity-${{ matrix.unity }}
          path: |
            ./artifacts
            ${{ steps.editor-tests.outputs.coveragePath }}
          retention-days: 30

