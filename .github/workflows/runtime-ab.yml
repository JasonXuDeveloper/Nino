name: Runtime A/B (test branch)

# Development only, on the test branch: never merge this file into main. A push that changes .github/ab-request.txt
# measures, on the x64 and Arm64 runners, each line's two commits one after the other on the same runner:
#
#   <go|go:<dir>|go#<rounds>|rust|typescript> <base sha> <head sha> [filter]
#
# Each line is a job of its own on every runner and copy, and a push runs only the lines it adds or changes: a line
# already in the file before the push is not measured again (edit it, for example its filter, to run it again). A push
# that changes this workflow measures every line, unless its last commit message says "[ab: new lines only]".
# Both commits must be on a branch of this repository (main, or this branch: push them here, merging, never
# force-pushing).
# The filter is a `go test -bench` regexp, a criterion filter or a bench.ts case name. Numbers are for development only.
on:
  push:
    branches: [claude/zen-goldberg-5qqqcu]
    paths: [.github/ab-request.txt, .github/workflows/runtime-ab.yml]

permissions:
  contents: read

concurrency:
  group: runtime-ab-${{ github.sha }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      lines: ${{ steps.lines.outputs.lines }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The request lines this push adds or changes (all of them when the previous commit is unknown or the push changes
      # this workflow), as JSON.
      - name: New lines
        id: lines
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          active() { grep -v -e '^[[:space:]]*#' -e '^[[:space:]]*$' | sed 's/[[:space:]]*$//' || true; }
          active < .github/ab-request.txt > "$RUNNER_TEMP/now"
          # A push whose last commit message says "[ab: new lines only]" measures only its new lines even when it
          # changes this workflow (a change that leaves the other lines' measurements as they were).
          if git cat-file -e "$BEFORE:.github/ab-request.txt" 2> /dev/null &&
            { git diff --quiet "$BEFORE" HEAD -- .github/workflows/runtime-ab.yml ||
              git log -1 --format=%B HEAD | grep -qF '[ab: new lines only]'; }; then
            git show "$BEFORE:.github/ab-request.txt" | active > "$RUNNER_TEMP/before"
          else
            : > "$RUNNER_TEMP/before"
          fi
          lines=$(grep -vxF -f "$RUNNER_TEMP/before" "$RUNNER_TEMP/now" | jq -Rnc '[inputs]' || true)
          [[ -n $lines ]] || lines='[]'
          echo "lines=$lines" >> "$GITHUB_OUTPUT"
          echo "$lines" | jq -r '.[]' | sed 's/^/measuring: /'

  ab:
    needs: plan
    if: needs.plan.outputs.lines != '[]'
    name: A/B ${{ matrix.line }} on ${{ matrix.runner }} (${{ matrix.copy }})
    strategy:
      fail-fast: false
      matrix:
        line: ${{ fromJSON(needs.plan.outputs.lines) }}
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
        # Several jobs a runner: the x64 runners draw different processors (EPYC 7763, 9V74, 9V45).
        copy: [1, 2, 3, 4, 5]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Machine
        run: |
          lscpu | grep -E 'Model name|Flags' | sed 's/^Flags:/Flags:/' | cut -c1-2000
          echo "### ${{ matrix.runner }}: $(lscpu | grep 'Model name' | sed 's/.*: *//')" >> "$GITHUB_STEP_SUMMARY"
      - name: Measure
        env:
          RUNNER: ${{ matrix.runner }}
          LINE: ${{ matrix.line }}
        run: |
          set -euo pipefail
          go install golang.org/x/perf/cmd/benchstat@v0.0.0-20261009192801-be2c69fb417e
          rustup toolchain install stable --profile minimal >/dev/null
          out="$RUNNER_TEMP/out"
          mkdir -p "$out"
          while read -r -u 3 lang base head filter envs; do
            [[ -z ${lang:-} || $lang == \#* ]] && continue
            for ref in "$base" "$head"; do
              git cat-file -e "$ref^{commit}"
              [[ -d "$RUNNER_TEMP/$ref" ]] || git worktree add -q --detach "$RUNNER_TEMP/$ref" "$ref"
            done
            fargs=()
            [[ -n ${filter:-} ]] && fargs=("$filter")
            echo "## $lang ${base:0:7} -> ${head:0:7} ${filter:-} ${envs:-}" | tee -a "$GITHUB_STEP_SUMMARY"
            # rust:<bench> picks the criterion bench (default compare); `envs` is "<base env> <head env>", each
            # NAME=VALUE or -, set for that side only.
            bench=compare
            if [[ $lang == rust:* ]]; then bench=${lang#rust:}; lang=rust; fi
            # go:<dir> runs the benchmarks of runtimes/go/<dir> (default bench; go:. the runtime's own, such as
            # BenchmarkStringTiers, which times every string kernel tier the runner has).
            # go#<n> (or go:<dir>#<n>) runs n rounds of each side instead of 6.
            rounds=6
            if [[ $lang == go*'#'* ]]; then rounds=${lang##*#}; lang=${lang%#*}; fi
            godir=bench
            if [[ $lang == go:* ]]; then godir=${lang#go:}; lang=go; fi
            read -r base_env head_env <<< "${envs:-- -}"
            [[ $base_env == - ]] && base_env=NINO_AB_NONE=1
            [[ ${head_env:--} == - ]] && head_env=NINO_AB_NONE=1
            case $lang in
              go)
                : > "$out/base.txt"; : > "$out/head.txt"
                for _ in $(seq "$rounds"); do
                  for side in base head; do
                    ref=$base; [[ $side == head ]] && ref=$head
                    (cd "$RUNNER_TEMP/$ref/runtimes/go/$godir" &&
                      go test -run '^$' -bench "${filter:-.}" -benchmem -count 1) >> "$out/$side.txt"
                  done
                done
                "$(go env GOPATH)/bin/benchstat" base="$out/base.txt" head="$out/head.txt" | tee "$out/go.txt"
                { echo '```'; cat "$out/go.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
                ;;
              rust)
                # A target directory per commit: with one shared, cargo took the head's sources (checked out before
                # the base was built) as unchanged and ran the base's binary for both sides. Criterion's baselines
                # go in one directory of their own.
                # Both sides start every function at a 64-byte boundary (bench build only): unchanged functions then
                # sit at the same offset modulo 64 on both sides, so a change elsewhere in the binary cannot move
                # their loops across fetch blocks (16-byte shifts of identical code moved Zen 5 timings by up to 30%).
                # A side's env NINO_AB_RUSTFLAGS=<flags> replaces the flags (NINO_AB_RUSTFLAGS= builds as before).
                align=-Cllvm-args=-align-all-functions=6
                export CRITERION_HOME="$RUNNER_TEMP/criterion"
                rm -rf "$CRITERION_HOME"
                for round in 1 2; do
                  (cd "$RUNNER_TEMP/$base/runtimes/rust" && export "$base_env" CARGO_TARGET_DIR="$RUNNER_TEMP/target-$base" &&
                    export RUSTFLAGS="${NINO_AB_RUSTFLAGS-$align}" &&
                    cargo bench -q -p nino-bench --bench "$bench" -- --save-baseline base "${fargs[@]}" < /dev/null) > /dev/null
                  (cd "$RUNNER_TEMP/$head/runtimes/rust" && export "$head_env" CARGO_TARGET_DIR="$RUNNER_TEMP/target-$head" &&
                    export RUSTFLAGS="${NINO_AB_RUSTFLAGS-$align}" &&
                    cargo bench -q -p nino-bench --bench "$bench" -- --baseline base "${fargs[@]}" < /dev/null) | tee "$out/rust-$round.txt"
                done
                { echo '```'; grep -E '^[a-z].*|time:|change:|faster|slower|No change' "$out/rust-2.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
                ;;
              typescript)
                # bench.ts is a library: node.ts (Node) and browser.mjs (Chromium) run it, on data and generated code
                # that .NET writes (as bench/run.sh does). Both sides run the head's bench.ts; each takes the code its
                # own nino-gen generates (so a change to the templates is measured too) with its own src/nino.ts, and
                # reads the data its own .NET writes (the same bytes unless the two differ in the wire format).
                B="$RUNNER_TEMP/$head/runtimes/typescript/bench"
                (cd "$B" && npm ci --no-audit --no-fund > /dev/null)
                if [[ ! -x "$(npm root -g)/playwright/cli.js" ]]; then
                  npm install -g playwright@1.56.1 > /dev/null
                  # Playwright 1.56 does not know Ubuntu 26.04: install the 24.04 dependencies, else none.
                  arch=x64; [[ $(uname -m) == aarch64 ]] && arch=arm64
                  PLAYWRIGHT_HOST_PLATFORM_OVERRIDE=ubuntu24.04-$arch npx -y playwright@1.56.1 install --with-deps chromium > /dev/null ||
                    PLAYWRIGHT_HOST_PLATFORM_OVERRIDE=ubuntu24.04-$arch npx -y playwright@1.56.1 install chromium > /dev/null
                fi
                dotnet build -c Release "$B" > /dev/null
                dotnet "$B/bin/Release/net10.0/Bench.dll" "$out/data"
                BB="$RUNNER_TEMP/$base/runtimes/typescript/bench"
                dotnet build -c Release "$BB" > /dev/null
                dotnet "$BB/bin/Release/net10.0/Bench.dll" "$out/data-base"
                for side in base head; do
                  ref=$base; [[ $side == head ]] && ref=$head
                  dotnet build -c Release "$RUNNER_TEMP/$ref/src/Nino.Codegen" > /dev/null
                  rm -rf "$B/gen"
                  dotnet "$RUNNER_TEMP/$ref/src/Nino.Codegen/bin/Release/net8.0/nino-gen.dll" \
                    --assembly "$RUNNER_TEMP/$ref/runtimes/typescript/bench/bin/Release/net10.0/Bench.dll" --lang ts \
                    --out "$B/gen" --import-extension .ts > /dev/null
                  cp "$RUNNER_TEMP/$ref/runtimes/typescript/src/nino.ts" "$B/gen/nino.ts"
                  mkdir -p "$out/$side"
                  (cd "$B" && npx esbuild bench.ts --bundle --format=esm --platform=browser --log-level=warning \
                    --outfile="$out/$side/bench.js" &&
                    npx esbuild node.ts --bundle --format=esm --platform=node --log-level=warning \
                    --external:tinybench --outfile="$B/node-$side.mjs")
                done
                export NODE_PATH="$(npm root -g)"
                : > "$out/ts.txt"
                for round in 1 2 3; do
                  for side in base head; do
                    echo "--- $side round $round" | tee -a "$out/ts.txt"
                    data="$out/data"; [[ $side == base ]] && data="$out/data-base"
                    (cd "$B" && node "node-$side.mjs" "$data" "${filter:-}" | sed 's/^/node /'
                      node browser.mjs "$out/$side" "$data" "${filter:-}" | sed 's/^/chromium /') |
                      tee -a "$out/ts.txt"
                  done
                done
                { echo '```'; cat "$out/ts.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
                ;;
              *) echo "unknown language $lang"; exit 1 ;;
            esac
          done 3<<< "$LINE"
