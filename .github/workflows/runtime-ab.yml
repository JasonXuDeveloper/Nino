name: Runtime A/B (test branch)

# Development only, on the test branch: never merge this file into main. A push that changes .github/ab-request.txt
# measures, on the x64 and Arm64 runners, each line's two commits one after the other on the same runner:
#
#   <go|go:<dir>|go#<rounds>|rust|typescript|generator|generator#<rounds>> <base sha> <head sha> [filter]
#
# generator times the analyzer and the source generator (benchmarks/Nino.GeneratorBenchmark of the head, in .NET):
# the filter is its arguments joined by commas (30,8,--layouts), each round one process per side loading that
# side's Nino.Generator (--generator), base and head alternated; each process prints the median of its runs: the
# generator, the analyzers' own time and the wall time of the analysis (which also holds binding an analyzer moves).
#
# Each line is a job of its own on every runner and copy, and a push runs only the lines it adds or changes: a line
# already in the file before the push is not measured again (add or change a note after " #" to run it again; never
# change its filter to a regexp that matches nothing). At most 8 new lines are measured per push (80 jobs), and at most
# 10 jobs run at once, so a run never takes the account's whole concurrent-job budget; more lines are cut with a warning. A push that changes this workflow measures every line, unless its last commit
# message says "[ab: new lines only]".
# Both commits must be on a branch of this repository (main, or this branch: push them here, merging, never
# force-pushing).
# The filter is a `go test -bench` regexp, a criterion filter or bench.ts's case names (`Simple*|Players`). Numbers are
# for development only. After the filter, "<base env> <head env>" (NAME=VALUE or -) set a variable for one side (go,
# rust and typescript: NINO_BENCH_QUICK=1, or NINO_BENCH_CASES to time some of the .NET suite's cases).
on:
  push:
    branches: [bench/ab]
    paths: [.github/ab-request.txt, .github/workflows/runtime-ab.yml]

permissions:
  contents: read

concurrency:
  group: runtime-ab-${{ github.sha }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      lines: ${{ steps.lines.outputs.lines }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The request lines this push adds or changes (all of them when the previous commit is unknown or the push changes
      # this workflow), as JSON.
      - name: New lines
        id: lines
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          active() { grep -v -e '^[[:space:]]*#' -e '^[[:space:]]*$' | sed 's/[[:space:]]*$//' || true; }
          active < .github/ab-request.txt > "$RUNNER_TEMP/now"
          # A push whose last commit message says "[ab: new lines only]" measures only its new lines even when it
          # changes this workflow (a change that leaves the other lines' measurements as they were).
          if git cat-file -e "$BEFORE:.github/ab-request.txt" 2> /dev/null &&
            { git diff --quiet "$BEFORE" HEAD -- .github/workflows/runtime-ab.yml ||
              git log -1 --format=%B HEAD | grep -qF '[ab: new lines only]'; }; then
            git show "$BEFORE:.github/ab-request.txt" | active > "$RUNNER_TEMP/before"
          else
            : > "$RUNNER_TEMP/before"
          fi
          grep -vxF -f "$RUNNER_TEMP/before" "$RUNNER_TEMP/now" > "$RUNNER_TEMP/new" || true
          # Each line takes 10 jobs (two runners, five copies): measure the first 8 and say so, rather than queue more
          # jobs than the account's concurrency budget allows. The rest are already in the file: edit them (a note) to run them.
          if (( $(wc -l < "$RUNNER_TEMP/new") > 8 )); then
            echo "::warning::$(wc -l < "$RUNNER_TEMP/new") new lines: measuring the first 8 only (push the rest in later pushes)"
            sed -i '9,$d' "$RUNNER_TEMP/new"
          fi
          # A note after " #" on a line ("... records-1000 # rerun 2") makes an unchanged line new again; it is not
          # part of the request.
          lines=$(sed 's/[[:space:]][[:space:]]*#.*$//' "$RUNNER_TEMP/new" | jq -Rnc '[inputs]')
          [[ -n $lines ]] || lines='[]'
          echo "lines=$lines" >> "$GITHUB_OUTPUT"
          echo "$lines" | jq -r '.[]' | sed 's/^/measuring: /'

  ab:
    needs: plan
    if: needs.plan.outputs.lines != '[]'
    name: A/B ${{ matrix.line }} on ${{ matrix.runner }} (${{ matrix.copy }})
    strategy:
      fail-fast: false
      # The account runs a limited number of jobs at once: leave room for main's CI and the other A/B workflow.
      max-parallel: 10
      matrix:
        line: ${{ fromJSON(needs.plan.outputs.lines) }}
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
        # Several jobs a runner: the x64 runners draw different processors (EPYC 7763, 9V74, 9V45).
        copy: [1, 2, 3, 4, 5]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            11.0.x
            10.0.x
      - name: Machine
        run: |
          lscpu | grep -E 'Model name|Flags' | sed 's/^Flags:/Flags:/' | cut -c1-2000
          echo "### ${{ matrix.runner }}: $(lscpu | grep 'Model name' | sed 's/.*: *//')" >> "$GITHUB_STEP_SUMMARY"
      - name: Measure
        env:
          RUNNER: ${{ matrix.runner }}
          LINE: ${{ matrix.line }}
        run: |
          set -euo pipefail
          go install golang.org/x/perf/cmd/benchstat@v0.0.0-20261009192801-be2c69fb417e
          rustup toolchain install stable --profile minimal >/dev/null
          out="$RUNNER_TEMP/out"
          mkdir -p "$out"
          # Where a commit keeps a thing (runtimes, nino-gen, the generator, its benchmark): this branch's
          # .github/scripts/layout.py on that commit's tree, never a typed path, so a line whose base and head lie on
          # either side of a move (the .NET projects into runtimes/csharp, #273) builds each side from its own place.
          LAYOUT=$GITHUB_WORKSPACE/.github/scripts/layout.py
          tree_path() { python3 "$LAYOUT" "$RUNNER_TEMP/$1" --get "$2"; }
          while read -r -u 3 lang base head filter envs; do
            [[ -z ${lang:-} || $lang == \#* ]] && continue
            for ref in "$base" "$head"; do
              git cat-file -e "$ref^{commit}"
              [[ -d "$RUNNER_TEMP/$ref" ]] || git worktree add -q --detach "$RUNNER_TEMP/$ref" "$ref"
            done
            fargs=()
            [[ -n ${filter:-} ]] && fargs=("$filter")
            echo "## $lang ${base:0:7} -> ${head:0:7} ${filter:-} ${envs:-}" | tee -a "$GITHUB_STEP_SUMMARY"
            # rust:<bench> picks the criterion bench (default compare); `envs` is "<base env> <head env>", each
            # NAME=VALUE or -, set for that side only.
            bench=compare
            if [[ $lang == rust:* ]]; then bench=${lang#rust:}; lang=rust; fi
            # go:<dir> runs the benchmarks of runtimes/go/<dir> (default bench; go:. the runtime's own, such as
            # BenchmarkStringTiers, which times every string kernel tier the runner has).
            # go#<n> (or go:<dir>#<n>) runs n rounds of each side instead of 6.
            rounds=6
            if [[ $lang == go*'#'* || $lang == generator'#'* ]]; then rounds=${lang##*#}; lang=${lang%#*}; fi
            godir=bench
            if [[ $lang == go:* ]]; then godir=${lang#go:}; lang=go; fi
            read -r base_env head_env <<< "${envs:-- -}"
            [[ $base_env == - ]] && base_env=NINO_AB_NONE=1
            [[ ${head_env:--} == - ]] && head_env=NINO_AB_NONE=1
            case $lang in
              go)
                go_base=$(tree_path "$base" GO_RUNTIME)
                go_head=$(tree_path "$head" GO_RUNTIME)
                # Since #337 the Go benchmark runs the .NET suite's cases: each side's data from its own
                # Nino.Benchmark (bench/generate.sh --data), written once per commit.
                for side in base head; do
                  ref=$base go_dir=$go_base; [[ $side == head ]] && ref=$head go_dir=$go_head
                  gen="$RUNNER_TEMP/$ref/$go_dir/bench/generate.sh"
                  if [[ $godir == bench && -x $gen && ! -d "$RUNNER_TEMP/$ref/$go_dir/bench/data" ]]; then
                    "$gen" --data > /dev/null
                  fi
                done
                : > "$out/base.txt"; : > "$out/head.txt"
                for _ in $(seq "$rounds"); do
                  for side in base head; do
                    ref=$base go_dir=$go_base side_env=$base_env
                    [[ $side == head ]] && ref=$head go_dir=$go_head side_env=$head_env
                    (cd "$RUNNER_TEMP/$ref/$go_dir/$godir" &&
                      /usr/bin/env "$side_env" go test -run '^$' -bench "${filter:-.}" -benchmem -count 1) >> "$out/$side.txt"
                  done
                done
                "$(go env GOPATH)/bin/benchstat" base="$out/base.txt" head="$out/head.txt" | tee "$out/go.txt"
                { echo '```'; cat "$out/go.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
                ;;
              rust)
                # A target directory per commit: with one shared, cargo took the head's sources (checked out before
                # the base was built) as unchanged and ran the base's binary for both sides. Criterion's baselines
                # go in one directory of their own.
                # Both sides start every function at a 64-byte boundary (bench build only): unchanged functions then
                # sit at the same offset modulo 64 on both sides, so a change elsewhere in the binary cannot move
                # their loops across fetch blocks (16-byte shifts of identical code moved Zen 5 timings by up to 30%).
                # A side's env NINO_AB_RUSTFLAGS=<flags> replaces the flags (NINO_AB_RUSTFLAGS= builds as before).
                align=-Cllvm-args=-align-all-functions=6
                rust_base=$(tree_path "$base" RUST_RUNTIME)
                rust_head=$(tree_path "$head" RUST_RUNTIME)
                export CRITERION_HOME="$RUNNER_TEMP/criterion"
                rm -rf "$CRITERION_HOME"
                # Since #338 the Rust benchmark runs the .NET suite's cases: each side's data from its own
                # Nino.Benchmark (bench/generate.sh --data), written once per commit, as for Go.
                for side in base head; do
                  ref=$base rust_dir=$rust_base; [[ $side == head ]] && ref=$head rust_dir=$rust_head
                  gen="$RUNNER_TEMP/$ref/$rust_dir/bench/generate.sh"
                  if [[ -x $gen && ! -d "$RUNNER_TEMP/$ref/$rust_dir/bench/data" ]]; then
                    (cd "$RUNNER_TEMP/$ref/$rust_dir" && bench/generate.sh --data > /dev/null)
                  fi
                done
                for round in 1 2; do
                  (cd "$RUNNER_TEMP/$base/$rust_base" && export "$base_env" CARGO_TARGET_DIR="$RUNNER_TEMP/target-$base" &&
                    export RUSTFLAGS="${NINO_AB_RUSTFLAGS-$align}" &&
                    cargo bench -q -p nino-bench --bench "$bench" -- --save-baseline base "${fargs[@]}" < /dev/null) > /dev/null
                  (cd "$RUNNER_TEMP/$head/$rust_head" && export "$head_env" CARGO_TARGET_DIR="$RUNNER_TEMP/target-$head" &&
                    export RUSTFLAGS="${NINO_AB_RUSTFLAGS-$align}" &&
                    cargo bench -q -p nino-bench --bench "$bench" -- --baseline base "${fargs[@]}" < /dev/null) | tee "$out/rust-$round.txt"
                done
                { echo '```'; grep -E '^[a-z].*|time:|change:|faster|slower|No change' "$out/rust-2.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
                ;;
              typescript)
                # Since #374 the bench runs the .NET suite's cases from its own commit: each side runs its own
                # bench (generate.sh: the data its .NET writes, the code its nino-gen generates with its own
                # src/nino.ts, its protobuf messages), so a change to the runtime, the templates or the bench is
                # measured. Both commits need it (185220ad or later).
                # Node only, as report.yml's TypeScript section: installing Playwright 1.56's Chromium dependencies hung
                # on Ubuntu 26.04 until the job's 120 minutes ran out (run 44220042959, every job).
                for side in base head; do
                  ref=$base; [[ $side == head ]] && ref=$head
                  S=$RUNNER_TEMP/$ref/$(tree_path "$ref" TYPESCRIPT_BENCH)
                  if [[ ! -x $S/generate.sh ]]; then
                    echo "::error::$ref has no TypeScript bench/generate.sh: both commits need the .NET suite's cases (#374)"
                    exit 1
                  fi
                  mkdir -p "$out/$side"
                  (cd "$S" && npm ci --no-audit --no-fund > /dev/null && ./generate.sh > /dev/null)
                done
                export NODE_PATH="$(npm root -g)"
                : > "$out/ts.txt"
                for round in 1 2 3; do
                  for side in base head; do
                    ref=$base side_env=$base_env
                    [[ $side == head ]] && ref=$head side_env=$head_env
                    S=$RUNNER_TEMP/$ref/$(tree_path "$ref" TYPESCRIPT_BENCH)
                    echo "--- $side round $round" | tee -a "$out/ts.txt"
                    (cd "$S" && /usr/bin/env "$side_env" node --no-warnings node.ts out/data "${filter:-}" 2> /dev/null |
                        sed 's/^/node /') |
                      tee -a "$out/ts.txt"
                  done
                done
                { echo '```'; cat "$out/ts.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
                ;;
              generator)
                # The head's benchmark against each side's generator, in one process per side and round; the head's
                # Nino.Core for both (the generator finds Nino.Core's attributes by name). net8.0 on .NET 10.
                G=$RUNNER_TEMP/$head/$(tree_path "$head" GENERATOR_BENCH)
                gen_base=$RUNNER_TEMP/$base/$(tree_path "$base" GENERATOR)
                gen_head=$RUNNER_TEMP/$head/$(tree_path "$head" GENERATOR)
                dotnet build -c Release "$G" -v q -nologo < /dev/null > /dev/null
                for gen in "$gen_base" "$gen_head"; do
                  dotnet build -c Release "$gen" -v q -nologo < /dev/null > /dev/null
                done
                IFS=, read -ra gargs <<< "${filter:-}"
                : > "$out/gen.txt"
                for round in $(seq "$rounds"); do
                  for side in base head; do
                    gen=$gen_base; [[ $side == head ]] && gen=$gen_head
                    DOTNET_ROLL_FORWARD=Major dotnet "$G/bin/Release/net8.0/Nino.GeneratorBenchmark.dll" "${gargs[@]}" --runs 15 \
                      --generator "$gen/bin/Release/netstandard2.0/Nino.Generator.dll" < /dev/null |
                      sed -n "s/^median of runs [0-9-]*: /$side round $round: /p" | tee -a "$out/gen.txt"
                  done
                done
                # The median of the processes' medians per side, and head against base.
                med() { sort -g | awk '{ a[NR] = $1 } END { print (NR % 2 ? a[(NR + 1) / 2] : (a[NR / 2] + a[NR / 2 + 1]) / 2) }'; }
                for what in generate analyzers wall; do
                  b=$(sed -n "s/^base .* $what \([0-9.]*\) ms.*/\1/p" "$out/gen.txt" | med)
                  h=$(sed -n "s/^head .* $what \([0-9.]*\) ms.*/\1/p" "$out/gen.txt" | med)
                  awk -v w="$what" -v b="$b" -v h="$h" -v n="$rounds" \
                    'BEGIN { printf "%s: base %.2f ms, head %.2f ms, head/base %.3f (n=%d)\n", w, b, h, h / b, n }' | tee -a "$out/gen.txt"
                done
                { echo '```'; cat "$out/gen.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
                ;;
              *) echo "unknown language $lang"; exit 1 ;;
            esac
          done 3<<< "$LINE"
