name: Fuzz

# Fuzzes the deserializer (tests/Nino.Fuzz, README.md there): the mutational fuzzer with guard pages and invariant
# checks on every SIMD path, the hand-made probes, and coverage-guided libFuzzer runs of the SharpFuzz targets.
# Pull requests and pushes get about a minute per configuration; the nightly run a longer budget.
on:
  push:
    branches: [ "main" ]
    # What the fuzzer builds: Nino.Core, Nino.Immutable, the generator, and the fuzzer itself.
    paths: &paths
      - 'src/Nino.Core/**'
      - 'src/Nino.Immutable/**'
      - 'src/Nino.Generator/**'
      - 'src/Nino.Generator.Roslyn4.12/**'
      - 'tests/Nino.Fuzz/**'
      - 'tools/UseNinoGenerator.props'
      - '.editorconfig'
      - 'Directory.Build.props'
      - 'src/Directory.Build.targets'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'nuget.config'
      - '.github/workflows/fuzz.yml'
      - '.github/actions/setup-dotnet/**'
      - '.github/actions/apt-install/**'
      - '.github/scripts/changed_paths.py'
      - '!**/AGENTS.md'      # agent instructions only: nothing to build or test
      - '!**/CLAUDE.md'
  pull_request:
    branches: [ "main" ]
    paths: *paths
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      seconds:
        description: 'Seconds of mutational fuzzing per configuration'
        default: '600'
      libfuzzer_seconds:
        description: 'Seconds of libFuzzer per target'
        default: '120'

permissions:
  contents: read

# A newer push or pull request commit supersedes a run; the nightly and manual runs are never cancelled, and never
# cancel the others (each event its own group).
concurrency:
  group: fuzz-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
  # Known open bugs (the probes marked Known in tests/Nino.Fuzz/Probes.cs) fail the run; setting the repository
  # variable NINO_FUZZ_STRICT_KNOWN to 0 reports them without failing it (none is marked Known now).
  NINO_FUZZ_STRICT_KNOWN: ${{ vars.NINO_FUZZ_STRICT_KNOWN || '1' }}
  SECONDS_BUDGET: ${{ github.event_name == 'schedule' && '1800' || inputs.seconds || '60' }}
  LIBFUZZER_SECONDS: ${{ github.event_name == 'schedule' && '240' || inputs.libfuzzer_seconds || '10' }}

# Bash with -e and -o pipefail for every run step: a command piped into tee, grep or sed fails its step when it fails.
defaults:
  run:
    shell: bash

# Only the plan of a push runs on maple, the repository's self-hosted runner (while the repository variable NINO_MAPLE
# is not false; ci.yml, at its jobs, says what keeps a fork off maple). The fuzzers stay on GitHub's runners: maple's
# CPU has no AVX-512 VBMI, so its "SIMD" and "without AVX-512" runs would take the same paths, where GitHub's x64
# runners are Xeons with AVX-512 about half the time; it is one runner process on a shared host with about 8 GB, which
# the nightly runs (two configurations side by side, 30 minutes each) would hold from every other maple job; and
# libFuzzer installs clang with apt, which needs sudo.
jobs:
  # A push to main whose merge commit has the tree its pull request's last run fuzzed (.github/scripts/changed_paths.py,
  # --tested-in-pr) fuzzes nothing again: the nightly run fuzzes main with thirty times the budget. Pull requests,
  # the nightly and manual runs skip this job and fuzz.
  changes:
    name: Plan
    if: github.event_name == 'push'
    runs-on: >-
      ${{ vars.NINO_MAPLE != 'false' && github.actor != 'dependabot[bot]' &&
          fromJSON('["self-hosted", "Linux", "X64", "maple"]') || 'ubuntu-26.04' }}
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # the pull request's runs of this workflow
    outputs:
      fuzz: ${{ steps.diff.outputs.fuzz }}
    steps:
      # maple (one runner process on a shared host, 72 GB of disk): stop at once on a nearly full disk, which would
      # otherwise surface as an odd build error, and keep every cache this job writes in RUNNER_TEMP, which "Free
      # maple's disk" deletes at its end. The toolchains stay installed (the .NET SDKs, rustup's toolchains in
      # RUSTUP_HOME); NuGet's, npm's, Cargo's and Go's caches, dotnet's home and the temporary files do not outlive the
      # job. GitHub's runners skip it.
      - name: Prepare maple
        if: runner.environment == 'self-hosted'
        run: |
          need_gb=10
          free_gb=$(df -Pk "$RUNNER_TEMP" | awk 'NR == 2 { print int($4 / 1048576) }')
          echo "maple: $free_gb GB free under $RUNNER_TEMP"
          if (( free_gb < need_gb )); then
            echo "::error::maple has $free_gb GB free, under the $need_gb GB a job may need: free its disk, then re-run"
            exit 1
          fi
          home="$RUNNER_TEMP/home"
          mkdir -p "$home/tmp"
          {
            echo "NUGET_PACKAGES=$home/nuget/packages"
            echo "NUGET_HTTP_CACHE_PATH=$home/nuget/http-cache"
            echo "NUGET_PLUGINS_CACHE_PATH=$home/nuget/plugins-cache"
            echo "DOTNET_CLI_HOME=$home"
            echo "npm_config_cache=$home/npm"
            echo "CARGO_HOME=$home/cargo"
            echo "GOMODCACHE=$home/go/mod"
            echo "GOCACHE=$home/go/build"
            echo "TMPDIR=$home/tmp"
          } >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare with the pull request's run
        id: diff
        env:
          BASE: ${{ github.event.before }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/changed_paths.py --tested-in-pr fuzz.yml "$BASE" 'fuzz=.' | tee -a "$GITHUB_OUTPUT"

      # maple keeps a job's workspace and RUNNER_TEMP until its next job: give the disk back, whatever happened.
      - name: Free maple's disk
        if: always() && runner.environment == 'self-hosted'
        run: find "$GITHUB_WORKSPACE" "$RUNNER_TEMP" -mindepth 1 -maxdepth 1 -exec rm -rf {} +

  # Each fuzzer runs on one core (a supervisor and one worker process at a time), so an x64 runner (four vCPUs, two
  # cores) fuzzes two SIMD levels side by side, each with the whole budget: half the runners, the same inputs per
  # configuration. Every vector path has a scalar twin; each SIMD level is its own code path to fuzz.
  mutational:
    name: Mutational (${{ matrix.name }})
    needs: changes
    # Also when the plan was skipped (not a push) or failed: then it fuzzes.
    if: ${{ !cancelled() && needs.changes.outputs.fuzz != 'false' }}
    runs-on: ${{ matrix.runner || 'ubuntu-26.04' }}
    timeout-minutes: ${{ github.event_name == 'pull_request' && 30 || 90 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # <name>:<DOTNET_EnableHWIntrinsic>:<DOTNET_EnableAVX512>:<DOTNET_EnableAVX2>, one per process.
          - id: x64-1
            name: SIMD, without SIMD
            configs: SIMD:1:1:1 without-SIMD:0:1:1
          - id: x64-2
            name: without AVX-512, without AVX2
            configs: without-AVX-512:1:0:1 without-AVX2:1:1:0
          - id: arm64
            name: Arm64
            runner: ubuntu-26.04-arm
            configs: Arm64:1:1:1
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet

      - name: Build
        run: dotnet build tests/Nino.Fuzz/Nino.Fuzz.csproj -c Release -f net10.0

      # The fuzzer must find the crashes, hang and exception planted in its SelfTest target, or it would report
      # nothing on a platform where its supervisor or guard pages do not work. Then each configuration fuzzes;
      # its output is printed when all have ended.
      - name: Self test and fuzz
        env:
          CONFIGS: ${{ matrix.configs }}
          FINDINGS: ${{ runner.temp }}/findings
          SEED: ${{ github.run_number }}
        run: |
          set -uo pipefail
          fuzz() {
            local name=$1
            DOTNET_EnableHWIntrinsic=$2 DOTNET_EnableAVX512=$3 DOTNET_EnableAVX2=$4 bash -c '
              set -eo pipefail
              dll=tests/Nino.Fuzz/bin/Release/net10.0/Nino.Fuzz.dll
              dotnet "$dll" selftest
              dotnet "$dll" fuzz --seconds "$SECONDS_BUDGET" --seed "$SEED" --findings "$FINDINGS/$1"' _ "$name"
          }
          declare -A pid
          for config in $CONFIGS; do
            IFS=: read -r name simd avx512 avx2 <<< "$config"
            fuzz "$name" "$simd" "$avx512" "$avx2" > "$RUNNER_TEMP/$name.txt" 2>&1 & pid[$name]=$!
          done
          status=0
          for config in $CONFIGS; do
            name=${config%%:*}
            if ! wait "${pid[$name]}"; then status=1; echo "::error::$name failed (its output below)"; fi
          done
          for config in $CONFIGS; do
            name=${config%%:*}
            echo "::group::$name"; cat "$RUNNER_TEMP/$name.txt"; echo "::endgroup::"
          done
          exit $status

      - name: Upload findings
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-findings-${{ matrix.id }}
          path: ${{ runner.temp }}/findings
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30

  # The targets split over runners (target i on shard i mod n): libFuzzer runs one target at a time, so one runner
  # takes the sum of every target's time. Three at night and by hand (an hour on one runner), one on pushes and
  # pull requests (ten seconds a target, under four minutes in all: two runners there finished a minute or two
  # sooner, but held a second slot of the account's concurrent jobs while ci.yml's waited).
  libfuzzer:
    name: libFuzzer (SharpFuzz, ${{ matrix.shard }}/${{ strategy.job-total }})
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.fuzz != 'false' }}
    runs-on: ubuntu-26.04
    timeout-minutes: ${{ github.event_name == 'pull_request' && 30 || 120 }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '[1, 2, 3]' || '[1]') }}
    env:
      LIBFUZZER_SHARDS: ${{ strategy.job-total }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet

      - name: Install clang with libFuzzer
        run: |
          "$GITHUB_WORKSPACE/.github/actions/apt-install/apt-install.sh" clang
          version=$(clang --version | sed -n 's/.*clang version \([0-9]*\).*/\1/p')
          "$GITHUB_WORKSPACE/.github/actions/apt-install/apt-install.sh" "libclang-rt-$version-dev" || true

      # Every target (the list run.sh fuzzes without arguments), and this shard's share of them.
      - name: Fuzz this shard's targets
        env:
          NINO_LIBFUZZER_WORK: ${{ runner.temp }}/libfuzzer
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          dotnet build tests/Nino.Fuzz/Nino.Fuzz.csproj -c Release -f net10.0 -nologo -v quiet
          mapfile -t all < <(dotnet tests/Nino.Fuzz/bin/Release/net10.0/Nino.Fuzz.dll targets)
          mine=()
          for i in "${!all[@]}"; do
            if (( i % LIBFUZZER_SHARDS == SHARD - 1 )); then mine+=("${all[i]}"); fi
          done
          echo "targets: ${#all[@]}, this shard: ${mine[*]}"
          (( ${#all[@]} > 0 ))
          if (( ${#mine[@]} > 0 )); then tests/Nino.Fuzz/libfuzzer/run.sh "$LIBFUZZER_SECONDS" "${mine[@]}"; fi

      - name: Upload findings
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: libfuzzer-findings-${{ matrix.shard }}
          path: ${{ runner.temp }}/libfuzzer/findings
          if-no-files-found: ignore
          retention-days: 30
