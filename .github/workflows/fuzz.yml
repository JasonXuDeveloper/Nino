name: Fuzz

# Fuzzes the deserializer (tests/Nino.Fuzz, README.md there): the mutational fuzzer with guard pages and invariant
# checks on every SIMD path, the hand-made probes, and coverage-guided libFuzzer runs of the SharpFuzz targets.
# Pull requests and pushes get about a minute per configuration; the nightly run a longer budget.
on:
  push:
    branches: [ "main", "claude/zen-goldberg-5qqqcu" ]
    # What the fuzzer builds: Nino.Core, Nino.Immutable, the generator, and the fuzzer itself.
    paths: &paths
      - 'src/Nino.Core/**'
      - 'src/Nino.Immutable/**'
      - 'src/Nino.Generator/**'
      - 'src/Nino.Generator.Roslyn4.12/**'
      - 'tests/Nino.Fuzz/**'
      - '.editorconfig'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'nuget.config'
      - '.github/workflows/fuzz.yml'
      - '.github/actions/setup-dotnet/**'
      - '!**/AGENTS.md'      # agent instructions only: nothing to build or test
      - '!**/CLAUDE.md'
  pull_request:
    branches: [ "main" ]
    paths: *paths
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      seconds:
        description: 'Seconds of mutational fuzzing per configuration'
        default: '600'
      libfuzzer_seconds:
        description: 'Seconds of libFuzzer per target'
        default: '120'

permissions:
  contents: read

# A newer push or pull request commit supersedes a run; the nightly and manual runs are never cancelled, and never
# cancel the others (each event its own group).
concurrency:
  group: fuzz-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
  # Known open bugs (the probes marked Known in tests/Nino.Fuzz/Probes.cs) fail the run; setting the repository
  # variable NINO_FUZZ_STRICT_KNOWN to 0 reports them without failing it (none is marked Known now).
  NINO_FUZZ_STRICT_KNOWN: ${{ vars.NINO_FUZZ_STRICT_KNOWN || '1' }}
  SECONDS_BUDGET: ${{ github.event_name == 'schedule' && '1800' || inputs.seconds || '60' }}
  LIBFUZZER_SECONDS: ${{ github.event_name == 'schedule' && '240' || inputs.libfuzzer_seconds || '10' }}

# Bash with -e and -o pipefail for every run step: a command piped into tee, grep or sed fails its step when it fails.
defaults:
  run:
    shell: bash

jobs:
  # Each fuzzer runs on one core (a supervisor and one worker process at a time), so an x64 runner (four vCPUs, two
  # cores) fuzzes two SIMD levels side by side, each with the whole budget: half the runners, the same inputs per
  # configuration. Every vector path has a scalar twin; each SIMD level is its own code path to fuzz.
  mutational:
    name: Mutational (${{ matrix.name }})
    runs-on: ${{ matrix.runner || 'ubuntu-26.04' }}
    timeout-minutes: ${{ github.event_name == 'pull_request' && 30 || 90 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # <name>:<DOTNET_EnableHWIntrinsic>:<DOTNET_EnableAVX512>:<DOTNET_EnableAVX2>, one per process.
          - id: x64-1
            name: SIMD, without SIMD
            configs: SIMD:1:1:1 without-SIMD:0:1:1
          - id: x64-2
            name: without AVX-512, without AVX2
            configs: without-AVX-512:1:0:1 without-AVX2:1:1:0
          - id: arm64
            name: Arm64
            runner: ubuntu-26.04-arm
            configs: Arm64:1:1:1
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet

      - name: Build
        run: dotnet build tests/Nino.Fuzz/Nino.Fuzz.csproj -c Release -f net10.0

      # The fuzzer must find the crashes, hang and exception planted in its SelfTest target, or it would report
      # nothing on a platform where its supervisor or guard pages do not work. Then each configuration fuzzes;
      # its output is printed when all have ended.
      - name: Self test and fuzz
        env:
          CONFIGS: ${{ matrix.configs }}
          FINDINGS: ${{ runner.temp }}/findings
          SEED: ${{ github.run_number }}
        run: |
          set -uo pipefail
          fuzz() {
            local name=$1
            DOTNET_EnableHWIntrinsic=$2 DOTNET_EnableAVX512=$3 DOTNET_EnableAVX2=$4 bash -c '
              set -eo pipefail
              dll=tests/Nino.Fuzz/bin/Release/net10.0/Nino.Fuzz.dll
              dotnet "$dll" selftest
              dotnet "$dll" fuzz --seconds "$SECONDS_BUDGET" --seed "$SEED" --findings "$FINDINGS/$1"' _ "$name"
          }
          declare -A pid
          for config in $CONFIGS; do
            IFS=: read -r name simd avx512 avx2 <<< "$config"
            fuzz "$name" "$simd" "$avx512" "$avx2" > "$RUNNER_TEMP/$name.txt" 2>&1 & pid[$name]=$!
          done
          status=0
          for config in $CONFIGS; do
            name=${config%%:*}
            if ! wait "${pid[$name]}"; then status=1; echo "::error::$name failed (its output below)"; fi
          done
          for config in $CONFIGS; do
            name=${config%%:*}
            echo "::group::$name"; cat "$RUNNER_TEMP/$name.txt"; echo "::endgroup::"
          done
          exit $status

      - name: Upload findings
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-findings-${{ matrix.id }}
          path: ${{ runner.temp }}/findings
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30

  # The targets split over runners (target i on shard i mod n): libFuzzer runs one target at a time, so one runner
  # takes the sum of every target's time. Three at night and by hand (an hour on one runner), two on pushes and
  # pull requests (ten seconds a target: the build is a third of the time).
  libfuzzer:
    name: libFuzzer (SharpFuzz, ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-26.04
    timeout-minutes: ${{ github.event_name == 'pull_request' && 30 || 120 }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '[1, 2, 3]' || '[1, 2]') }}
    env:
      LIBFUZZER_SHARDS: ${{ strategy.job-total }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet

      - name: Install clang with libFuzzer
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang
          version=$(clang --version | sed -n 's/.*clang version \([0-9]*\).*/\1/p')
          sudo apt-get install -y -q "libclang-rt-$version-dev" || true

      # Every target (the list run.sh fuzzes without arguments), and this shard's share of them.
      - name: Fuzz this shard's targets
        env:
          NINO_LIBFUZZER_WORK: ${{ runner.temp }}/libfuzzer
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          dotnet build tests/Nino.Fuzz/Nino.Fuzz.csproj -c Release -f net10.0 -nologo -v quiet
          mapfile -t all < <(dotnet tests/Nino.Fuzz/bin/Release/net10.0/Nino.Fuzz.dll targets)
          mine=()
          for i in "${!all[@]}"; do
            if (( i % LIBFUZZER_SHARDS == SHARD - 1 )); then mine+=("${all[i]}"); fi
          done
          echo "targets: ${#all[@]}, this shard: ${mine[*]}"
          (( ${#all[@]} > 0 ))
          if (( ${#mine[@]} > 0 )); then tests/Nino.Fuzz/libfuzzer/run.sh "$LIBFUZZER_SECONDS" "${mine[@]}"; fi

      - name: Upload findings
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: libfuzzer-findings-${{ matrix.shard }}
          path: ${{ runner.temp }}/libfuzzer/findings
          if-no-files-found: ignore
          retention-days: 30
