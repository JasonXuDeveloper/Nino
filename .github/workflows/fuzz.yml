name: Fuzz

# Fuzzes the deserializer (tests/Nino.Fuzz, README.md there): the mutational fuzzer with guard pages and invariant
# checks on every SIMD path, the hand-made probes, and coverage-guided libFuzzer runs of the SharpFuzz targets.
# Pull requests and pushes get about a minute per configuration; the nightly run a longer budget.
on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - '.editorconfig'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - 'Nino.slnx'
      - 'benchmarks/Nino.Benchmark/**'
      - 'benchmarks/Nino.GeneratorBenchmark/**'
      - 'global.json'
      - 'nuget.config'
      - 'tests/**'
      - 'tests/Nino.Fuzz/**'
      - '.github/workflows/fuzz.yml'
  pull_request:
    branches: [ "main", "develop" ]
    paths:
      - 'src/**'
      - '.editorconfig'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - 'Nino.slnx'
      - 'benchmarks/Nino.Benchmark/**'
      - 'benchmarks/Nino.GeneratorBenchmark/**'
      - 'global.json'
      - 'nuget.config'
      - 'tests/**'
      - 'tests/Nino.Fuzz/**'
      - '.github/workflows/fuzz.yml'
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      seconds:
        description: 'Seconds of mutational fuzzing per configuration'
        default: '600'
      libfuzzer_seconds:
        description: 'Seconds of libFuzzer per target'
        default: '120'

permissions:
  contents: read

# A newer push or pull request commit supersedes a run; the nightly and manual runs are never cancelled, and never
# cancel the others (each event its own group).
concurrency:
  group: fuzz-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  # Known open bugs (the probes marked Known in tests/Nino.Fuzz/Probes.cs) fail the run; setting the repository
  # variable NINO_FUZZ_STRICT_KNOWN to 0 reports them without failing it (none is marked Known now).
  NINO_FUZZ_STRICT_KNOWN: ${{ vars.NINO_FUZZ_STRICT_KNOWN || '1' }}
  SECONDS_BUDGET: ${{ github.event_name == 'schedule' && '1800' || inputs.seconds || '60' }}
  LIBFUZZER_SECONDS: ${{ github.event_name == 'schedule' && '240' || inputs.libfuzzer_seconds || '10' }}

jobs:
  mutational:
    name: Mutational (${{ matrix.name }})
    runs-on: ${{ matrix.runner || 'ubuntu-26.04' }}
    timeout-minutes: ${{ github.event_name == 'pull_request' && 30 || 90 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: SIMD
          # Every vector path has a scalar twin; each SIMD level is its own code path to fuzz.
          - name: without SIMD
            simd: '0'
          - name: without AVX-512
            avx512: '0'
          - name: without AVX2
            avx2: '0'
          - name: Arm64
            runner: ubuntu-24.04-arm
    env:
      DOTNET_EnableHWIntrinsic: ${{ matrix.simd || '1' }}
      DOTNET_EnableAVX512: ${{ matrix.avx512 || '1' }}
      DOTNET_EnableAVX2: ${{ matrix.avx2 || '1' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            ${{ vars.DOTNET_VERSION || '10.0.x' }}
            10.0.x

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-fuzz-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ runner.arch }}-fuzz-
            nuget-${{ runner.os }}-${{ runner.arch }}-

      - name: Build
        run: dotnet build tests/Nino.Fuzz/Nino.Fuzz.csproj -c Release -f net10.0

      # The fuzzer must find the crashes, hang and exception planted in its SelfTest target, or it would report
      # nothing on a platform where its supervisor or guard pages do not work.
      - name: Self test
        run: dotnet tests/Nino.Fuzz/bin/Release/net10.0/Nino.Fuzz.dll selftest

      - name: Fuzz
        run: >
          dotnet tests/Nino.Fuzz/bin/Release/net10.0/Nino.Fuzz.dll fuzz
          --seconds "$SECONDS_BUDGET" --seed "${{ github.run_number }}"
          --findings "${{ runner.temp }}/findings"

      - name: Upload findings
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-findings-${{ matrix.name }}
          path: ${{ runner.temp }}/findings
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30

  # The targets split over three runners (target i on shard i mod 3): libFuzzer runs one target at a time, so one
  # runner took the sum of every target's time (an hour at night).
  libfuzzer:
    name: libFuzzer (SharpFuzz, ${{ matrix.shard }}/3)
    runs-on: ubuntu-26.04
    timeout-minutes: ${{ github.event_name == 'pull_request' && 30 || 120 }}
    strategy:
      fail-fast: false
      matrix:
        shard: [ 1, 2, 3 ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            ${{ vars.DOTNET_VERSION || '10.0.x' }}
            10.0.x

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-fuzz-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ runner.arch }}-fuzz-
            nuget-${{ runner.os }}-${{ runner.arch }}-

      - name: Install clang with libFuzzer
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang
          version=$(clang --version | sed -n 's/.*clang version \([0-9]*\).*/\1/p')
          sudo apt-get install -y -q "libclang-rt-$version-dev" || true

      # Every target (the list run.sh fuzzes without arguments), and this shard's share of them.
      - name: Fuzz this shard's targets
        env:
          NINO_LIBFUZZER_WORK: ${{ runner.temp }}/libfuzzer
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          dotnet build tests/Nino.Fuzz/Nino.Fuzz.csproj -c Release -f net10.0 -nologo -v quiet
          mapfile -t all < <(dotnet tests/Nino.Fuzz/bin/Release/net10.0/Nino.Fuzz.dll targets)
          mine=()
          for i in "${!all[@]}"; do
            if (( i % 3 == SHARD - 1 )); then mine+=("${all[i]}"); fi
          done
          echo "targets: ${#all[@]}, this shard: ${mine[*]}"
          (( ${#all[@]} > 0 ))
          if (( ${#mine[@]} > 0 )); then tests/Nino.Fuzz/libfuzzer/run.sh "$LIBFUZZER_SECONDS" "${mine[@]}"; fi

      - name: Upload findings
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: libfuzzer-findings-${{ matrix.shard }}
          path: ${{ runner.temp }}/libfuzzer/findings
          if-no-files-found: ignore
          retention-days: 30
