name: .NET A/B (test branch)

# Development only, on the test branch: never merge this file into main. A push that changes
# .github/dotnet-ab-request.txt measures, on the x64 and Arm64 runners, each line's two commits of the .NET library
# one after the other on the same runner, for the given number of rounds (base, head, base, head, ...: each round a
# new BenchmarkDotNet process per benchmark, in quick mode):
#
#   <base sha> <head sha> <rounds> <BenchmarkDotNet filters...>
#
# Each line is a job of its own on each runner (up to three lines; a note after " #" is not part of it). A line may start with cpu=<regex> (an
# case-insensitive extended regular expression on lscpu's model name, for example cpu='Intel|Neoverse'): the x64 runner pool mixes
# Intel and AMD processors, so such a line runs on up to eight x64 runners at once (slots), each going on only when its
# processor matches (the others end at once, successfully, with a notice); a line without it runs on one runner of each kind as before. Both commits must be on a branch of this
# repository (main, or this branch: push them here, merging, never force-pushing). Both are built with head's
# benchmark project. The reports and the ab.py tables go to the log. Numbers are for development only.
on:
  push:
    branches: [claude/zen-goldberg-5qqqcu]
    paths: [.github/dotnet-ab-request.txt]

permissions:
  contents: read

concurrency:
  group: dotnet-ab-${{ github.sha }}
  cancel-in-progress: false

jobs:
  ab:
    name: A/B on ${{ matrix.runner }} (line ${{ matrix.line }}, slot ${{ matrix.slot }})
    strategy:
      fail-fast: false
      # The account runs a limited number of jobs at once: leave room for main's CI and the other A/B workflow.
      max-parallel: 8
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
        line: [1, 2, 3]
        slot: [1]
        include:
          - { runner: ubuntu-26.04, line: 1, slot: 2 }
          - { runner: ubuntu-26.04, line: 1, slot: 3 }
          - { runner: ubuntu-26.04, line: 1, slot: 4 }
          - { runner: ubuntu-26.04, line: 1, slot: 5 }
          - { runner: ubuntu-26.04, line: 1, slot: 6 }
          - { runner: ubuntu-26.04, line: 1, slot: 7 }
          - { runner: ubuntu-26.04, line: 1, slot: 8 }
          - { runner: ubuntu-26.04, line: 2, slot: 2 }
          - { runner: ubuntu-26.04, line: 2, slot: 3 }
          - { runner: ubuntu-26.04, line: 2, slot: 4 }
          - { runner: ubuntu-26.04, line: 2, slot: 5 }
          - { runner: ubuntu-26.04, line: 2, slot: 6 }
          - { runner: ubuntu-26.04, line: 2, slot: 7 }
          - { runner: ubuntu-26.04, line: 2, slot: 8 }
          - { runner: ubuntu-26.04, line: 3, slot: 2 }
          - { runner: ubuntu-26.04, line: 3, slot: 3 }
          - { runner: ubuntu-26.04, line: 3, slot: 4 }
          - { runner: ubuntu-26.04, line: 3, slot: 5 }
          - { runner: ubuntu-26.04, line: 3, slot: 6 }
          - { runner: ubuntu-26.04, line: 3, slot: 7 }
          - { runner: ubuntu-26.04, line: 3, slot: 8 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Whether this slot measures (its line exists, and its CPU matches the line's cpu=), before anything is installed.
      - name: Check the line and the CPU
        id: check
        env:
          LINE: ${{ matrix.line }}
          SLOT: ${{ matrix.slot }}
        run: |
          set -euo pipefail
          lscpu | grep -E 'Model name|Flags' | cut -c1-2000 || true
          go=true
          # A file with every line commented out (all done) is no request: grep finds nothing, and that is not an error.
          request=$({ grep -v -e '^#' -e '^[[:space:]]*$' .github/dotnet-ab-request.txt || true; } | sed -n "${LINE}p")
          request=${request%%[[:space:]]#*}  # a note after " #" is not part of the line
          model=$(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -1)
          cpu=''
          if [[ $request == cpu=* ]]; then read -r cpu request <<< "$request"; cpu=${cpu#cpu=}; cpu=${cpu//\'/}; fi
          if [[ -z $request ]]; then echo "No line $LINE"; go=false
          elif [[ -z $cpu && $SLOT != 1 ]]; then echo "Line $LINE has no cpu=: slot 1 only"; go=false
          elif [[ -n $cpu ]] && ! grep -Eqi -- "$cpu" <<< "$model"; then
            echo "::notice::$model does not match cpu=$cpu: nothing measured on this runner"; go=false
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"
      # dotnet-install.sh with each channel's latest version from builds.dotnet.microsoft.com: the aka.ms links it (and
      # setup-dotnet) resolve a channel to point at dotnetorigin.blob.core.windows.net, which answers 409.
      - name: Install .NET 10 and 8
        if: steps.check.outputs.go == 'true'
        run: |
          set -euo pipefail
          script="$RUNNER_TEMP/dotnet-install.sh"
          curl -sSfL --retry 3 https://dot.net/v1/dotnet-install.sh -o "$script"
          for channel in 10.0 8.0; do
            version=$(bash "$script" --channel "$channel" --dry-run | sed -n 's/.*--version "\([^"]*\)".*/\1/p' | head -1)
            [[ -n $version ]] || { echo "::error::no version for channel $channel"; exit 1; }
            bash "$script" --version "$version" --install-dir "$HOME/.dotnet" --azure-feed https://builds.dotnet.microsoft.com/dotnet
          done
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"
          echo "DOTNET_ROOT=$HOME/.dotnet" >> "$GITHUB_ENV"
      - name: Measure
        if: steps.check.outputs.go == 'true'
        env:
          RUNNER: ${{ matrix.runner }}
          LINE: ${{ matrix.line }}
          SLOT: ${{ matrix.slot }}
        run: |
          set -euo pipefail
          set -f  # the filters are patterns for BenchmarkDotNet, not for the shell
          # BenchmarkDotNet's high priority (see arm64-bench.yml).
          sudo prlimit --pid $$ --nice=40:40 || echo "::warning::could not raise the nice limit: normal priority"
          # A file with every line commented out (all done) is no request: grep finds nothing, and that is not an error.
          request=$({ grep -v -e '^#' -e '^[[:space:]]*$' .github/dotnet-ab-request.txt || true; } | sed -n "${LINE}p")
          request=${request%%[[:space:]]#*}  # a note after " #" is not part of the line
          if [[ $request == cpu=* ]]; then read -r _ request <<< "$request"; fi
          model=$(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -1)
          read -r base head rounds filters <<< "$request"
          read -ra F <<< "$filters"
          out="$RUNNER_TEMP/out"
          mkdir -p "$out"
          for side in base head; do
            ref=$base; [[ $side == head ]] && ref=$head
            git cat-file -e "$ref^{commit}"
            git worktree add -q --detach "$RUNNER_TEMP/$side" "$ref"
          done
          rm -rf "$RUNNER_TEMP/base/benchmarks/Nino.Benchmark"
          cp -r "$RUNNER_TEMP/head/benchmarks/Nino.Benchmark" "$RUNNER_TEMP/base/benchmarks/Nino.Benchmark"
          for side in base head; do
            dotnet build -c Release "$RUNNER_TEMP/$side/benchmarks/Nino.Benchmark" -v q -nologo < /dev/null
          done
          report() {
            local files
            mapfile -t files < <(find "$1" -name '*-report-github.md' | sort)
            ((${#files[@]})) || return 1
            if ((${#files[@]} == 1)); then cp "${files[0]}" "$2"; else python3 benchmarks/merge_reports.py "${files[@]}" > "$2"; fi
          }
          echo "## $RUNNER line $LINE slot $SLOT ($model): ${base:0:7} -> ${head:0:7}, $rounds rounds: $filters" | tee -a "$GITHUB_STEP_SUMMARY"
          for round in $(seq "$rounds"); do
            for side in base head; do
              (cd "$RUNNER_TEMP/$side/benchmarks/Nino.Benchmark" && NINO_BENCH_QUICK=1 dotnet bin/Release/net10.0/Nino.Benchmark.dll \
                --filter "${F[@]}" --artifacts "$out/$side-$round" < /dev/null) > "$out/$side-$round.log" 2>&1 ||
                { tail -50 "$out/$side-$round.log"; exit 1; }
              report "$out/$side-$round" "$out/$side-$round.md"
              grep -h '// ADDR' "$out/$side-$round.log" | sort -u || true  # what a probe printed about its process
              echo "=== REPORT $side round $round ($(git -C "$RUNNER_TEMP/$side" rev-parse --short HEAD))"
              cat "$out/$side-$round.md"
            done
            echo "=== AB round $round"
            { echo "### Round $round ($model)"; python3 benchmarks/ab.py "$out/base-$round.md" "$out/head-$round.md" || true; } | tee -a "$GITHUB_STEP_SUMMARY"
          done
