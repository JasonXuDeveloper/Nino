name: Release

# Run manually: Actions -> Release -> Run workflow (on main), enter the version (e.g. 4.0.0 or 4.1.0-beta.1).
#   tag:     bump the version of every package (.github/scripts/bump_version.py: Directory.Build.props, the Unity
#            package.json, the Rust crates, the npm package), build, test, copy the Unity DLLs, commit "Bump to vX.Y.Z",
#            tag vX.Y.Z (and the OpenUPM tag of a pre-release, and runtimes/go/vX.Y.Z for the Go module), push.
#   publish: from the tag, pack and push to NuGet (Trusted Publishing: a short-lived key from this workflow's OIDC
#            token, no stored secret), create the GitHub release with the notes of .github/scripts/release_notes.py
#            (every commit since the previous release, grouped, and every contributor; a stable release starts at
#            the previous stable one, so 4.0.0 covers everything since 3.3.13), then start the benchmark report.
#            The highlights at the top come from Wire-Format/Added/Performance/Fixed commit trailers (see release_notes.py).
#            If it fails, fix the cause and use "Re-run failed jobs": the tag stays, NuGet skips a version it
#            already has, the release is created once. To change an input (notes_since), run the
#            workflow again with the same version: for an existing tag it skips straight to publishing.
# Trusted Publishing policy on nuget.org: owner JasonXuDeveloper, repository Nino, workflow release.yml.
#   crates:  from the tag, publish nino-serialization-derive and nino-serialization to crates.io (Trusted Publishing,
#            rust-lang/crates-io-auth-action; each crate's trusted publisher: JasonXuDeveloper/Nino, release.yml).
#   npm:     from the tag, build and publish nino-serialization to npm (Trusted Publishing; a pre-release under the
#            dist-tag "next", so "latest" stays the newest stable). Both skip what the registry already has.
# Trusted Publishing is set up on a package that exists: a package's first version is published by hand from the
# tag (CONTRIBUTING.md), or by this workflow with an API token (repository secrets CARGO_REGISTRY_TOKEN, NPM_TOKEN,
# needed only then); then its trusted publisher is added in the registry's settings.
# The Go module needs no registry: proxy.golang.org serves it from the runtimes/go/vX.Y.Z tag.
#
# Unity reads the package from the tag, so the tag must point at the commit that carries the DLLs: both are made
# by the same job. OpenUPM does not order semantic pre-releases, so a pre-release also gets a vX.Y.Z-preview.N tag
# (alpha.N -> preview.N, beta.N -> preview.(100+N), rc.N -> preview.(200+N)), matching the package.json version.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (e.g. 4.0.0 or 4.1.0-beta.1)"
        required: true
        type: string
      notes_since:
        description: "Optional: the tag the release notes start from (default: the previous release, see release_notes.py)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version }}
  UNITY_PACKAGE: src/Nino.Unity/Packages/com.jasonxudeveloper.nino

# Bash with -e and -o pipefail for every run step: a command piped into tee, grep or sed fails its step when it fails.
defaults:
  run:
    shell: bash

jobs:
  tag:
    runs-on: ubuntu-26.04
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 30
    outputs:
      unity_version: ${{ steps.version.outputs.unity_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate version
        id: version
        run: |
          if [[ ! "$VERSION" =~ ^([0-9]+\.[0-9]+\.[0-9]+)(-(alpha|beta|rc)\.([0-9]+))?$ ]]; then
            echo "::error::'$VERSION' is not x.y.z or x.y.z-(alpha|beta|rc).n"; exit 1
          fi
          BASE="${BASH_REMATCH[1]}"; LABEL="${BASH_REMATCH[3]}"; NUM="${BASH_REMATCH[4]}"
          if [[ -z "$LABEL" ]]; then
            UNITY_VERSION="$BASE"
          else
            if (( NUM > 99 )); then echo "::error::pre-release number must be at most 99"; exit 1; fi
            case "$LABEL" in alpha) OFFSET=0 ;; beta) OFFSET=100 ;; rc) OFFSET=200 ;; esac
            UNITY_VERSION="$BASE-preview.$((OFFSET + NUM))"
          fi
          echo "unity_version=$UNITY_VERSION" >> "$GITHUB_OUTPUT"
          # An existing tag: only publish what is still missing (NuGet skips versions it has, the release is
          # created once), so a release whose publish job failed can be run again with corrected inputs.
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::notice::tag v$VERSION exists: publishing it without bumping or tagging"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version
        if: steps.version.outputs.exists != 'true'
        env:
          UNITY_VERSION: ${{ steps.version.outputs.unity_version }}
        run: python3 .github/scripts/bump_version.py "$VERSION" "$UNITY_VERSION"

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet
        with:
          net8: true
          cache: false

      - name: Build and test the bumped version
        if: steps.version.outputs.exists != 'true'
        run: |
          dotnet build --configuration Release
          dotnet test tests/Nino.UnitTests/Nino.UnitTests.csproj --no-build --configuration Release

      - name: Copy the Unity DLLs
        if: steps.version.outputs.exists != 'true'
        run: |
          cp src/Nino.Core/bin/Release/netstandard2.1/Nino.Core.dll "$UNITY_PACKAGE/Runtime/Nino.Core.dll"
          # The Roslyn 4.3 build: Unity's compiler cannot load the 4.12 one.
          cp src/Nino.Generator/bin/Release/netstandard2.0/Nino.Generator.dll "$UNITY_PACKAGE/Runtime/Nino.Generator.dll"
          # Code fixes, for Rider and Visual Studio: Unity lists RoslynAnalyzer DLLs in the projects it generates. The
          # compiler finds no analyzer in it and leaves it alone (no warning, Roslyn 3.9 and later).
          cp src/Nino.Generator.CodeFixes/bin/Release/netstandard2.0/Nino.Generator.CodeFixes.dll "$UNITY_PACKAGE/Runtime/Nino.Generator.CodeFixes.dll"
          # The Unity class formatters, compiled against UnityEngineStub; in Unity they bind to Unity's CoreModule.
          cp src/Nino.UnityTypes/bin/Release/netstandard2.1/Nino.UnityTypes.dll "$UNITY_PACKAGE/Runtime/Nino.UnityTypes.dll"

      - name: Commit and tag
        if: steps.version.outputs.exists != 'true'
        env:
          UNITY_VERSION: ${{ steps.version.outputs.unity_version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Directory.Build.props "$UNITY_PACKAGE/package.json" "$UNITY_PACKAGE/Runtime/"*.dll \
            runtimes/rust/Cargo.toml runtimes/rust/nino-derive/Cargo.toml runtimes/rust/Cargo.lock \
            runtimes/typescript/package.json runtimes/typescript/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Bump to v$VERSION"
          fi
          git tag -a "v$VERSION" -m "v$VERSION"
          # The Go module's version: a module in a subdirectory is tagged <directory>/vX.Y.Z.
          git tag -a "runtimes/go/v$VERSION" -m "v$VERSION (Go module)"
          TAGS=("v$VERSION" "runtimes/go/v$VERSION")
          if [[ "$UNITY_VERSION" != "$VERSION" ]]; then
            git tag -a "v$UNITY_VERSION" -m "v$VERSION (Unity/OpenUPM)"
            TAGS+=("v$UNITY_VERSION")
          fi
          git push origin HEAD:main "${TAGS[@]}"

  publish:
    runs-on: ubuntu-26.04
    needs: tag
    timeout-minutes: 30
    permissions:
      contents: write # the GitHub release
      actions: write  # start the benchmark report
      id-token: write # the OIDC token NuGet exchanges for a temporary API key
    env:
      # The package ids that are packed, checked and pushed (Nino.Core's is Nino.Serialization).
      PACKAGE_IDS: Nino.Serialization Nino.Generator Nino.Immutable Nino.AspNetCore Nino.Codegen Nino.Codegen.Tool Nino
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ inputs.version }}
          fetch-depth: 0 # the release notes walk the history since the previous release
          persist-credentials: false

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet
        with:
          net8: true
          cache: false

      - name: Pack
        run: |
          dotnet build --configuration Release
          for proj in Nino.Core Nino.Generator Nino.Immutable Nino.AspNetCore Nino.Codegen Nino.Codegen.Tool Nino; do
            dotnet pack "src/$proj/$proj.csproj" --no-build --configuration Release --output artifacts
          done
          ls artifacts
          # shellcheck disable=SC2086 # PACKAGE_IDS is a list of ids
          for id in $PACKAGE_IDS; do
            test -f "artifacts/$id.$VERSION.nupkg"
          done

      - name: NuGet login (Trusted Publishing)
        id: nuget
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: JasonXuDeveloper # the nuget.org account that owns the policy

      - name: Push to NuGet
        env:
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
        run: |
          # shellcheck disable=SC2086 # PACKAGE_IDS is a list of ids
          for id in $PACKAGE_IDS; do
            dotnet nuget push "artifacts/$id.$VERSION.nupkg" --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json --skip-duplicate --no-symbols
          done

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          UNITY_VERSION: ${{ needs.tag.outputs.unity_version }}
          NOTES_SINCE: ${{ inputs.notes_since }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then echo "release v$VERSION exists"; exit 0; fi
          PRERELEASE=()
          if [[ "$VERSION" == *-* ]]; then PRERELEASE=(--prerelease); fi
          {
            echo "Install: \`dotnet add package Nino --version $VERSION\` (Unity package: \`$UNITY_VERSION\`)"
            echo
            echo "Other languages: \`go get github.com/JasonXuDeveloper/Nino/runtimes/go/v${VERSION%%.*}@v$VERSION\`," \
              "\`cargo add nino-serialization@=$VERSION\`, \`npm install nino-serialization@$VERSION\`."
          } > "$RUNNER_TEMP/header.md"
          # The notes script of main, not of the tag: fixes to it apply to a release published again.
          git fetch -q origin main && git show origin/main:.github/scripts/release_notes.py > "$RUNNER_TEMP/release_notes.py"
          python3 "$RUNNER_TEMP/release_notes.py" --tag "v$VERSION" ${NOTES_SINCE:+--since "$NOTES_SINCE"} \
            --header "$RUNNER_TEMP/header.md" --out "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" artifacts/*."$VERSION".nupkg --verify-tag --title "v$VERSION" \
            "${PRERELEASE[@]}" --notes-file "$RUNNER_TEMP/notes.md"

      # A release created with the workflow token does not trigger other workflows: start the report explicitly.
      - name: Start the benchmark report
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run report.yml --ref main -f tag_name="v$VERSION"

  crates:
    runs-on: ubuntu-26.04
    needs: tag
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # the OIDC token crates.io exchanges for a temporary API token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ inputs.version }}
          persist-credentials: false

      # Trusted Publishing is configured on a crate that exists: a crate's first version is published with the
      # repository secret CARGO_REGISTRY_TOKEN (a crates.io API token with the publish-new scope), every later one
      # through Trusted Publishing.
      - name: Check which crates exist
        id: check
        run: |
          for crate in nino-serialization-derive nino-serialization; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -A 'Nino release workflow (github.com/JasonXuDeveloper/Nino)' \
              "https://crates.io/api/v1/crates/$crate")
            if [[ "$code" != 200 ]]; then echo "$crate is not on crates.io yet"; echo "new=true" >> "$GITHUB_OUTPUT"; fi
          done

      - name: crates.io login (Trusted Publishing)
        id: auth
        if: steps.check.outputs.new != 'true'
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish to crates.io
        working-directory: runtimes/rust
        env:
          NEW: ${{ steps.check.outputs.new }}
          OIDC_TOKEN: ${{ steps.auth.outputs.token }}
          FIRST_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [[ "$NEW" == true ]]; then
            if [[ -z "$FIRST_TOKEN" ]]; then
              echo "::error::a crate is not on crates.io yet: publish its first version by hand from the tag (CONTRIBUTING.md) and re-run this job, or add the repository secret CARGO_REGISTRY_TOKEN"; exit 1
            fi
            export CARGO_REGISTRY_TOKEN="$FIRST_TOKEN"
          else
            export CARGO_REGISTRY_TOKEN="$OIDC_TOKEN"
          fi
          rustup toolchain install stable --profile minimal
          # The derive crate first: nino-serialization pins its exact version. A crate already published is skipped,
          # so a failed run can be re-run.
          for crate in nino-serialization-derive nino-serialization; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -A 'Nino release workflow (github.com/JasonXuDeveloper/Nino)' \
              "https://crates.io/api/v1/crates/$crate/$VERSION")
            if [[ "$code" == 200 ]]; then echo "$crate $VERSION is on crates.io"; continue; fi
            cargo +stable publish --locked -p "$crate"
          done

  npm:
    runs-on: ubuntu-26.04
    needs: tag
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # npm's Trusted Publishing (and its provenance statement)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ inputs.version }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org

      # As for the crates: the package's first version is published with the repository secret NPM_TOKEN (an npm
      # granular access token that can publish), every later one through Trusted Publishing (no token).
      - name: Publish to npm
        working-directory: runtimes/typescript
        env:
          FIRST_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if npm view "nino-serialization@$VERSION" version >/dev/null 2>&1; then
            echo "nino-serialization $VERSION is on npm"; exit 0
          fi
          if ! npm view nino-serialization name >/dev/null 2>&1; then
            if [[ -z "$FIRST_TOKEN" ]]; then
              echo "::error::nino-serialization is not on npm yet: publish its first version by hand from the tag (CONTRIBUTING.md) and re-run this job, or add the repository secret NPM_TOKEN"; exit 1
            fi
            export NODE_AUTH_TOKEN="$FIRST_TOKEN"
          fi
          # Trusted Publishing needs npm 11.5.1 or later: a fixed release, not whatever is newest on the day.
          npm install -g npm@11.21.0
          npm ci
          cp ../../LICENSE LICENSE
          TAG=latest
          if [[ "$VERSION" == *-* ]]; then TAG=next; fi
          npm publish --access public --tag "$TAG"
