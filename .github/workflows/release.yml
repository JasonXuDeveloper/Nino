name: Release

# Run manually: Actions -> Release -> Run workflow (on main), enter the version (e.g. 4.0.0 or 4.1.0-beta.1).
#   tag:     bump the version (src/Directory.Build.props, src/Version.cs, the Unity package.json), build, test,
#            copy the Unity DLLs, commit "Bump to vX.Y.Z", tag vX.Y.Z (and the OpenUPM tag of a pre-release), push.
#   publish: from the tag, pack and push to NuGet (Trusted Publishing: a short-lived key from this workflow's OIDC
#            token, no stored secret), create the GitHub release with GitHub's generated notes, then start the
#            benchmark report. If it fails, fix the cause and use "Re-run failed jobs": the tag stays, NuGet skips a
#            version it already has, the release is created once.
# Trusted Publishing policy on nuget.org: owner JasonXuDeveloper, repository Nino, workflow release.yml.
#
# Unity reads the package from the tag, so the tag must point at the commit that carries the DLLs: both are made
# by the same job. OpenUPM does not order semantic pre-releases, so a pre-release also gets a vX.Y.Z-preview.N tag
# (alpha.N -> preview.N, beta.N -> preview.(100+N), rc.N -> preview.(200+N)), matching the package.json version.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (e.g. 4.0.0 or 4.1.0-beta.1)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version }}
  UNITY_PACKAGE: src/Nino.Unity/Packages/com.jasonxudeveloper.nino

jobs:
  tag:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 30
    outputs:
      unity_version: ${{ steps.version.outputs.unity_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate version
        id: version
        run: |
          if [[ ! "$VERSION" =~ ^([0-9]+\.[0-9]+\.[0-9]+)(-(alpha|beta|rc)\.([0-9]+))?$ ]]; then
            echo "::error::'$VERSION' is not x.y.z or x.y.z-(alpha|beta|rc).n"; exit 1
          fi
          BASE="${BASH_REMATCH[1]}"; LABEL="${BASH_REMATCH[3]}"; NUM="${BASH_REMATCH[4]}"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::tag v$VERSION already exists (to retry publishing, re-run the failed job of its run)"; exit 1
          fi
          if [[ -z "$LABEL" ]]; then
            UNITY_VERSION="$BASE"
          else
            if (( NUM > 99 )); then echo "::error::pre-release number must be at most 99"; exit 1; fi
            case "$LABEL" in alpha) OFFSET=0 ;; beta) OFFSET=100 ;; rc) OFFSET=200 ;; esac
            UNITY_VERSION="$BASE-preview.$((OFFSET + NUM))"
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "unity_version=$UNITY_VERSION" >> "$GITHUB_OUTPUT"

      - name: Bump version
        env:
          BASE: ${{ steps.version.outputs.base }}
          UNITY_VERSION: ${{ steps.version.outputs.unity_version }}
        run: |
          sed -i "s|<Version>[^<]*</Version>|<Version>$VERSION</Version>|" src/Directory.Build.props
          sed -i "s|Version(\"[^\"]*\")|Version(\"$BASE\")|g" src/Version.cs
          sed -i "s|\"version\": \"[^\"]*\"|\"version\": \"$UNITY_VERSION\"|" "$UNITY_PACKAGE/package.json"
          grep -q "<Version>$VERSION</Version>" src/Directory.Build.props
          grep -q "AssemblyVersion(\"$BASE\")" src/Version.cs
          grep -q "\"version\": \"$UNITY_VERSION\"" "$UNITY_PACKAGE/package.json"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            8.0.x

      - name: Build and test the bumped version
        working-directory: src
        run: |
          dotnet build --configuration Release
          dotnet test Nino.UnitTests/Nino.UnitTests.csproj --no-build --configuration Release

      - name: Copy the Unity DLLs
        run: |
          cp src/Nino.Core/bin/Release/netstandard2.1/Nino.Core.dll "$UNITY_PACKAGE/Runtime/Nino.Core.dll"
          # The Roslyn 4.3 build: Unity's compiler cannot load the 4.12 one.
          cp src/Nino.Generator/bin/Release/netstandard2.0/Nino.Generator.dll "$UNITY_PACKAGE/Runtime/Nino.Generator.dll"

      - name: Commit and tag
        env:
          UNITY_VERSION: ${{ steps.version.outputs.unity_version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Directory.Build.props src/Version.cs "$UNITY_PACKAGE/package.json" "$UNITY_PACKAGE/Runtime/"*.dll
          if ! git diff --cached --quiet; then
            git commit -m "Bump to v$VERSION"
          fi
          git tag -a "v$VERSION" -m "v$VERSION"
          TAGS=("v$VERSION")
          if [[ "$UNITY_VERSION" != "$VERSION" ]]; then
            git tag -a "v$UNITY_VERSION" -m "v$VERSION (Unity/OpenUPM)"
            TAGS+=("v$UNITY_VERSION")
          fi
          git push origin HEAD:main "${TAGS[@]}"

  publish:
    runs-on: ubuntu-latest
    needs: tag
    timeout-minutes: 30
    permissions:
      contents: write # the GitHub release
      actions: write  # start the benchmark report
      id-token: write # the OIDC token NuGet exchanges for a temporary API key
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ inputs.version }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            8.0.x

      - name: Pack
        working-directory: src
        run: |
          dotnet build --configuration Release
          for proj in Nino.Core Nino.Generator Nino.Immutable Nino; do
            dotnet pack "$proj/$proj.csproj" --no-build --configuration Release --output ../artifacts
          done
          ls ../artifacts
          for id in Nino.Serialization Nino.Generator Nino.Immutable Nino; do
            test -f "../artifacts/$id.$VERSION.nupkg"
          done

      - name: NuGet login (Trusted Publishing)
        id: nuget
        uses: NuGet/login@v1
        with:
          user: JasonXuDeveloper # the nuget.org account that owns the policy

      - name: Push to NuGet
        env:
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
        run: |
          for id in Nino.Serialization Nino.Generator Nino.Immutable Nino; do
            dotnet nuget push "artifacts/$id.$VERSION.nupkg" --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json --skip-duplicate --no-symbols
          done

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          UNITY_VERSION: ${{ needs.tag.outputs.unity_version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then echo "release v$VERSION exists"; exit 0; fi
          PRERELEASE=""
          if [[ "$VERSION" == *-* ]]; then PRERELEASE="--prerelease"; fi
          # --notes goes first; the generated notes (pull requests since the previous tag) are appended.
          gh release create "v$VERSION" artifacts/*."$VERSION".nupkg --verify-tag --title "v$VERSION" $PRERELEASE \
            --notes "Install: \`dotnet add package Nino --version $VERSION\` (Unity package: \`$UNITY_VERSION\`)" \
            --generate-notes

      # A release created with the workflow token does not trigger other workflows: start the report explicitly.
      - name: Start the benchmark report
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run report.yml --ref main -f tag_name="v$VERSION"
