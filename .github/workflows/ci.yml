name: CI - Build and Test

on:
  push:
    branches: [ "main", "develop", "claude/zen-goldberg-5qqqcu" ]
    paths:
      - 'src/**'
      - '.editorconfig'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - 'Nino.slnx'
      - 'benchmarks/Nino.Benchmark/**'
      - 'benchmarks/Nino.GeneratorBenchmark/**'
      - 'global.json'
      - 'nuget.config'
      - 'tests/**'
      - 'runtimes/**'
      - 'conformance/**'
      - '.github/workflows/ci.yml'
      - '.github/scripts/test_shards.py'
  pull_request:
    branches: [ "main", "develop" ]
    paths:
      - 'src/**'
      - '.editorconfig'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - 'Nino.slnx'
      - 'benchmarks/Nino.Benchmark/**'
      - 'benchmarks/Nino.GeneratorBenchmark/**'
      - 'global.json'
      - 'nuget.config'
      - 'tests/**'
      - 'runtimes/**'
      - 'conformance/**'
      - '.github/workflows/ci.yml'
      - '.github/scripts/test_shards.py'
  workflow_call:
  workflow_dispatch:

# Security: Minimal required permissions
permissions:
  contents: read        # Read repository contents
  actions: write        # Upload artifacts
  pull-requests: read   # Read PR context
  checks: write         # Write test results

# Prevent concurrent runs of the same workflow only when CI actually runs
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Bash everywhere, Windows included: GitHub runs it with -e and -o pipefail, so a command piped into tee or grep
# fails its step when it fails.
defaults:
  run:
    shell: bash

# The .NET CLI's banner, telemetry and first-run setup are noise and time in CI.
env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'

jobs:
  # Every configuration runs the whole unit test suite in three shards, side by side on one runner: the ShapeMatrix
  # rows compile some 70 shapes each and take two thirds of the suite's time, so each half of them is a shard, and
  # everything else the third. A shard takes about one and a half of the runner's four vCPUs (Roslyn), so the three
  # together take about as long as the longest alone did on a runner of its own, without a runner (and a build) per
  # shard: those 27 runners took most of the account's 40 concurrent jobs, and the other workflows' jobs waited behind
  # them. Each shard runs its own copy of the build output (the coverage collector instruments the assemblies in
  # place). The shards' filters are complements of each other, each shard checks it ran every test its filter lists,
  # and "Build and Test" checks that the shards of each configuration together ran every test of the suite
  # (.github/scripts/test_shards.py).
  unit-tests:
    name: Unit tests (${{ matrix.config.name }})
    runs-on: ${{ matrix.config.runner || 'ubuntu-26.04' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        config:
          # The Roslyn 4.12 generator (interceptors on).
          - id: net10
            name: net10.0
            framework: net10.0
            coverage: true
          # What Unity and older compilers run: Nino.Core netstandard2.1, regular calls instead of interceptors.
          - id: ns21
            name: netstandard2.1 without interceptors
            framework: net8.0
            properties: -p:NinoCoreTfm=netstandard2.1 -p:NinoRegularCalls=true
          # The .NET 8 SDK's preview interceptor attribute: Nino.Core netstandard2.0, the Roslyn 4.8 generator.
          # Each Nino.Core build is checked against the pinned bytes of GoldenBytesTests.
          - id: ns20
            name: netstandard2.0 with Roslyn 4.8
            framework: net8.0
            properties: -p:NinoCoreTfm=netstandard2.0 -p:NinoGeneratorBuild=4.8
          # Arm64: its byte shuffle (tbl), 16-byte vectors only, and the net8.0 build's own shuffle path.
          - id: arm64-net10
            name: net10.0 on Arm64
            runner: ubuntu-26.04-arm
            framework: net10.0
          - id: arm64-net8
            name: net8.0 on Arm64
            runner: ubuntu-26.04-arm
            framework: net8.0
          # x64 CPUs without AVX-512 (most desktops: 32-byte vectors, no byte permute), and without any SIMD.
          - id: no-avx512
            name: net10.0 without AVX-512
            framework: net10.0
            avx512: '0'
          # Older x64 CPUs (SSSE3, no AVX2): 16-byte vectors, two shuffles a vector where Arm64 has one table lookup.
          - id: no-avx2
            name: net10.0 without AVX2
            framework: net10.0
            avx2: '0'
          - id: no-simd
            name: net10.0 without SIMD
            framework: net10.0
            simd: '0'
          # Windows: its paths, file system and line endings. A contributor's analyzer test failed there (PR #203)
          # while every Linux job passed.
          - id: windows
            name: net10.0 on Windows
            runner: windows-latest
            framework: net10.0
    env:
      PROJECT: tests/Nino.UnitTests/Nino.UnitTests.csproj
      CONFIG: ${{ matrix.config.id }}
      FRAMEWORK: ${{ matrix.config.framework }}
      PROPERTIES: ${{ matrix.config.properties }}
      # Relative to the workspace: Git Bash on Windows and dotnet agree on it.
      RESULTS: TestResults
      # MSTest filters (VSTest syntax, parentheses escaped). b and c split ShapeMatrixTests' rows; c is the complement
      # of b, so a row added to the matrix lands in c, and a is the complement of both.
      FILTER_A: FullyQualifiedName!~ShapeMatrixTests
      FILTER_B: >-
        FullyQualifiedName~ShapeMatrixTests&(Name~\(0\)|Name~\(1\)|Name~\(2\)|Name~\(3\)|Name~\(4\)|Name~\(5\)|Name~\(6\)|Name~\(7\))
      FILTER_C: >-
        FullyQualifiedName~ShapeMatrixTests&Name!~\(0\)&Name!~\(1\)&Name!~\(2\)&Name!~\(3\)&Name!~\(4\)&Name!~\(5\)&Name!~\(6\)&Name!~\(7\)

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            ${{ vars.DOTNET_VERSION || '10.0.x' }}
            10.0.x
            8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-unit-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ runner.arch }}-unit-
            nuget-${{ runner.os }}-${{ runner.arch }}-

      # The build, and a copy of its output per shard next to it (tests find the repository by walking up from it).
      - name: Build
        run: |
          read -ra props <<< "$PROPERTIES"
          dotnet build "$PROJECT" -c Debug -f "$FRAMEWORK" "${props[@]}"
          out=$(dirname "$PROJECT")/bin/Debug
          for shard in a b c; do cp -R "$out/$FRAMEWORK" "$out/shard-$shard"; done

      # Each shard writes its results to $RESULTS/test-results-unit-<config>-<shard> (the layout test_shards.py reads)
      # and its output to a file, printed when all three have ended. Then each checks it ran every test its filter
      # selects (and some); shard a also writes the list of the whole suite, which "Build and Test" compares with what
      # the three shards ran.
      - name: Test
        env:
          DOTNET_EnableAVX512: ${{ matrix.config.avx512 || '1' }}
          DOTNET_EnableAVX2: ${{ matrix.config.avx2 || '1' }}
          DOTNET_EnableHWIntrinsic: ${{ matrix.config.simd || '1' }}
          COVERAGE: ${{ matrix.config.coverage && '--collect:XPlat Code Coverage' || '' }}
        run: |
          set -uo pipefail
          out=$(dirname "$PROJECT")/bin/Debug
          shard() {
            local id=$1 filter=$2
            local dll="$out/shard-$id/Nino.UnitTests.dll" dir="$RESULTS/test-results-unit-$CONFIG-$id"
            dotnet test "$dll" --filter "$filter" --logger "trx;LogFileName=unit.trx" --results-directory "$dir" \
              ${COVERAGE:+"$COVERAGE"} || return 1
            local listed ran
            listed=$(dotnet test "$dll" --list-tests --filter "$filter" | grep -c '^    ' || true)
            ran=$(grep -o '<UnitTestResult ' "$dir/unit.trx" | wc -l)
            echo "shard $id: listed $listed, ran $ran"
            if (( listed == 0 || ran != listed )); then
              echo "::error::shard $id ran $ran tests, its filter lists $listed"
              return 1
            fi
            if [[ $id == a ]]; then dotnet test "$dll" --list-tests > "$dir/suite.txt"; fi
          }
          mkdir -p "$RESULTS"
          declare -A pid
          shard a "$FILTER_A" > "$RESULTS/shard-$CONFIG-a.log" 2>&1 & pid[a]=$!
          shard b "$FILTER_B" > "$RESULTS/shard-$CONFIG-b.log" 2>&1 & pid[b]=$!
          shard c "$FILTER_C" > "$RESULTS/shard-$CONFIG-c.log" 2>&1 & pid[c]=$!
          status=0
          for id in a b c; do
            if ! wait "${pid[$id]}"; then status=1; echo "::error::shard $id failed (its output below)"; fi
          done
          for id in a b c; do
            echo "::group::shard $id"; cat "$RESULTS/shard-$CONFIG-$id.log"; echo "::endgroup::"
          done
          exit $status

      - name: Upload test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        # A storage timeout is not a test result.
        continue-on-error: true
        with:
          name: test-results-unit-${{ matrix.config.id }}
          path: ${{ env.RESULTS }}
          retention-days: 30

  # The whole solution must compile; the ASP.NET Core integration, Nino.Codegen in builds and nino-gen, and the
  # TypeScript runtime run here, beside the unit tests instead of after them.
  integrations:
    name: Integrations and code generation
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            ${{ vars.DOTNET_VERSION || '10.0.x' }}
            10.0.x
            8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-solution-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ runner.arch }}-solution-
            nuget-${{ runner.os }}-${{ runner.arch }}-

      # Nino.Codegen in builds: Node runs the generated TypeScript (type stripping, Node 22.18+) and tsc checks it;
      # scratch projects build with build/Nino.Codegen.targets for TypeScript, Go and Rust, and the old
      # NinoTypeScript* properties.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: current
          cache: npm
          cache-dependency-path: runtimes/typescript/package-lock.json

      # Go and Rust run the generated code against the bytes .NET writes (GoTests, RustTests; without them on the
      # PATH those tests are inconclusive). Set up as runtimes.yml does: go.mod's version, rustup's stable.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: runtimes/go/go.mod
          cache-dependency-path: runtimes/go/bench/go.sum

      - name: Set up Rust
        id: rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          echo "CARGO_TARGET_DIR=${{ runner.temp }}/nino-codegen-cargo" >> "$GITHUB_ENV"
          echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
          echo "rustc=$(rustc -V | cut -d' ' -f2-3 | tr -c 'A-Za-z0-9.\n-' '_')" >> "$GITHUB_OUTPUT"

      # Keyed by the compiler: a new stable cannot use the old one's builds.
      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/nino-codegen-cargo
          key: codegen-rust-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.rustc }}-${{ hashFiles('runtimes/rust/Cargo.lock') }}
          restore-keys: codegen-rust-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.rustc }}-

      - name: Build the solution
        run: dotnet build -c Debug

      # The ASP.NET Core integration, on both of its frameworks.
      - name: Test integrations
        run: >
          dotnet test tests/Nino.AspNetCore.Tests/Nino.AspNetCore.Tests.csproj --no-build -c Debug
          --logger trx --results-directory ./TestResults

      - name: Test Nino.Codegen in builds
        run: |
          npm install -g typescript@latest
          dotnet test tests/Nino.Codegen.Integration.Tests/Nino.Codegen.Integration.Tests.csproj --no-build -c Debug --logger trx --results-directory ./TestResults

      # nino-gen (src/Nino.Codegen): its model and command line, and the generated files under runtimes/ are what
      # it writes today (runtimes.yml compiles and runs them).
      - name: Test the code generator
        run: >
          dotnet test tests/Nino.Codegen.Tests/Nino.Codegen.Tests.csproj --no-build -c Debug
          --logger trx --results-directory ./TestResults

      # The TypeScript runtime on its own (runtimes/typescript/test): type checks, then node:test, the conformance
      # corpus over the generated code included.
      - name: Test the TypeScript runtime
        working-directory: ./runtimes/typescript
        env:
          NINO_CORPUS_REQUIRED: '1'
        run: |
          npm ci
          npm test

      - name: Upload test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        # A storage timeout is not a test result.
        continue-on-error: true
        with:
          name: test-results-integrations
          path: ./TestResults
          retention-days: 30

  # Nino.Core and generated code must stay trim and NativeAOT safe: Nino.AotTests is published both ways with every
  # trim/AOT warning an error (TreatWarningsAsErrors, TrimmerSingleWarn=false), then run; both runs must write the
  # same bytes.
  trim-aot:
    name: Trim and NativeAOT
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            ${{ vars.DOTNET_VERSION || '10.0.x' }}
            10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-aot-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ runner.arch }}-aot-
            nuget-${{ runner.os }}-${{ runner.arch }}-

      - name: Publish trimmed and NativeAOT
        run: |
          dotnet publish tests/Nino.AotTests/Nino.AotTests.csproj -c Release -r linux-x64 -p:NinoPublish=trim -o ./aot-tests/trim
          dotnet publish tests/Nino.AotTests/Nino.AotTests.csproj -c Release -r linux-x64 -p:NinoPublish=aot -o ./aot-tests/aot

      - name: Run
        run: |
          ./aot-tests/trim/Nino.AotTests | tee trim.txt
          ./aot-tests/aot/Nino.AotTests | tee aot.txt
          [ "$(grep 'payload sha256' trim.txt)" = "$(grep 'payload sha256' aot.txt)" ]

  # Nino.RuntimeTests on every runtime whose internals Nino reads or builds (CollectionViews, HashTables,
  # ConcurrentTables, SortedSetNodes, LinkedList nodes, ObjectTypes; Nino.Immutable's HashTrees and SortedTrees): each
  # must write the same bytes as .NET on x64, see the same contents through the public API, survive compacting
  # collections, and find every path meant for it (a layout that silently fell back to the public API fails). The
  # net472 build (Nino.Core netstandard2.0) runs on Mono (x64 and Arm64) and on .NET Framework 4.8, 64-bit and
  # 32-bit; the net10.0 build on .NET x64, Arm64, Windows x86 and Arm32 (qemu: GitHub has no Arm32 runner; it also
  # checks the Int128 layout, aligned to 8 there).
  runtime-tests:
    name: Runtime internals (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: mono, name: .NET and Mono, runner: ubuntu-26.04 }
          - { id: arm64, name: .NET and Mono on Arm64, runner: ubuntu-26.04-arm }
          - { id: arm32, name: .NET on Arm32 under qemu, runner: ubuntu-26.04 }
          - { id: framework, name: .NET Framework 4.8 and .NET on Windows, 64-bit and 32-bit, runner: windows-latest }

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            ${{ vars.DOTNET_VERSION || '10.0.x' }}
            10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-runtime-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ runner.arch }}-runtime-
            nuget-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Mono
        if: matrix.id == 'mono' || matrix.id == 'arm64'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mono-complete

      # The .NET runtime for linux-arm, run by qemu-user with the armhf C and C++ libraries.
      - name: Install qemu and .NET for Arm32
        if: matrix.id == 'arm32'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user libc6-armhf-cross libstdc++6-armhf-cross
          curl -sSfL https://dot.net/v1/dotnet-install.sh -o "$RUNNER_TEMP/dotnet-install.sh"
          bash "$RUNNER_TEMP/dotnet-install.sh" --runtime dotnet --channel 10.0 --architecture arm \
            --install-dir "$RUNNER_TEMP/dotnet-arm" --no-path

      # 32-bit .NET on Windows (x86: 8-byte fields aligned to 4), beside the 64-bit SDK.
      - name: Install .NET for x86
        if: matrix.id == 'framework'
        shell: pwsh
        run: |
          Invoke-WebRequest https://dot.net/v1/dotnet-install.ps1 -OutFile "$env:RUNNER_TEMP/dotnet-install.ps1"
          & "$env:RUNNER_TEMP/dotnet-install.ps1" -Runtime dotnet -Channel 10.0 -Architecture x86 `
            -InstallDir "$env:RUNNER_TEMP/dotnet-x86" -NoPath

      # 32-bit .NET Framework runs the same exe built for x86 (-p:NinoX86=true, its own output folder).
      - name: Build
        run: |
          dotnet build tests/Nino.RuntimeTests/Nino.RuntimeTests.csproj -c Release
          if [[ "${{ matrix.id }}" == framework ]]; then
            dotnet build tests/Nino.RuntimeTests/Nino.RuntimeTests.csproj -c Release -f net472 -p:NinoX86=true
          fi

      # Each runtime's output without its comment lines (where it keeps the fields) must equal .NET's.
      - name: Run
        env:
          BIN: tests/Nino.RuntimeTests/bin
        run: |
          set -uo pipefail
          status=0
          run() {
            local name=$1; shift
            echo "::group::$name"
            local code=0
            "$@" > "$name.txt" 2>&1 || code=$?  # the step's shell has -e: keep going to print the output
            cat "$name.txt"
            echo "::endgroup::"
            if (( code != 0 )) || ! grep -q '^ALL OK' "$name.txt"; then
              echo "::error::Nino.RuntimeTests failed on $name (exit $code)"
              status=1
            fi
          }
          compare() {
            if ! diff <(grep -v '^#' dotnet.txt) <(grep -v '^#' "$1.txt"); then
              echo "::error::$1 wrote other bytes or found other paths than .NET (diff above)"
              status=1
            fi
          }
          run dotnet dotnet "$BIN/Release/net10.0/Nino.RuntimeTests.dll"
          case "${{ matrix.id }}" in
            mono|arm64)
              run mono mono "$BIN/Release/net472/Nino.RuntimeTests.exe"
              compare mono
              # The GC checks the heap before every collection: objects made through Mono's internals must be
              # what it expects.
              MONO_GC_DEBUG=verify-before-collections run mono-gc-verify mono "$BIN/Release/net472/Nino.RuntimeTests.exe"
              compare mono-gc-verify
              ;;
            arm32)
              # W^X off: the runtime writes code through a second mapping of its pages, which qemu-user does not see
              # as a change to the code it translated (dynamic methods then crash). Suspension by signal off: qemu
              # (8.2 and 10.2) delivers the runtime's GC suspension signal at an odd Thumb address now and then and
              # aborts (thumb_tr_translate_insn assertion, in about one run in four); the runtime then suspends
              # threads at its safe points only.
              DOTNET_EnableWriteXorExecute=0 DOTNET_INTERNAL_ThreadSuspendInjection=0 DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1 \
                run arm32 qemu-arm -L /usr/arm-linux-gnueabihf "$RUNNER_TEMP/dotnet-arm/dotnet" \
                "$BIN/Release/net10.0/Nino.RuntimeTests.dll"
              grep -q '^# 64-bit: False' arm32.txt || { echo "::error::not a 32-bit process"; status=1; }
              compare arm32
              ;;
            framework)
              run framework "$BIN/Release/net472/Nino.RuntimeTests.exe"
              grep -q '^# 64-bit: True, runtime: .NET Framework' framework.txt ||
                { echo "::error::not 64-bit .NET Framework"; status=1; }
              compare framework
              run framework-x86 "$BIN/x86/Release/net472/Nino.RuntimeTests.exe"
              grep -q '^# 64-bit: False, runtime: .NET Framework' framework-x86.txt ||
                { echo "::error::not 32-bit .NET Framework"; status=1; }
              compare framework-x86
              run dotnet-x86 "$(cygpath -u "$RUNNER_TEMP")/dotnet-x86/dotnet.exe" "$BIN/Release/net10.0/Nino.RuntimeTests.dll"
              grep -q '^# 64-bit: False, runtime: .NET 10' dotnet-x86.txt || { echo "::error::not 32-bit .NET"; status=1; }
              compare dotnet-x86
              ;;
          esac
          exit $status

  # The one check to require: fails if any configuration failed (Unity runs in unity.yml, one seat at a time),
  # or if the shards of a unit test configuration together did not run the whole suite.
  build-test:
    name: Build and Test
    runs-on: ubuntu-26.04
    needs: [ unit-tests, integrations, trim-aot, runtime-tests ]
    # Not when the run itself was cancelled (a newer push supersedes it): its cancelled jobs are not failures.
    if: ${{ !cancelled() }}
    timeout-minutes: 10
    steps:
      - name: Check results
        run: |
          echo "unit tests: ${{ needs.unit-tests.result }}, integrations: ${{ needs.integrations.result }}, trim/AOT: ${{ needs.trim-aot.result }}, runtime internals: ${{ needs.runtime-tests.result }}"
          [ "${{ needs.unit-tests.result }}" = success ] || exit 1
          [ "${{ needs.integrations.result }}" = success ] || exit 1
          [ "${{ needs.trim-aot.result }}" = success ] || exit 1
          [ "${{ needs.runtime-tests.result }}" = success ] || exit 1

      - name: Checkout the scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Download the unit test results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        # The uploads may have failed on a storage timeout: the check below then warns about the missing shards (each
        # shard checked its own part already).
        continue-on-error: true
        with:
          pattern: test-results-unit-*
          path: unit-results
          # Each configuration's artifact holds a directory per shard: merged, they sit side by side.
          merge-multiple: true

      - name: Check every test ran
        run: python3 .github/scripts/test_shards.py unit-results

      - name: Merge test results
        uses: actions/upload-artifact/merge@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        continue-on-error: true
        with:
          name: test-results-${{ github.run_number }}
          pattern: test-results-*
          delete-merged: true
          retention-days: 30

  # Run benchmarks on PRs only
  benchmark:
    name: Run Benchmarks (${{ matrix.classes }})
    runs-on: ubuntu-26.04
    # Independent of the tests, so it runs beside them. A quick signal (ShortRun, Nino against MemoryPack); the full,
    # published numbers come from report.yml on release. The classes run in parallel, as in report.yml.
    if: github.event_name == 'pull_request'
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        classes: [ SimpleTest PooledTest, CommonTypesTest FixedSizeTest GenericPolymorphicTest, PolymorphicTest VersionTolerantTest BclTypesTest, CollectionsTest ReferenceTest PooledGraphTest ]
    permissions:
      contents: read
      pull-requests: write

    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            ${{ vars.DOTNET_VERSION || '10.0.x' }}
            10.0.x
            8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-benchmark-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ runner.arch }}-benchmark-
            nuget-${{ runner.os }}-${{ runner.arch }}-

      - name: Build benchmark project
        run: |
          cd benchmarks/Nino.Benchmark
          dotnet build -c Release
          # Every case reads back what the others read and writes its payload's bytes (Verify.cs).
          dotnet run -c Release --no-build -- --verify

      - name: Run benchmarks
        run: |
          cd benchmarks/Nino.Benchmark
          echo "Running benchmarks for PR #${{ github.event.pull_request.number }}..."
          FILTERS=()
          for CLASS in ${{ matrix.classes }}; do FILTERS+=("*.$CLASS.Nino*" "*.$CLASS.MemoryPack*"); done
          dotnet run -c Release --no-build -- --filter "${FILTERS[@]}"

          # Verify benchmark results exist (check for any github markdown file)
          MARKDOWN_FILE=$(find BenchmarkDotNet.Artifacts/results -name "*-report-github.md" -type f 2>/dev/null | head -n1)
          if [[ -n "$MARKDOWN_FILE" && -f "$MARKDOWN_FILE" ]]; then
            echo "✅ Benchmark completed successfully - found report file:"
            echo "$MARKDOWN_FILE"
          else
            echo "❌ Benchmark results not found"
            echo "Looking for markdown files in results directory..."
            find BenchmarkDotNet.Artifacts -name "*.md" -type f || echo "No markdown files found"
            exit 1
          fi

      - name: Upload benchmark results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: benchmark-results-pr-${{ github.event.pull_request.number }}-${{ strategy.job-index }}
          path: benchmarks/Nino.Benchmark/**/BenchmarkDotNet.Artifacts/results
          retention-days: 30
