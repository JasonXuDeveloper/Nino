name: CI - Build and Test

on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - 'src/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ "main", "develop" ]
    paths:
      - 'src/**'
      - '.github/workflows/ci.yml'
  workflow_call:

# Security: Minimal required permissions
permissions:
  contents: read        # Read repository contents
  actions: write        # Upload artifacts
  pull-requests: read   # Read PR context
  checks: write         # Write test results

# Prevent concurrent runs of the same workflow only when CI actually runs
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Set global defaults
defaults:
  run:
    working-directory: ./src

jobs:
  # The test configurations run side by side, each on its own runner: building is ~20 s, so each job builds what
  # it tests instead of waiting on a shared build. "Build and Test" collects their results and fails if any failed.
  unit-tests:
    name: Unit tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # net8.0 and net10.0 builds of Nino.Core compile the same code (no NET10-only paths): run it once, on .NET 10,
          # with the Roslyn 4.12 generator (interceptors on).
          - name: net10.0
            framework: net10.0
            properties: ''
            coverage: true
            # This one builds the whole solution, so every project still has to compile.
            project: ''
          # What Unity and older compilers run: Nino.Core netstandard2.1, regular calls instead of interceptors.
          - name: netstandard2.1 without interceptors
            framework: net8.0
            properties: -p:NinoCoreTfm=netstandard2.1 -p:NinoRegularCalls=true
            coverage: false
            project: Nino.UnitTests/Nino.UnitTests.csproj
          # The .NET 8 SDK's preview interceptor attribute: Nino.Core netstandard2.0, the Roslyn 4.8 generator.
          # Each Nino.Core build is checked against the pinned bytes of GoldenBytesTests.
          - name: netstandard2.0 with Roslyn 4.8
            framework: net8.0
            properties: -p:NinoCoreTfm=netstandard2.0 -p:NinoGeneratorBuild=4.8
            coverage: false
            project: Nino.UnitTests/Nino.UnitTests.csproj

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            ${{ vars.DOTNET_VERSION || '10.0.x' }}
            10.0.x
            8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Build
        run: >
          dotnet build ${{ matrix.project }} -c Debug
          ${{ matrix.project && format('-f {0}', matrix.framework) || '' }} ${{ matrix.properties }}

      - name: Test
        run: >
          dotnet test Nino.UnitTests/Nino.UnitTests.csproj --no-build -c Debug -f ${{ matrix.framework }}
          ${{ matrix.properties }} --logger trx --results-directory ./TestResults
          ${{ matrix.coverage && '--collect:"XPlat Code Coverage"' || '' }}

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ strategy.job-index }}
          path: ./src/TestResults
          retention-days: 30

  unity-tests:
    name: Unity tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Skip Unity tests for external PRs (secrets not available in forks)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            ${{ vars.DOTNET_VERSION || '10.0.x' }}
            10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Build the DLLs Unity loads
        run: |
          dotnet build Nino.Core/Nino.Core.csproj -c Debug -f netstandard2.1
          dotnet build Nino.Generator/Nino.Generator.csproj -c Debug
          cp ./Nino.Core/bin/Debug/netstandard2.1/Nino.Core.dll ./Nino.Unity/Packages/com.jasonxudeveloper.nino/Runtime/Nino.Core.dll
          # The Roslyn 4.3 build: Unity's compiler cannot load the 4.12 one.
          cp ./Nino.Generator/bin/Debug/netstandard2.0/Nino.Generator.dll ./Nino.Unity/Packages/com.jasonxudeveloper.nino/Runtime/Nino.Generator.dll

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: src/Nino.Unity/Library
          key: Library-Nino-${{ runner.os }}-${{ hashFiles('src/Nino.Unity/Assets/**', 'src/Nino.Unity/Packages/**', 'src/Nino.Unity/ProjectSettings/**') }}
          restore-keys: |
            Library-Nino-${{ runner.os }}-
            Library-Nino-
            Library-

      - name: Run Unity tests
        uses: game-ci/unity-test-runner@v4
        id: unity-tests
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: ./src/Nino.Unity
          testMode: editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          unityVersion: '2022.3.51f1'

      - name: Upload Unity results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-unity
          path: |
            ./artifacts
            ${{ steps.unity-tests.outputs.coveragePath }}
          retention-days: 30

  # The one check to require: fails if any configuration failed (a skipped Unity run, on fork PRs, is not a failure).
  build-test:
    name: Build and Test
    runs-on: ubuntu-latest
    needs: [ unit-tests, unity-tests ]
    # Not when the run itself was cancelled (a newer push supersedes it): its cancelled jobs are not failures.
    if: ${{ !cancelled() }}
    steps:
      - name: Merge test results
        uses: actions/upload-artifact/merge@v4
        if: always()
        continue-on-error: true
        with:
          name: test-results-${{ github.run_number }}
          pattern: test-results-*
          delete-merged: true
          retention-days: 30

      - name: Check results
        working-directory: .
        run: |
          echo "unit tests: ${{ needs.unit-tests.result }}, Unity tests: ${{ needs.unity-tests.result }}"
          [ "${{ needs.unit-tests.result }}" = success ] || exit 1
          case "${{ needs.unity-tests.result }}" in success|skipped) ;; *) exit 1 ;; esac

  # Run benchmarks on PRs only
  benchmark:
    name: Run Benchmarks
    runs-on: ubuntu-latest
    # Independent of the tests, so it runs beside them. A quick signal (ShortRun, Nino against MemoryPack); the full,
    # published numbers come from report.yml on release.
    if: github.event_name == 'pull_request'
    timeout-minutes: 180
    permissions:
      contents: read
      pull-requests: write

    defaults:
      run:
        working-directory: ./src

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            ${{ vars.DOTNET_VERSION || '10.0.x' }}
            10.0.x
            8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-benchmark-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore

      - name: Build benchmark project
        run: |
          cd Nino.Benchmark
          dotnet build -c Release

      - name: Run benchmarks
        run: |
          cd Nino.Benchmark
          echo "Running benchmarks for PR #${{ github.event.pull_request.number }}..."
          dotnet run -c Release --no-build -- --filter '*Test.Nino*' '*Test.MemoryPack*'

          # Verify benchmark results exist (check for any github markdown file)
          MARKDOWN_FILE=$(find BenchmarkDotNet.Artifacts/results -name "*-report-github.md" -type f 2>/dev/null | head -n1)
          if [[ -n "$MARKDOWN_FILE" && -f "$MARKDOWN_FILE" ]]; then
            echo "✅ Benchmark completed successfully - found report file:"
            echo "$MARKDOWN_FILE"
          else
            echo "❌ Benchmark results not found"
            echo "Looking for markdown files in results directory..."
            find BenchmarkDotNet.Artifacts -name "*.md" -type f || echo "No markdown files found"
            exit 1
          fi

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results-pr-${{ github.event.pull_request.number }}
          path: src/Nino.Benchmark/**/BenchmarkDotNet.Artifacts/results
          retention-days: 30
