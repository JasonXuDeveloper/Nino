name: CI - Build and Test

on:
  push:
    branches: [ "main" ]
    # Everything a job here builds or runs (the solution, the runtimes the integrations job tests, the scripts).
    paths: &paths
      - 'src/**'
      # The Unity project is unity.yml's, but for the raw-layout fixtures Nino.RuntimeTests links from it and the
      # package's DLLs, whose public API UnityPackageDllTests compares with their sources.
      - '!src/Nino.Unity/**'
      - 'src/Nino.Unity/Assets/Test/Runtime/BclFixture*.cs'
      - 'src/Nino.Unity/Packages/com.jasonxudeveloper.nino/Runtime/*.dll'
      - 'tests/**'
      - 'tools/**'
      - 'runtimes/**'
      - 'benchmarks/Nino.Benchmark/**'
      - 'benchmarks/Nino.GeneratorBenchmark/**'
      - '.editorconfig'
      - 'Directory.Build.props'
      - 'src/Directory.Build.targets'
      - 'Directory.Packages.props'
      - 'Nino.slnx'
      - 'global.json'
      - 'nuget.config'
      - '.github/workflows/ci.yml'
      - '.github/actions/setup-dotnet/**'
      - '.github/actions/apt-install/**'
      - '.github/scripts/test_shards.py'
      - '.github/scripts/has_avx512.sh'
      - '!**/AGENTS.md'      # agent instructions only: nothing to build or test
      - '!**/CLAUDE.md'
      - '!tools/agents.sh'   # checked by agents.yml
  pull_request:
    branches: [ "main" ]
    paths: *paths
  workflow_dispatch:

# Read only: the jobs upload artifacts with the runner's own token, and post nothing to checks or pull requests.
permissions:
  contents: read

# Prevent concurrent runs of the same workflow only when CI actually runs
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Bash with -e and -o pipefail for every run step, Windows included: a command piped into tee, grep or sed fails its
# step when it fails (the trimmed and NativeAOT runs of Nino.AotTests were piped into tee, and only their hashes were
# compared).
defaults:
  run:
    shell: bash

# The .NET CLI's banner, telemetry and first-run setup are noise and time in CI.
env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'

jobs:
  # Every configuration runs the whole unit test suite in three shards, side by side on one runner: the ShapeMatrix
  # rows compile some 70 shapes each and take two thirds of the suite's time, so each half of them is a shard, and
  # everything else the third. A shard takes about one and a half of the runner's four vCPUs (Roslyn), so the three
  # together take about as long as the longest alone did on a runner of its own, without a runner (and a build) per
  # shard: those 27 runners took most of the account's 40 concurrent jobs, and the other workflows' jobs waited behind
  # them. Each shard runs its own copy of the build output (the coverage collector instruments the assemblies in
  # place). The shards' filters are complements of each other, each shard checks it ran every test its filter lists,
  # and "Build and Test" checks that the shards of each configuration together ran every test of the suite
  # (.github/scripts/test_shards.py). Windows runners are slower: there the three shards took three minutes, the
  # longest job of the workflow, so its shards are split over two runners (a and b, then c), each building on its own.
  unit-tests:
    name: Unit tests (${{ matrix.config.name }})
    runs-on: ${{ matrix.config.runner || 'ubuntu-26.04' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        config:
          # The Roslyn 4.12 generator (interceptors on).
          - id: net10
            name: net10.0
            framework: net10.0
            coverage: true
            vector512: true
          # The .NET 11 runtime (Nino.Core's net10.0 build): its runtime-internal fast paths (ConcurrentStackNodes)
          # are proven by tests that run on it, so each new .NET joins here when it ships.
          - id: net11
            name: net11.0
            framework: net11.0
            net11: true
          # What Unity and older compilers run: Nino.Core netstandard2.1, regular calls instead of interceptors.
          - id: ns21
            name: netstandard2.1 without interceptors
            framework: net8.0
            properties: -p:NinoCoreTfm=netstandard2.1 -p:NinoRegularCalls=true
          # Arm64: its byte shuffle (tbl), 16-byte vectors only, and the net8.0 build's own shuffle path. The net8.0
          # run also takes the Roslyn 4.8 generator (the .NET 8 SDK's preview interceptor attribute). Each Nino.Core
          # build is checked against the pinned bytes of GoldenBytesTests.
          - id: arm64-net10
            name: net10.0 on Arm64
            runner: ubuntu-26.04-arm
            framework: net10.0
          - id: arm64-net8
            name: net8.0 on Arm64 with Roslyn 4.8
            runner: ubuntu-26.04-arm
            framework: net8.0
            properties: -p:NinoGeneratorBuild=4.8
          # x64 CPUs without AVX-512 (most desktops: 32-byte vectors, no byte permute), and without any SIMD.
          - id: no-avx512
            name: net10.0 without AVX-512
            framework: net10.0
            avx512: '0'
            avx512paths: true
          # Older x64 CPUs (SSSE3, no AVX2): 16-byte vectors, two shuffles a vector where Arm64 has one table lookup.
          - id: no-avx2
            name: net10.0 without AVX2
            framework: net10.0
            avx2: '0'
            avx512paths: true
          - id: no-simd
            name: net10.0 without SIMD
            framework: net10.0
            simd: '0'
            avx512paths: true
          # Windows: its paths, file system and line endings. A contributor's analyzer test failed there (PR #203)
          # while every Linux job passed.
          - id: windows
            name: net10.0 on Windows, shards a and b
            runner: windows-latest
            framework: net10.0
            shards: a b
            part: -1
          - id: windows
            name: net10.0 on Windows, shard c
            runner: windows-latest
            framework: net10.0
            shards: c
            part: -2
    env:
      PROJECT: tests/Nino.UnitTests/Nino.UnitTests.csproj
      CONFIG: ${{ matrix.config.id }}
      # The shards this runner runs (all three but on Windows).
      SHARDS: ${{ matrix.config.shards || 'a b c' }}
      FRAMEWORK: ${{ matrix.config.framework }}
      PROPERTIES: ${{ matrix.config.properties }}
      # Relative to the workspace: Git Bash on Windows and dotnet agree on it.
      RESULTS: TestResults
      # MSTest filters (VSTest syntax, parentheses escaped). b and c split ShapeMatrixTests' rows; c is the complement
      # of b, so a row added to the matrix lands in c, and a is the complement of both.
      FILTER_A: FullyQualifiedName!~ShapeMatrixTests
      FILTER_B: >-
        FullyQualifiedName~ShapeMatrixTests&(Name~\(0\)|Name~\(1\)|Name~\(2\)|Name~\(3\)|Name~\(4\)|Name~\(5\)|Name~\(6\)|Name~\(7\))
      FILTER_C: >-
        FullyQualifiedName~ShapeMatrixTests&Name!~\(0\)&Name!~\(1\)&Name!~\(2\)&Name!~\(3\)&Name!~\(4\)&Name!~\(5\)&Name!~\(6\)&Name!~\(7\)

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet
        with:
          net8: true
          net11: ${{ matrix.config.net11 || false }}
          cache: ${{ runner.os == 'Windows' && 'unit-tests' || '' }}

      # The build, and a copy of its output per shard next to it (tests find the repository by walking up from it).
      - name: Build
        run: |
          read -ra props <<< "$PROPERTIES"
          dotnet build "$PROJECT" -c Debug -f "$FRAMEWORK" "${props[@]}"
          out=$(dirname "$PROJECT")/bin/Debug
          for shard in $SHARDS; do cp -R "$out/$FRAMEWORK" "$out/shard-$shard"; done

      # Each shard writes its results to $RESULTS/test-results-unit-<config>-<shard> (the layout test_shards.py reads)
      # and its output to a file, printed when all have ended. Then each checks it ran every test its filter
      # selects (and some); shard a also writes the list of the whole suite, which "Build and Test" compares with what
      # the three shards ran.
      - name: Test
        env:
          DOTNET_EnableAVX512: ${{ matrix.config.avx512 || '1' }}
          DOTNET_EnableAVX2: ${{ matrix.config.avx2 || '1' }}
          DOTNET_EnableHWIntrinsic: ${{ matrix.config.simd || '1' }}
          COVERAGE: ${{ matrix.config.coverage && '--collect:XPlat Code Coverage' || '' }}
        run: |
          set -uo pipefail
          read -ra props <<< "$PROPERTIES"
          shard() {
            local id=$1 filter=$2
            local dir="$RESULTS/test-results-unit-$CONFIG-$id"
            # OutDir is relative to the project: the shard's copy of the build output.
            local run=(dotnet test "$PROJECT" --no-build -c Debug -f "$FRAMEWORK" "${props[@]}" -p:OutDir="bin/Debug/shard-$id/")
            # One test class at a time per shard: the three shards already share the runner's four vCPUs, and the
            # suite's class-level parallelism (MSTestSettings.cs) would put three ~3.5 GB processes on 16 GB.
            "${run[@]}" --filter "$filter" --logger "trx;LogFileName=unit.trx" --results-directory "$dir" \
              ${COVERAGE:+"$COVERAGE"} -- MSTest.Parallelize.Workers=1 || return 1
            local listed ran
            listed=$("${run[@]}" --list-tests --filter "$filter" | grep -c '^    ' || true)
            ran=$(grep -o '<UnitTestResult ' "$dir/unit.trx" | wc -l)
            echo "shard $id: listed $listed, ran $ran"
            if (( listed == 0 || ran != listed )); then
              echo "::error::shard $id ran $ran tests, its filter lists $listed"
              return 1
            fi
            if [[ $id == a ]]; then "${run[@]}" --list-tests > "$dir/suite.txt"; fi
          }
          mkdir -p "$RESULTS"
          declare -A pid filters=([a]="$FILTER_A" [b]="$FILTER_B" [c]="$FILTER_C")
          for id in $SHARDS; do
            shard "$id" "${filters[$id]}" > "$RESULTS/shard-$CONFIG-$id.log" 2>&1 & pid[$id]=$!
          done
          status=0
          for id in $SHARDS; do
            if ! wait "${pid[$id]}"; then status=1; echo "::error::shard $id failed (its output below)"; fi
          done
          for id in $SHARDS; do
            echo "::group::shard $id"; cat "$RESULTS/shard-$CONFIG-$id.log"; echo "::endgroup::"
          done
          exit $status

      # Vector<T> at its third width, 64 bytes (16 with AVX2 off is no-avx2's, 32 the default): its tests only, a few
      # seconds, where the runner's CPU has AVX-512 (GitHub's x64 runners are Xeons with it or EPYC 7763s without).
      - name: Test Vector<T> at 512 bits
        if: matrix.config.vector512
        env:
          DOTNET_MaxVectorTBitWidth: '512'
        run: |
          if ! .github/scripts/has_avx512.sh; then
            echo "::notice::no AVX-512 on this runner: Vector<T> at 512 bits not tested"
            exit 0
          fi
          dotnet test "$PROJECT" --no-build -c Debug -f "$FRAMEWORK" --filter 'FullyQualifiedName~VectorTTests'

      # The net10.0 build's AVX-512 paths (VBMI byte permutes, 64-byte block copies and masks) run in the net10 job
      # only when its runner is a Xeon, about half the runs (the EPYC 7763s have no AVX-512, and that job then repeats
      # no-avx512's). The jobs that turn an instruction set off run the tests of those paths again with every set on
      # when their runner has AVX-512 (seconds): a run misses them only when all four land on EPYCs.
      - name: Test the AVX-512 paths
        if: matrix.config.avx512paths
        env:
          FILTER_AVX512: >-
            FullyQualifiedName~BlockStructTests|FullyQualifiedName~CollectionFastPathTests|FullyQualifiedName~ArraySerializationTests|FullyQualifiedName~TopLevelFastPathTests|FullyQualifiedName~RawStructTests|FullyQualifiedName~BclStructLayoutTests|FullyQualifiedName~StringEncodingTests|FullyQualifiedName~Utf8WireTests|FullyQualifiedName~GoldenBytesTests|FullyQualifiedName~VectorTTests
        run: |
          if ! .github/scripts/has_avx512.sh; then
            echo "::notice::no AVX-512 on this runner: the AVX-512 paths are tested only if another job's runner has it"
            exit 0
          fi
          dotnet test "$PROJECT" --no-build -c Debug -f "$FRAMEWORK" --filter "$FILTER_AVX512"

      - name: Upload test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        # A storage timeout is not a test result.
        continue-on-error: true
        with:
          name: test-results-unit-${{ matrix.config.id }}${{ matrix.config.part }}
          path: ${{ env.RESULTS }}
          retention-days: 30

  # The whole solution must compile; the ASP.NET Core integration, Nino.Codegen in builds, nino-gen, the conformance
  # corpus and the benchmark cases are checked here, beside the unit tests instead of after them. (The TypeScript
  # runtime's own tests run in runtimes.yml.)
  integrations:
    name: Integrations and code generation
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet
        with:
          net8: true

      # Nino.Codegen in builds: Node runs the generated TypeScript (type stripping, Node 22.18+) and tsc checks it;
      # scratch projects build with build/Nino.Codegen.targets for TypeScript, Go and Rust, and the old
      # NinoTypeScript* properties.
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: current
          cache: npm
          cache-dependency-path: runtimes/typescript/package-lock.json

      # Go and Rust run the generated code against the bytes .NET writes (GoTests, RustTests; without them on the
      # PATH those tests are inconclusive): the oldest Go go.mod allows, and stable Rust.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: runtimes/go/go.mod
          cache-dependency-path: runtimes/go/bench/go.sum

      - name: Set up Rust
        id: rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-08
        with:
          toolchain: stable

      # The scratch projects the tests generate build into one target directory, cached here (Swatinem/rust-cache
      # needs a Cargo workspace in the checkout; these are written by the tests). Keyed by the compiler: a new stable
      # cannot use the old one's builds.
      - name: Rust target directory
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/nino-codegen-cargo" >> "$GITHUB_ENV"

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/nino-codegen-cargo
          key: codegen-rust-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('runtimes/rust/Cargo.lock') }}
          restore-keys: codegen-rust-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.cachekey }}-

      - name: Build the solution
        run: dotnet build -c Debug

      # The ASP.NET Core integration, on both of its frameworks.
      - name: Test integrations
        run: >
          dotnet test tests/Nino.AspNetCore.Tests/Nino.AspNetCore.Tests.csproj --no-build -c Debug
          --logger trx --results-directory ./TestResults

      # The TypeScript runtime's own dependencies (package-lock.json), and its tsc on the PATH for the tests below.
      - name: Install the TypeScript runtime's dependencies
        working-directory: ./runtimes/typescript
        run: |
          npm ci
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Test Nino.Codegen in builds
        run: |
          dotnet test tests/Nino.Codegen.Integration.Tests/Nino.Codegen.Integration.Tests.csproj --no-build -c Debug --logger trx --results-directory ./TestResults

      # nino-gen (src/Nino.Codegen): its model and command line, and the generated files under runtimes/ are what
      # it writes today. With the corpus check below, this is what keeps the inputs of runtimes.yml true to .NET:
      # that workflow runs only when runtimes/ or the corpus change, and tests the runtimes against those files.
      - name: Test the code generator
        run: >
          dotnet test tests/Nino.Codegen.Tests/Nino.Codegen.Tests.csproj --no-build -c Debug
          --logger trx --results-directory ./TestResults

      # .NET still reads the committed corpus as recorded, and writing it again changes nothing
      # (tests/conformance/README.md).
      - name: Check the conformance corpus
        if: ${{ !cancelled() }}
        run: |
          dotnet run --project tests/conformance/Nino.Conformance --no-build -c Debug -- --verify tests/conformance/corpus
          dotnet run --project tests/conformance/Nino.Conformance --no-build -c Debug -- --out "$RUNNER_TEMP/corpus"
          if ! diff -r tests/conformance/corpus "$RUNNER_TEMP/corpus" > "$RUNNER_TEMP/corpus.diff"; then
            head -c 20000 "$RUNNER_TEMP/corpus.diff"
            echo "::error::tests/conformance/corpus is out of date: run" \
              "'dotnet run --project tests/conformance/Nino.Conformance -c Release -- --out tests/conformance/corpus' and commit it."
            exit 1
          fi

      # Every benchmark case reads back what the others read and writes its payload's bytes (Verify.cs), on every
      # push: report.yml runs it first on each shard, where a failure showed only at a release. The Arm64 runtime
      # internals job runs it on Arm64.
      - name: Check the benchmark cases
        if: ${{ !cancelled() }}
        run: dotnet benchmarks/Nino.Benchmark/bin/Debug/net10.0/Nino.Benchmark.dll --verify

      - name: Upload test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        # A storage timeout is not a test result.
        continue-on-error: true
        with:
          name: test-results-integrations
          path: ./TestResults
          retention-days: 30

  # Nino.RuntimeTests on every runtime whose internals Nino reads or builds (CollectionViews, HashTables,
  # ConcurrentTables, SortedSetNodes, LinkedList nodes, ObjectTypes; Nino.Immutable's HashTrees and SortedTrees): each
  # must write the same bytes as .NET on x64, see the same contents through the public API, survive compacting
  # collections, and find every path meant for it (a layout that silently fell back to the public API fails). The
  # net472 build (Nino.Core and Nino.Immutable netstandard2.1, compiled against Mono's class libraries) runs on Mono
  # (x64 and Arm64); the net10.0 build on .NET x64, Arm64, Windows x64 and x86, and Arm32 (qemu: GitHub has no Arm32
  # runner; it also checks the Int128 layout, aligned to 8 there).
  # The x64 Linux runner also publishes Nino.AotTests trimmed and NativeAOT: Nino.Core and generated code must stay
  # trim and NativeAOT safe, every trim/AOT warning an error (TreatWarningsAsErrors, TrimmerSingleWarn=false), and
  # both runs must write the same bytes. One runner for the three short Linux x64 checks instead of three (about a
  # minute each, mostly setup): a push starts more jobs than the account runs at once, and each runner here was one
  # the unit tests waited for.
  runtime-tests:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: linux, name: 'Runtime internals (.NET, Mono, Arm32 under qemu), trim and NativeAOT', runner: ubuntu-26.04 }
          - { id: arm64, name: Runtime internals (.NET and Mono on Arm64), runner: ubuntu-26.04-arm }
          - { id: windows, name: 'Runtime internals (.NET on Windows, 64-bit and 32-bit)', runner: windows-latest }

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet
        with:
          cache: ${{ matrix.id == 'windows' && 'runtime-tests' || '' }}

      - name: Install Mono
        if: matrix.id == 'arm64'
        uses: ./.github/actions/apt-install
        with:
          packages: --no-install-recommends mono-complete

      # Mono, and the .NET runtime for linux-arm, run by qemu-user with the armhf C and C++ libraries.
      - name: Install Mono and qemu for Arm32
        if: matrix.id == 'linux'
        uses: ./.github/actions/apt-install
        with:
          packages: --no-install-recommends mono-complete qemu-user libc6-armhf-cross libstdc++6-armhf-cross
      - name: Install .NET for Arm32
        if: matrix.id == 'linux'
        run: |
          # The exact version of the runner's own .NET 10 runtime: with one, dotnet-install skips aka.ms, whose download
          # host can be down (it answered 409 for hours in October 2026) while the feeds still serve the files.
          version="$(dotnet --list-runtimes | awk '$1 == "Microsoft.NETCore.App" && $2 ~ /^10\./ { v = $2 } END { print v }')"
          curl -sSfL https://dot.net/v1/dotnet-install.sh -o "$RUNNER_TEMP/dotnet-install.sh"
          bash "$RUNNER_TEMP/dotnet-install.sh" --runtime dotnet --version "$version" --architecture arm \
            --install-dir "$RUNNER_TEMP/dotnet-arm" --no-path

      # 32-bit .NET on Windows (x86: 8-byte fields aligned to 4), beside the 64-bit SDK.
      - name: Install .NET for x86
        if: matrix.id == 'windows'
        shell: pwsh
        run: |
          # The runner's own .NET 10 runtime version: an exact version keeps dotnet-install off aka.ms (see the Arm32 step).
          $version = (dotnet --list-runtimes | Select-String '^Microsoft\.NETCore\.App (10\.\S+)' | Select-Object -Last 1).Matches[0].Groups[1].Value
          Invoke-WebRequest https://dot.net/v1/dotnet-install.ps1 -OutFile "$env:RUNNER_TEMP/dotnet-install.ps1"
          & "$env:RUNNER_TEMP/dotnet-install.ps1" -Runtime dotnet -Version $version -Architecture x86 `
            -InstallDir "$env:RUNNER_TEMP/dotnet-x86" -NoPath

      # The net472 build only where Mono is installed (the project looks for its class libraries).
      - name: Build
        run: dotnet build tests/Nino.RuntimeTests/Nino.RuntimeTests.csproj -c Release

      # Each runtime's output without its comment lines (where it keeps the fields) must equal .NET's.
      - name: Run
        env:
          BIN: tests/Nino.RuntimeTests/bin
        run: |
          set -uo pipefail
          status=0
          run() {
            local name=$1; shift
            echo "::group::$name"
            local code=0
            "$@" > "$name.txt" 2>&1 || code=$?  # the step's shell has -e: keep going to print the output
            cat "$name.txt"
            echo "::endgroup::"
            if (( code != 0 )) || ! grep -q '^ALL OK' "$name.txt"; then
              echo "::error::Nino.RuntimeTests failed on $name (exit $code)"
              status=1
            fi
          }
          compare() {
            if ! diff <(grep -v '^#' dotnet.txt) <(grep -v '^#' "$1.txt"); then
              echo "::error::$1 wrote other bytes or found other paths than .NET (diff above)"
              status=1
            fi
          }
          run dotnet dotnet "$BIN/Release/net10.0/Nino.RuntimeTests.dll"
          case "${{ matrix.id }}" in
            linux|arm64)
              run mono mono "$BIN/Release/net472/Nino.RuntimeTests.exe"
              compare mono
              # The GC checks the heap before every collection: objects made through Mono's internals must be
              # what it expects.
              MONO_GC_DEBUG=verify-before-collections run mono-gc-verify mono "$BIN/Release/net472/Nino.RuntimeTests.exe"
              compare mono-gc-verify
              ;;
          esac
          case "${{ matrix.id }}" in
            linux)
              # Vector<T> at 64 bytes where the CPU has AVX-512 (the refusals, LaneParticle, the same bytes).
              if .github/scripts/has_avx512.sh; then
                DOTNET_MaxVectorTBitWidth=512 run vector512 dotnet "$BIN/Release/net10.0/Nino.RuntimeTests.dll"
                grep -q '^# Vector<float>.Count 16$' vector512.txt ||
                  { echo "::error::DOTNET_MaxVectorTBitWidth=512 did not make Vector<float> 16 lanes"; status=1; }
                compare vector512
              else
                echo "::notice::no AVX-512 on this runner: Vector<T> at 512 bits not run"
              fi
              # W^X off: the runtime writes code through a second mapping of its pages, which qemu-user does not see
              # as a change to the code it translated (dynamic methods then crash). Suspension by signal off: qemu
              # (8.2 and 10.2) delivers the runtime's GC suspension signal at an odd Thumb address now and then and
              # aborts (thumb_tr_translate_insn assertion, in about one run in four); the runtime then suspends
              # threads at its safe points only.
              DOTNET_EnableWriteXorExecute=0 DOTNET_INTERNAL_ThreadSuspendInjection=0 DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1 \
                run arm32 qemu-arm -L /usr/arm-linux-gnueabihf "$RUNNER_TEMP/dotnet-arm/dotnet" \
                "$BIN/Release/net10.0/Nino.RuntimeTests.dll"
              grep -q '^# 64-bit: False' arm32.txt || { echo "::error::not a 32-bit process"; status=1; }
              compare arm32
              ;;
            windows)
              run dotnet-x86 "$(cygpath -u "$RUNNER_TEMP")/dotnet-x86/dotnet.exe" "$BIN/Release/net10.0/Nino.RuntimeTests.dll"
              grep -q '^# 64-bit: False, runtime: .NET 10' dotnet-x86.txt || { echo "::error::not 32-bit .NET"; status=1; }
              compare dotnet-x86
              ;;
          esac
          exit $status

      # The benchmark cases on Arm64 (the integrations job checks them on x64): each Arm64 shard of report.yml runs
      # this first, and v4.0.0-rc.8's failed in all ten (a probe's setup called x86's CpuId; run 41853674050), which
      # no x64 run catches: DOTNET_EnableHWIntrinsic=0 leaves X86Base supported.
      - name: Check the benchmark cases on Arm64
        if: ${{ matrix.id == 'arm64' && !cancelled() }}
        run: |
          dotnet build benchmarks/Nino.Benchmark/Nino.Benchmark.csproj -c Release
          dotnet benchmarks/Nino.Benchmark/bin/Release/net10.0/Nino.Benchmark.dll --verify

      - name: Publish trimmed and NativeAOT
        if: ${{ matrix.id == 'linux' && !cancelled() }}
        run: |
          dotnet publish tests/Nino.AotTests/Nino.AotTests.csproj -c Release -r linux-x64 -p:NinoPublish=trim -o ./aot-tests/trim
          dotnet publish tests/Nino.AotTests/Nino.AotTests.csproj -c Release -r linux-x64 -p:NinoPublish=aot -o ./aot-tests/aot

      - name: Run trimmed and NativeAOT
        if: ${{ matrix.id == 'linux' && !cancelled() }}
        run: |
          ./aot-tests/trim/Nino.AotTests | tee trim.txt
          ./aot-tests/aot/Nino.AotTests | tee aot.txt
          [ "$(grep 'payload sha256' trim.txt)" = "$(grep 'payload sha256' aot.txt)" ]

  # The one check to require: fails if any configuration failed (Unity runs in unity.yml, one seat at a time),
  # or if the shards of a unit test configuration together did not run the whole suite.
  build-test:
    name: Build and Test
    # It only reads the results (Python 3 and the artifacts): any Ubuntu does. Not ubuntu-26.04, whose runners the
    # jobs above had just taken: this job waited 45 and 82 s for one in two of four runs, at the end of every run's
    # critical path, while every job before it had started within seconds.
    runs-on: ubuntu-24.04
    needs: [ unit-tests, integrations, runtime-tests ]
    # Not when the run itself was cancelled (a newer push supersedes it): its cancelled jobs are not failures.
    if: ${{ !cancelled() }}
    timeout-minutes: 10
    steps:
      - name: Check results
        run: |
          echo "unit tests: ${{ needs.unit-tests.result }}, integrations: ${{ needs.integrations.result }}, runtime internals and trim/AOT: ${{ needs.runtime-tests.result }}"
          [ "${{ needs.unit-tests.result }}" = success ] || exit 1
          [ "${{ needs.integrations.result }}" = success ] || exit 1
          [ "${{ needs.runtime-tests.result }}" = success ] || exit 1

      - name: Checkout the scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Download the unit test results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        # The uploads may have failed on a storage timeout: the check below then warns about the missing shards (each
        # shard checked its own part already).
        continue-on-error: true
        with:
          pattern: test-results-unit-*
          path: unit-results
          # Each configuration's artifact holds a directory per shard: merged, they sit side by side.
          merge-multiple: true

      - name: Check every test ran
        run: python3 .github/scripts/test_shards.py unit-results

      - name: Merge test results
        uses: actions/upload-artifact/merge@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        continue-on-error: true
        with:
          name: test-results-${{ github.run_number }}
          pattern: test-results-*
          delete-merged: true
          retention-days: 30

  # A pull request's quick benchmark signal: the A/B shards of benchmarks/shards.json ("ab": Nino and MemoryPack, the
  # list ab-bench.yml runs), so a new class is benchmarked here once it is in a shard. The full, published numbers
  # come from report.yml on release.
  benchmark-plan:
    name: Plan the benchmark shards
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - name: Checkout the shard list
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: benchmarks/shards.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Plan
        id: plan
        run: |
          echo "shards=$(jq -c '[.ab[] | {id, filters: (.filters | join(" "))}]' benchmarks/shards.json)" >> "$GITHUB_OUTPUT"

  benchmark:
    name: Run Benchmarks (${{ matrix.shard.id }})
    needs: benchmark-plan
    runs-on: ubuntu-26.04
    # Independent of the tests, so it runs beside them.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 6   # grows with shards.json, like ab-bench.yml's
      matrix:
        shard: ${{ fromJSON(needs.benchmark-plan.outputs.shards) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet
        with:
          net8: true

      # Verify.cs runs in the integrations job, on pushes and pull requests alike.
      - name: Build benchmark project
        run: |
          cd benchmarks/Nino.Benchmark
          dotnet build -c Release

      - name: Run benchmarks
        env:
          FILTERS: ${{ matrix.shard.filters }}
        run: |
          cd benchmarks/Nino.Benchmark
          read -ra filters <<< "$FILTERS"
          dotnet run -c Release --no-build -- --filter "${filters[@]}"
          if ! find BenchmarkDotNet.Artifacts/results -name '*-report-github.md' | grep -q .; then
            echo "::error::no benchmark report was written"
            exit 1
          fi

      - name: Upload benchmark results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: benchmark-results-pr-${{ github.event.pull_request.number }}-${{ matrix.shard.id }}
          path: benchmarks/Nino.Benchmark/**/BenchmarkDotNet.Artifacts/results
          retention-days: 30
