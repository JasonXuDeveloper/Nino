name: CI - Build and Test

on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - 'src/**'
      - '.editorconfig'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - 'Nino.slnx'
      - 'benchmarks/Nino.Benchmark/**'
      - 'benchmarks/Nino.GeneratorBenchmark/**'
      - 'global.json'
      - 'nuget.config'
      - 'tests/**'
      - 'runtimes/**'
      - 'conformance/**'
      - '.github/workflows/ci.yml'
      - '.github/scripts/test_shards.py'
  pull_request:
    branches: [ "main", "develop" ]
    paths:
      - 'src/**'
      - '.editorconfig'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - 'Nino.slnx'
      - 'benchmarks/Nino.Benchmark/**'
      - 'benchmarks/Nino.GeneratorBenchmark/**'
      - 'global.json'
      - 'nuget.config'
      - 'tests/**'
      - 'runtimes/**'
      - 'conformance/**'
      - '.github/workflows/ci.yml'
      - '.github/scripts/test_shards.py'
  workflow_call:

# Security: Minimal required permissions
permissions:
  contents: read        # Read repository contents
  actions: write        # Upload artifacts
  pull-requests: read   # Read PR context
  checks: write         # Write test results

# Prevent concurrent runs of the same workflow only when CI actually runs
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Set global defaults
defaults:
  run:
    working-directory: .

# The .NET CLI's banner, telemetry and first-run setup are noise and time in CI.
env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'

jobs:
  # Every configuration runs the whole unit test suite, split over three runners (shards) that run side by side:
  # the ShapeMatrix rows compile some 70 shapes each and take two thirds of the suite's time, so each half of them is
  # a shard, and everything else the third. Each shard builds what it tests (building is under a minute, a shared
  # build would cost more to upload and download). The shards' filters are complements of each other, each shard
  # checks it ran every test its filter lists, and "Build and Test" checks that the shards of each configuration
  # together ran every test of the suite (.github/scripts/test_shards.py).
  unit-tests:
    name: Unit tests (${{ matrix.config.name }}, ${{ matrix.shard.name }})
    runs-on: ${{ matrix.config.runner || 'ubuntu-26.04' }}
    timeout-minutes: 30
    defaults:
      run:
        # Bash on Windows too: the shard filters and the checks below are written once.
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        config:
          # The Roslyn 4.12 generator (interceptors on).
          - id: net10
            name: net10.0
            framework: net10.0
            coverage: true
          # What Unity and older compilers run: Nino.Core netstandard2.1, regular calls instead of interceptors.
          - id: ns21
            name: netstandard2.1 without interceptors
            framework: net8.0
            properties: -p:NinoCoreTfm=netstandard2.1 -p:NinoRegularCalls=true
          # The .NET 8 SDK's preview interceptor attribute: Nino.Core netstandard2.0, the Roslyn 4.8 generator.
          # Each Nino.Core build is checked against the pinned bytes of GoldenBytesTests.
          - id: ns20
            name: netstandard2.0 with Roslyn 4.8
            framework: net8.0
            properties: -p:NinoCoreTfm=netstandard2.0 -p:NinoGeneratorBuild=4.8
          # Arm64: its byte shuffle (tbl), 16-byte vectors only, and the net8.0 build's own shuffle path.
          - id: arm64-net10
            name: net10.0 on Arm64
            runner: ubuntu-24.04-arm
            framework: net10.0
          - id: arm64-net8
            name: net8.0 on Arm64
            runner: ubuntu-24.04-arm
            framework: net8.0
          # x64 CPUs without AVX-512 (most desktops: 32-byte vectors, no byte permute), and without any SIMD.
          - id: no-avx512
            name: net10.0 without AVX-512
            framework: net10.0
            avx512: '0'
          # Older x64 CPUs (SSSE3, no AVX2): 16-byte vectors, two shuffles a vector where Arm64 has one table lookup.
          - id: no-avx2
            name: net10.0 without AVX2
            framework: net10.0
            avx2: '0'
          - id: no-simd
            name: net10.0 without SIMD
            framework: net10.0
            simd: '0'
          # Windows: its paths, file system and line endings. A contributor's analyzer test failed there (PR #203)
          # while every Linux job passed.
          - id: windows
            name: net10.0 on Windows
            runner: windows-latest
            framework: net10.0
        # MSTest filters (VSTest syntax, parentheses escaped). b and c split ShapeMatrixTests' rows; c is the
        # complement of b, so a row added to the matrix lands in c, and a is the complement of both.
        shard:
          - id: a
            name: all but ShapeMatrix
            filter: FullyQualifiedName!~ShapeMatrixTests
          - id: b
            name: ShapeMatrix rows 0-7
            filter: >-
              FullyQualifiedName~ShapeMatrixTests&(Name~\(0\)|Name~\(1\)|Name~\(2\)|Name~\(3\)|Name~\(4\)|Name~\(5\)|Name~\(6\)|Name~\(7\))
          - id: c
            name: ShapeMatrix rows 8+
            filter: >-
              FullyQualifiedName~ShapeMatrixTests&Name!~\(0\)&Name!~\(1\)&Name!~\(2\)&Name!~\(3\)&Name!~\(4\)&Name!~\(5\)&Name!~\(6\)&Name!~\(7\)
    env:
      PROJECT: tests/Nino.UnitTests/Nino.UnitTests.csproj
      FRAMEWORK: ${{ matrix.config.framework }}
      PROPERTIES: ${{ matrix.config.properties }}
      FILTER: ${{ matrix.shard.filter }}
      # Relative to the workspace: Git Bash on Windows and dotnet agree on it.
      RESULTS: TestResults

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            ${{ vars.DOTNET_VERSION || '10.0.x' }}
            10.0.x
            8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-unit-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ runner.arch }}-unit-
            nuget-${{ runner.os }}-${{ runner.arch }}-

      - name: Build
        run: |
          read -ra props <<< "$PROPERTIES"
          dotnet build "$PROJECT" -c Debug -f "$FRAMEWORK" "${props[@]}"

      - name: Test
        env:
          DOTNET_EnableAVX512: ${{ matrix.config.avx512 || '1' }}
          DOTNET_EnableAVX2: ${{ matrix.config.avx2 || '1' }}
          DOTNET_EnableHWIntrinsic: ${{ matrix.config.simd || '1' }}
          COVERAGE: ${{ matrix.config.coverage && '--collect:XPlat Code Coverage' || '' }}
        run: |
          read -ra props <<< "$PROPERTIES"
          dotnet test "$PROJECT" --no-build -c Debug -f "$FRAMEWORK" "${props[@]}" --filter "$FILTER" \
            --logger "trx;LogFileName=unit.trx" --results-directory "$RESULTS" ${COVERAGE:+"$COVERAGE"}

      # The shard ran every test its filter selects (and some); on shard a, the list of the whole suite, which
      # "Build and Test" compares with what the three shards ran.
      - name: Check the shard ran its tests
        run: |
          set -euo pipefail
          read -ra props <<< "$PROPERTIES"
          listed=$(dotnet test "$PROJECT" --no-build -c Debug -f "$FRAMEWORK" "${props[@]}" --list-tests --filter "$FILTER" | grep -c '^    ' || true)
          ran=$(grep -o '<UnitTestResult ' "$RESULTS/unit.trx" | wc -l)
          echo "listed $listed, ran $ran"
          if (( listed == 0 || ran != listed )); then
            echo "::error::shard ${{ matrix.shard.id }} ran $ran tests, its filter lists $listed"
            exit 1
          fi
          if [[ "${{ matrix.shard.id }}" == a ]]; then
            dotnet test "$PROJECT" --no-build -c Debug -f "$FRAMEWORK" "${props[@]}" --list-tests > "$RESULTS/suite.txt"
          fi

      - name: Upload test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        # A storage timeout is not a test result.
        continue-on-error: true
        with:
          name: test-results-unit-${{ matrix.config.id }}-${{ matrix.shard.id }}
          path: ${{ env.RESULTS }}
          retention-days: 30

  # The whole solution must compile; the ASP.NET Core integration, Nino.Codegen in builds and nino-gen, and the
  # TypeScript runtime run here, beside the unit tests instead of after them.
  integrations:
    name: Integrations and code generation
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            ${{ vars.DOTNET_VERSION || '10.0.x' }}
            10.0.x
            8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-solution-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ runner.arch }}-solution-
            nuget-${{ runner.os }}-${{ runner.arch }}-

      # Nino.Codegen in builds: Node runs the generated TypeScript (type stripping, Node 22.18+) and tsc checks it;
      # scratch projects build with build/Nino.Codegen.targets for TypeScript, Go and Rust, and the old
      # NinoTypeScript* properties.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: runtimes/typescript/package-lock.json

      # Go and Rust run the generated code against the bytes .NET writes (GoTests, RustTests; without them on the
      # PATH those tests are inconclusive). Set up as runtimes.yml does: go.mod's version, rustup's stable.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: runtimes/go/go.mod
          cache-dependency-path: runtimes/go/bench/go.sum

      - name: Set up Rust
        id: rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          echo "CARGO_TARGET_DIR=${{ runner.temp }}/nino-codegen-cargo" >> "$GITHUB_ENV"
          echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
          echo "rustc=$(rustc -V | cut -d' ' -f2-3 | tr -c 'A-Za-z0-9.\n-' '_')" >> "$GITHUB_OUTPUT"

      # Keyed by the compiler: a new stable cannot use the old one's builds.
      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/nino-codegen-cargo
          key: codegen-rust-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.rustc }}-${{ hashFiles('runtimes/rust/Cargo.lock') }}
          restore-keys: codegen-rust-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.rustc }}-

      - name: Build the solution
        run: dotnet build -c Debug

      # The ASP.NET Core integration, on both of its frameworks.
      - name: Test integrations
        run: >
          dotnet test tests/Nino.AspNetCore.Tests/Nino.AspNetCore.Tests.csproj --no-build -c Debug
          --logger trx --results-directory ./TestResults

      - name: Test Nino.Codegen in builds
        run: |
          npm install -g typescript@5
          dotnet test tests/Nino.Codegen.Integration.Tests/Nino.Codegen.Integration.Tests.csproj --no-build -c Debug --logger trx --results-directory ./TestResults

      # nino-gen (src/Nino.Codegen): its model and command line, and the generated files under runtimes/ are what
      # it writes today (runtimes.yml compiles and runs them).
      - name: Test the code generator
        run: >
          dotnet test tests/Nino.Codegen.Tests/Nino.Codegen.Tests.csproj --no-build -c Debug
          --logger trx --results-directory ./TestResults

      # The TypeScript runtime on its own (runtimes/typescript/test): type checks, then node:test, the conformance
      # corpus over the generated code included.
      - name: Test the TypeScript runtime
        working-directory: ./runtimes/typescript
        env:
          NINO_CORPUS_REQUIRED: '1'
        run: |
          npm ci
          npm test

      - name: Upload test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        # A storage timeout is not a test result.
        continue-on-error: true
        with:
          name: test-results-integrations
          path: ./TestResults
          retention-days: 30

  # Nino.Core and generated code must stay trim and NativeAOT safe: Nino.AotTests is published both ways with every
  # trim/AOT warning an error (TreatWarningsAsErrors, TrimmerSingleWarn=false), then run; both runs must write the
  # same bytes.
  trim-aot:
    name: Trim and NativeAOT
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            ${{ vars.DOTNET_VERSION || '10.0.x' }}
            10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-aot-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ runner.arch }}-aot-
            nuget-${{ runner.os }}-${{ runner.arch }}-

      - name: Publish trimmed and NativeAOT
        run: |
          dotnet publish tests/Nino.AotTests/Nino.AotTests.csproj -c Release -r linux-x64 -p:NinoPublish=trim -o ./aot-tests/trim
          dotnet publish tests/Nino.AotTests/Nino.AotTests.csproj -c Release -r linux-x64 -p:NinoPublish=aot -o ./aot-tests/aot

      - name: Run
        run: |
          ./aot-tests/trim/Nino.AotTests | tee trim.txt
          ./aot-tests/aot/Nino.AotTests | tee aot.txt
          [ "$(grep 'payload sha256' trim.txt)" = "$(grep 'payload sha256' aot.txt)" ]

  # The netstandard2.0 build of Nino.Core on Mono, whose class libraries (like .NET Framework's) give List<T> and the
  # other collections Nino reads directly a field more than .NET's: Nino.RuntimeTests must write the same bytes there
  # as on .NET.
  mono:
    name: Mono
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            ${{ vars.DOTNET_VERSION || '10.0.x' }}
            10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-mono-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ runner.arch }}-mono-
            nuget-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Mono
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mono-complete

      - name: Build
        run: dotnet build tests/Nino.RuntimeTests/Nino.RuntimeTests.csproj -c Release

      - name: Run on .NET and Mono
        run: |
          dotnet tests/Nino.RuntimeTests/bin/Release/net10.0/Nino.RuntimeTests.dll | tee dotnet.txt
          mono tests/Nino.RuntimeTests/bin/Release/net472/Nino.RuntimeTests.exe | tee mono.txt
          diff <(grep -v '^#' dotnet.txt) <(grep -v '^#' mono.txt)
          grep -qx 'ALL OK' mono.txt

  unity-tests:
    name: Unity tests
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    # Skip Unity tests for external PRs (secrets not available in forks)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            ${{ vars.DOTNET_VERSION || '10.0.x' }}
            10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-unity-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ runner.arch }}-unity-
            nuget-${{ runner.os }}-${{ runner.arch }}-

      - name: Build the DLLs Unity loads
        run: |
          dotnet build src/Nino.Core/Nino.Core.csproj -c Debug -f netstandard2.1
          dotnet build src/Nino.Generator/Nino.Generator.csproj -c Debug
          dotnet build src/Nino.Generator.CodeFixes/Nino.Generator.CodeFixes.csproj -c Debug
          dotnet build src/Nino.UnityTypes/Nino.UnityTypes.csproj -c Debug
          cp ./src/Nino.Core/bin/Debug/netstandard2.1/Nino.Core.dll ./src/Nino.Unity/Packages/com.jasonxudeveloper.nino/Runtime/Nino.Core.dll
          # The Roslyn 4.3 build: Unity's compiler cannot load the 4.12 one.
          cp ./src/Nino.Generator/bin/Debug/netstandard2.0/Nino.Generator.dll ./src/Nino.Unity/Packages/com.jasonxudeveloper.nino/Runtime/Nino.Generator.dll
          # Code fixes, for Rider and Visual Studio: Unity lists RoslynAnalyzer DLLs in the projects it generates.
          cp ./src/Nino.Generator.CodeFixes/bin/Debug/netstandard2.0/Nino.Generator.CodeFixes.dll ./src/Nino.Unity/Packages/com.jasonxudeveloper.nino/Runtime/Nino.Generator.CodeFixes.dll
          cp ./src/Nino.UnityTypes/bin/Debug/netstandard2.1/Nino.UnityTypes.dll ./src/Nino.Unity/Packages/com.jasonxudeveloper.nino/Runtime/Nino.UnityTypes.dll

      - name: Cache Unity Library
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src/Nino.Unity/Library
          key: Library-Nino-${{ runner.os }}-${{ hashFiles('src/Nino.Unity/Assets/**', 'src/Nino.Unity/Packages/**', 'src/Nino.Unity/ProjectSettings/**') }}
          restore-keys: |
            Library-Nino-${{ runner.os }}-
            Library-Nino-
            Library-

      - name: Run Unity tests
        uses: game-ci/unity-test-runner@32e57712352b500e17974b245a6dce9e11a73213 # v4.4.0
        id: unity-tests
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: ./src/Nino.Unity
          testMode: editmode
          # No githubToken: posting the results as a check run calls the GitHub API, and a timeout there failed a run
          # whose tests had all passed. The results are uploaded below, and a failed test still fails this step.
          unityVersion: '2022.3.51f1'
          # A fixed release: "latest" asks the GitHub API for it on every run, and a 403 from its rate limit failed the job.
          cliVersion: 'v0.1.72'

      - name: Upload Unity results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        # A storage timeout is not a test result.
        continue-on-error: true
        with:
          name: test-results-unity
          path: |
            ./artifacts
            ${{ steps.unity-tests.outputs.coveragePath }}
          retention-days: 30

  # The one check to require: fails if any configuration failed (a skipped Unity run, on fork PRs, is not a failure),
  # or if the shards of a unit test configuration together did not run the whole suite.
  build-test:
    name: Build and Test
    runs-on: ubuntu-26.04
    needs: [ unit-tests, integrations, trim-aot, mono, unity-tests ]
    # Not when the run itself was cancelled (a newer push supersedes it): its cancelled jobs are not failures.
    if: ${{ !cancelled() }}
    timeout-minutes: 10
    steps:
      - name: Check results
        run: |
          echo "unit tests: ${{ needs.unit-tests.result }}, integrations: ${{ needs.integrations.result }}, trim/AOT: ${{ needs.trim-aot.result }}, Mono: ${{ needs.mono.result }}, Unity tests: ${{ needs.unity-tests.result }}"
          [ "${{ needs.unit-tests.result }}" = success ] || exit 1
          [ "${{ needs.integrations.result }}" = success ] || exit 1
          [ "${{ needs.trim-aot.result }}" = success ] || exit 1
          [ "${{ needs.mono.result }}" = success ] || exit 1
          case "${{ needs.unity-tests.result }}" in success|skipped) ;; *) exit 1 ;; esac

      - name: Checkout the scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Download the unit test results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        # The uploads may have failed on a storage timeout: the check below then warns about the missing shards (each
        # shard checked its own part already).
        continue-on-error: true
        with:
          pattern: test-results-unit-*
          path: unit-results

      - name: Check every test ran
        run: python3 .github/scripts/test_shards.py unit-results

      - name: Merge test results
        uses: actions/upload-artifact/merge@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        continue-on-error: true
        with:
          name: test-results-${{ github.run_number }}
          pattern: test-results-*
          delete-merged: true
          retention-days: 30

  # Run benchmarks on PRs only
  benchmark:
    name: Run Benchmarks (${{ matrix.classes }})
    runs-on: ubuntu-26.04
    # Independent of the tests, so it runs beside them. A quick signal (ShortRun, Nino against MemoryPack); the full,
    # published numbers come from report.yml on release. The classes run in parallel, as in report.yml.
    if: github.event_name == 'pull_request'
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        classes: [ SimpleTest PooledTest, CommonTypesTest FixedSizeTest GenericPolymorphicTest, PolymorphicTest VersionTolerantTest BclTypesTest, CollectionsTest ReferenceTest PooledGraphTest ]
    permissions:
      contents: read
      pull-requests: write

    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            ${{ vars.DOTNET_VERSION || '10.0.x' }}
            10.0.x
            8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-benchmark-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ runner.arch }}-benchmark-
            nuget-${{ runner.os }}-${{ runner.arch }}-

      - name: Build benchmark project
        run: |
          cd benchmarks/Nino.Benchmark
          dotnet build -c Release
          # Every case reads back what the others read and writes its payload's bytes (Verify.cs).
          dotnet run -c Release --no-build -- --verify

      - name: Run benchmarks
        run: |
          cd benchmarks/Nino.Benchmark
          echo "Running benchmarks for PR #${{ github.event.pull_request.number }}..."
          FILTERS=()
          for CLASS in ${{ matrix.classes }}; do FILTERS+=("*.$CLASS.Nino*" "*.$CLASS.MemoryPack*"); done
          dotnet run -c Release --no-build -- --filter "${FILTERS[@]}"

          # Verify benchmark results exist (check for any github markdown file)
          MARKDOWN_FILE=$(find BenchmarkDotNet.Artifacts/results -name "*-report-github.md" -type f 2>/dev/null | head -n1)
          if [[ -n "$MARKDOWN_FILE" && -f "$MARKDOWN_FILE" ]]; then
            echo "✅ Benchmark completed successfully - found report file:"
            echo "$MARKDOWN_FILE"
          else
            echo "❌ Benchmark results not found"
            echo "Looking for markdown files in results directory..."
            find BenchmarkDotNet.Artifacts -name "*.md" -type f || echo "No markdown files found"
            exit 1
          fi

      - name: Upload benchmark results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: benchmark-results-pr-${{ github.event.pull_request.number }}-${{ strategy.job-index }}
          path: benchmarks/Nino.Benchmark/**/BenchmarkDotNet.Artifacts/results
          retention-days: 30
