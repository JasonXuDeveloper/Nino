name: CodeQL

# Code scanning for every language in the repository, configured here instead of GitHub's default setup: the default
# setup's C/C++ autobuild finds no build system (the only C++ is the libFuzzer driver in tests/Nino.Fuzz/libfuzzer)
# and fails. The default setup must be off for these results to be accepted (Settings → Code security → CodeQL
# analysis → Disable CodeQL, or "Switch to advanced").
on:
  # Not for a push that changes only documentation (Markdown, docs/, the license): no language here analyzes it.
  push:
    branches: [ "main" ]
    paths-ignore: &docs
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [ "main" ]
    paths-ignore: *docs
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# A newer push or pull request commit supersedes a run; the weekly and manual scans are never cancelled by one (each
# event its own group).
concurrency:
  group: codeql-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

# Bash with -e and -o pipefail for every run step: a command piped into tee, grep or sed fails its step when it fails.
defaults:
  run:
    shell: bash

jobs:
  # The languages the push or pull request changed (.github/scripts/changed_paths.py): a change to Nino.Core needs
  # the C# analysis, not six more runners for Go, Rust, TypeScript, Python, C++ and the workflows it left as they were.
  # The weekly and manual scans, a new branch and a change to this workflow analyze every language, so new queries
  # still reach unchanged code within a week.
  languages:
    name: Changed languages
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # <language>:<build mode>, then the paths it analyzes. c-cpp is the libFuzzer driver, compiled on its own
      # (linking needs libFuzzer, analysis does not).
      - name: Plan
        id: plan
        env:
          BASE: ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && (github.event.pull_request.base.sha || github.event.before) || '' }}
        run: |
          python3 .github/scripts/changed_paths.py "$BASE" \
            --all-if '^\.github/(workflows/codeql\.yml|scripts/changed_paths\.py)$' \
            'actions:none=^\.github/(workflows|actions)/' \
            'csharp:none=\.(cs|csproj|props|targets)$' \
            'go:autobuild=\.(go|s)$|(^|/)go\.(mod|sum)$' \
            'javascript-typescript:none=\.(ts|js|mjs|cjs)$|(^|/)package(-lock)?\.json$|(^|/)tsconfig[^/]*\.json$' \
            'python:none=\.py$' \
            'rust:none=\.rs$|(^|/)Cargo\.(toml|lock)$' \
            'c-cpp:manual=\.(c|cc|cpp|h|hpp)$' > "$RUNNER_TEMP/languages.txt"
          cat "$RUNNER_TEMP/languages.txt"
          matrix=$(sed -n 's/^\([^:]*\):\([^=]*\)=true$/{"language":"\1","build-mode":"\2"}/p' "$RUNNER_TEMP/languages.txt" | jq -sc .)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: languages
    if: needs.languages.outputs.matrix != '[]'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.languages.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build the libFuzzer driver
        if: matrix.build-mode == 'manual'
        run: clang++ -std=c++17 -O1 -c tests/Nino.Fuzz/libfuzzer/driver.cc -o "$RUNNER_TEMP/driver.o"

      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
