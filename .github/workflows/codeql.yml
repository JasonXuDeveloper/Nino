name: CodeQL

# Code scanning for every language in the repository, configured here instead of GitHub's default setup: the default
# setup's C/C++ autobuild finds no build system (the only C++ is the libFuzzer driver in tests/Nino.Fuzz/libfuzzer)
# and fails. The default setup must be off for these results to be accepted (Settings → Code security → CodeQL
# analysis → Disable CodeQL, or "Switch to advanced").
on:
  push:
    branches: [ "main", "develop", "claude/zen-goldberg-5qqqcu" ]
  pull_request:
    branches: [ "main", "develop" ]
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# A newer push or pull request commit supersedes a run; the weekly and manual scans are never cancelled by one (each
# event its own group).
concurrency:
  group: codeql-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: csharp
            build-mode: none
          - language: go
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
          - language: rust
            build-mode: none
          # The libFuzzer driver, compiled on its own (linking needs libFuzzer, analysis does not).
          - language: c-cpp
            build-mode: manual
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build the libFuzzer driver
        if: matrix.build-mode == 'manual'
        run: clang++ -std=c++17 -O1 -c tests/Nino.Fuzz/libfuzzer/driver.cc -o "$RUNNER_TEMP/driver.o"

      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
