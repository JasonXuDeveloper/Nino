name: CodeQL

# Code scanning for every language in the repository, configured here instead of GitHub's default setup: the default
# setup's C/C++ autobuild finds no build system (the only C++ is the libFuzzer driver in tests/Nino.Fuzz/libfuzzer)
# and fails. The default setup must be off for these results to be accepted (Settings → Code security → CodeQL
# analysis → Disable CodeQL, or "Switch to advanced").
on:
  # Not for a push that changes only documentation (Markdown, docs/, the license): no language here analyzes it.
  push:
    branches: [ "main" ]
    paths-ignore: &docs
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [ "main" ]
    paths-ignore: *docs
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# A newer push or pull request commit supersedes a run; the weekly and manual scans are never cancelled by one (each
# event its own group).
concurrency:
  group: codeql-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

# Bash with -e and -o pipefail for every run step: a command piped into tee, grep or sed fails its step when it fails.
defaults:
  run:
    shell: bash

jobs:
  # The languages the push or pull request changed (.github/scripts/changed_paths.py): a change to Nino.Core needs
  # the C# analysis, not six more runners for Go, Rust, TypeScript, Python, C++ and the workflows it left as they were.
  # The weekly and manual scans, a new branch and a change to this workflow analyze every language, so new queries
  # still reach unchanged code within a week. On maple, the repository's self-hosted runner, for trusted runs only (the
  # weekly and manual scans, a push to main, a pull request from a branch of this repository that Dependabot did not
  # open, while the repository variable NINO_MAPLE is not false; ci.yml, at its jobs, says why and what keeps a fork off
  # maple). The analyses stay on GitHub's runners: the CodeQL bundle (about 1.5 GB a version) would pile up in maple's
  # tool cache. The push to main analyzes again: code scanning shows main's alerts from main's own analyses.
  languages:
    name: Changed languages
    runs-on: >-
      ${{ vars.NINO_MAPLE != 'false' && github.actor != 'dependabot[bot]' &&
          (contains(fromJSON('["push", "workflow_dispatch", "schedule"]'), github.event_name) ||
           (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository &&
            github.event.pull_request.user.login != 'dependabot[bot]')) &&
          fromJSON('["self-hosted", "Linux", "X64", "maple"]') || 'ubuntu-26.04' }}
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      # maple (one runner process on a shared host, 72 GB of disk): stop at once on a nearly full disk, which would
      # otherwise surface as an odd build error, and keep every cache this job writes in RUNNER_TEMP, which "Free
      # maple's disk" deletes at its end. The toolchains stay installed (the .NET SDKs, rustup's toolchains in
      # RUSTUP_HOME); NuGet's, npm's, Cargo's and Go's caches, dotnet's home and the temporary files do not outlive the
      # job. GitHub's runners skip it.
      - name: Prepare maple
        if: runner.environment == 'self-hosted'
        run: |
          need_gb=10
          free_gb=$(df -Pk "$RUNNER_TEMP" | awk 'NR == 2 { print int($4 / 1048576) }')
          echo "maple: $free_gb GB free under $RUNNER_TEMP"
          if (( free_gb < need_gb )); then
            echo "::error::maple has $free_gb GB free, under the $need_gb GB a job may need: free its disk, then re-run"
            exit 1
          fi
          home="$RUNNER_TEMP/home"
          mkdir -p "$home/tmp"
          {
            echo "NUGET_PACKAGES=$home/nuget/packages"
            echo "NUGET_HTTP_CACHE_PATH=$home/nuget/http-cache"
            echo "NUGET_PLUGINS_CACHE_PATH=$home/nuget/plugins-cache"
            echo "DOTNET_CLI_HOME=$home"
            echo "npm_config_cache=$home/npm"
            echo "CARGO_HOME=$home/cargo"
            echo "GOMODCACHE=$home/go/mod"
            echo "GOCACHE=$home/go/build"
            echo "TMPDIR=$home/tmp"
          } >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # <language>:<build mode>, then the paths it analyzes. c-cpp is the libFuzzer driver, compiled on its own
      # (linking needs libFuzzer, analysis does not).
      - name: Plan
        id: plan
        env:
          BASE: ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && (github.event.pull_request.base.sha || github.event.before) || '' }}
        run: |
          python3 .github/scripts/changed_paths.py "$BASE" \
            --all-if '^\.github/(workflows/codeql\.yml|scripts/changed_paths\.py)$' \
            'actions:none=^\.github/(workflows|actions)/' \
            'csharp:none=\.(cs|csproj|props|targets)$' \
            'go:autobuild=\.(go|s)$|(^|/)go\.(mod|sum)$' \
            'javascript-typescript:none=\.(ts|js|mjs|cjs)$|(^|/)package(-lock)?\.json$|(^|/)tsconfig[^/]*\.json$' \
            'python:none=\.py$' \
            'rust:none=\.rs$|(^|/)Cargo\.(toml|lock)$' \
            'c-cpp:manual=\.(c|cc|cpp|h|hpp)$' > "$RUNNER_TEMP/languages.txt"
          cat "$RUNNER_TEMP/languages.txt"
          matrix=$(sed -n 's/^\([^:]*\):\([^=]*\)=true$/{"language":"\1","build-mode":"\2"}/p' "$RUNNER_TEMP/languages.txt" | jq -sc .)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

      # The job's caches ($RUNNER_TEMP/home, "Prepare maple") and what it built (untracked files in the checkout), the
      # bulk of its disk, freed whatever happened. The checkout and the rest of RUNNER_TEMP stay for the post steps that
      # run after this one (checkout's, and those of the actions inside .github/actions/setup-dotnet, which the runner
      # reads again then); maple's job-completed hook deletes them after those (the audit-ci skill). GitHub's runners
      # skip it.
      - name: Free maple's disk
        if: always() && runner.environment == 'self-hosted'
        run: |
          rm -rf "${RUNNER_TEMP:?}/home"
          git -C "$GITHUB_WORKSPACE" clean -fdxq 2>/dev/null || true

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: languages
    if: needs.languages.outputs.matrix != '[]'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.languages.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build the libFuzzer driver
        if: matrix.build-mode == 'manual'
        run: clang++ -std=c++17 -O1 -c tests/Nino.Fuzz/libfuzzer/driver.cc -o "$RUNNER_TEMP/driver.o"

      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
