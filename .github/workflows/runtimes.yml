name: Runtimes

# The runtimes of Nino's wire format outside .NET, each tested on its own and against the conformance corpus that
# .NET writes (tests/conformance/README.md). Each runtime's tests also run the corpus over the code nino-gen
# (runtimes/csharp/src/Nino.Codegen) generates for the corpus's types, committed under runtimes/ (docs/codegen.md). Every input of
# these jobs is committed under runtimes/go, rust, typescript and tests/conformance/corpus/: a change to Nino.Core, the generator or nino-gen
# reaches them only through those files, and ci.yml's integrations job checks that the committed corpus and generated
# files are what .NET and nino-gen write today. So this workflow runs only when those files change: its 16 jobs once
# ran for every Nino.Core change, which never touched what they test.
on:
  push:
    branches: [ "main" ]
    paths: &paths
      - 'runtimes/**'
      - '!runtimes/csharp/**'   # .NET: ci.yml's
      - 'tests/conformance/corpus/**'
      - '.github/workflows/runtimes.yml'
      - '.github/scripts/changed_paths.py'
      - '.github/actions/apt-install/**'
      - '!**/AGENTS.md'      # agent instructions only: nothing to build or test
      - '!**/CLAUDE.md'
  pull_request:
    branches: [ "main" ]
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

env:
  # The conformance corpus every runtime's tests read, and a missing one fails them instead of skipping them.
  # (dtolnay/rust-toolchain sets CARGO_INCREMENTAL=0 and CARGO_TERM_COLOR=always.)
  NINO_CORPUS: ${{ github.workspace }}/tests/conformance/corpus
  NINO_CORPUS_REQUIRED: '1'

concurrency:
  group: runtimes-${{ github.ref }}
  cancel-in-progress: true

# A push to main that changes everything starts some 50 jobs across ci.yml, runtimes.yml, fuzz.yml, codeql.yml and
# unity.yml, against an account limit of 40 at a time: a job that only sets up a toolchain and runs a few seconds of tests still holds a
# slot, and the long jobs queued behind it. So the short checks of one runner share a job (each a step that runs even
# after another step failed, so one run shows every failure), the longest jobs come first, and the Rust jobs restore
# their dependencies, and Miri its sysroot, from a cache that only main writes (the repository's 10 GB of caches are
# shared with Unity's Library).
# Bash with -e and -o pipefail for every run step: a command piped into tee, grep or sed fails its step when it fails.
defaults:
  run:
    shell: bash

jobs:
  # Which runtimes the push or pull request changed (.github/scripts/changed_paths.py): each job below runs only for
  # its own, the corpus changes them all, and a schedule, a manual run, a new branch or a change to this workflow runs
  # everything. Miri only for the Rust crate's library code (its tests are the simd module's own). A Go-only change
  # once started the eleven Rust jobs too. On maple, the repository's self-hosted runner, for trusted runs only (a push
  # to main, a manual run, a pull request from a branch of this repository that Dependabot did not open, while the
  # repository variable NINO_MAPLE is not false; ci.yml, at its jobs, says why and what keeps a fork off maple). The
  # push to main after a pull request runs again here, unlike ci.yml's and fuzz.yml's: only main saves the Rust caches
  # every pull request restores.
  changes:
    name: Changed runtimes
    runs-on: >-
      ${{ vars.NINO_MAPLE != 'false' && github.actor != 'dependabot[bot]' &&
          (contains(fromJSON('["push", "workflow_dispatch", "schedule"]'), github.event_name) ||
           (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository &&
            github.event.pull_request.user.login != 'dependabot[bot]')) &&
          fromJSON('["self-hosted", "Linux", "X64", "maple"]') || 'ubuntu-26.04' }}
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.diff.outputs.rust }}
      miri: ${{ steps.diff.outputs.miri }}
      go: ${{ steps.diff.outputs.go }}
      typescript: ${{ steps.diff.outputs.typescript }}
      bench: ${{ steps.bench.outputs.langs || '[]' }}
    steps:
      # maple (two runner processes on a shared host, 72 GB of disk): stop at once on a nearly full disk, which would
      # otherwise surface as an odd build error, and keep every cache this job writes in RUNNER_TEMP, which "Free
      # maple's disk" deletes at its end. The toolchains stay installed (the .NET SDKs, rustup's toolchains in
      # RUSTUP_HOME); NuGet's, npm's, Cargo's and Go's caches, dotnet's home and the temporary files do not outlive the
      # job. GitHub's runners skip it.
      - name: Prepare maple
        if: runner.environment == 'self-hosted'
        run: |
          need_gb=10
          free_gb=$(df -Pk "$RUNNER_TEMP" | awk 'NR == 2 { print int($4 / 1048576) }')
          echo "maple: $free_gb GB free under $RUNNER_TEMP"
          if (( free_gb < need_gb )); then
            echo "::error::maple has $free_gb GB free, under the $need_gb GB a job may need: free its disk, then re-run"
            exit 1
          fi
          home="$RUNNER_TEMP/home"
          mkdir -p "$home/tmp"
          {
            echo "NUGET_PACKAGES=$home/nuget/packages"
            echo "NUGET_HTTP_CACHE_PATH=$home/nuget/http-cache"
            echo "NUGET_PLUGINS_CACHE_PATH=$home/nuget/plugins-cache"
            echo "DOTNET_CLI_HOME=$home"
            echo "npm_config_cache=$home/npm"
            echo "CARGO_HOME=$home/cargo"
            echo "GOMODCACHE=$home/go/mod"
            echo "GOCACHE=$home/go/build"
            echo "TMPDIR=$home/tmp"
          } >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare with the base
        id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 .github/scripts/changed_paths.py "$BASE" \
            --all-if '^\.github/(workflows/runtimes\.yml|scripts/changed_paths\.py|actions/apt-install/)' \
            'rust=^runtimes/rust/|^tests/conformance/corpus/' \
            'miri=^runtimes/rust/(src/|tests/shared\.rs$|build\.rs$|Cargo\.(toml|lock)$)' \
            'go=^runtimes/go/|^tests/conformance/corpus/' \
            'typescript=^runtimes/typescript/|^tests/conformance/corpus/' | tee -a "$GITHUB_OUTPUT"

      # The languages a pull request labeled `benchmark` changed, for the quick benchmark job.
      - name: Plan the quick benchmarks
        id: bench
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'benchmark')
        env:
          GO: ${{ steps.diff.outputs.go }}
          RUST: ${{ steps.diff.outputs.rust }}
          TYPESCRIPT: ${{ steps.diff.outputs.typescript }}
        run: |
          langs=$(for lang in go rust typescript; do
            var=${lang^^}; if [[ ${!var} == true ]]; then echo "$lang"; fi; done | jq -R . | jq -sc .)
          echo "langs=$langs" | tee -a "$GITHUB_OUTPUT"

      # The job's caches ($RUNNER_TEMP/home, "Prepare maple") and what it built (untracked files in the checkout), the
      # bulk of its disk, freed whatever happened. The checkout and the rest of RUNNER_TEMP stay for the post steps that
      # run after this one (checkout's, and those of the actions inside .github/actions/setup-dotnet, which the runner
      # reads again then); maple's job-completed hook deletes them after those (the audit-ci skill). GitHub's runners
      # skip it.
      - name: Free maple's disk
        if: always() && runner.environment == 'self-hosted'
        run: |
          rm -rf "${RUNNER_TEMP:?}/home"
          git -C "$GITHUB_WORKSPACE" clean -fdxq 2>/dev/null || true

  # The crate's only unsafe code (runtimes/rust/src/simd.rs: the string writer's transcoding and the reader's text
  # decoding) under Miri: its tests compare every block kind a target has, and the decoders, with plain ones. Miri
  # interprets each target here: x86_64 with SSE2 only (SSE2 and words), SSSE3 (the pair steps), SSE4.1 (the one-pass
  # writer and the decoders), AVX2 and AVX-512 (their kernels; Miri lacks vpcompressb/w and pdep, which those kernels
  # replace with plain loops under cfg(miri)), little-endian Arm64 (NEON) and big-endian s390x (words). The tests run
  # every kernel the target's features allow, so each row checks its tier and those below it.
  # The tests take fewer cases under Miri (cfg(miri)). Each target is a runner of its own: one after the other, the
  # targets took over twenty minutes. Miri runs on one thread, so each runner runs the module's tests as two
  # processes side by side: every_class_at_every_position, and every simd test but that one (so a test added to the
  # module runs there). Two, not more: the runners' four vCPUs are two cores.
  rust-miri:
    name: Rust (Miri, ${{ matrix.target.name }})
    needs: changes
    if: needs.changes.outputs.miri == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: runtimes/rust
    strategy:
      fail-fast: false
      matrix:
        target:
          - { name: Arm64 NEON, triple: aarch64-unknown-linux-gnu, rustflags: '' }
          - { name: x86_64 SSSE3, triple: x86_64-unknown-linux-gnu, rustflags: -C target-feature=+ssse3 }
          - { name: big-endian s390x, triple: s390x-unknown-linux-gnu, rustflags: '' }
          - { name: x86_64 SSE4.1, triple: x86_64-unknown-linux-gnu, rustflags: '-C target-feature=+ssse3,+sse4.1,+popcnt' }
          - { name: x86_64 SSE2, triple: x86_64-unknown-linux-gnu, rustflags: '' }
          - { name: x86_64 AVX2, triple: x86_64-unknown-linux-gnu, rustflags: '-C target-feature=+ssse3,+sse4.1,+popcnt,+avx2,+bmi1,+bmi2,+lzcnt' }
          - { name: x86_64 AVX-512, triple: x86_64-unknown-linux-gnu, rustflags: '-C target-feature=+ssse3,+sse4.1,+popcnt,+avx2,+bmi1,+bmi2,+lzcnt,+avx512f,+avx512bw,+avx512vl,+avx512vbmi2' }
    env:
      RUSTFLAGS: ${{ matrix.target.rustflags }}
      TRIPLE: ${{ matrix.target.triple }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The default toolchain, so the cache's key names the nightly it was built with.
      - name: Toolchain (nightly, with Miri)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-08
        with:
          toolchain: nightly
          components: miri, rust-src

      # The dependencies built for Miri, and Miri's sysroot for the target (the triple and RUSTFLAGS are in the key).
      - name: Cache Rust builds
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: runtimes/rust -> target
          key: ${{ matrix.target.triple }}
          cache-directories: ~/.cache/miri
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build under Miri
        run: |
          cargo +nightly miri setup --target "$TRIPLE"
          cargo +nightly miri test -p nino-serialization --locked --lib --target "$TRIPLE" --no-run

      - name: Test under Miri
        run: |
          set -uo pipefail
          half() {
            local name=$1; shift
            cargo +nightly miri test -p nino-serialization --locked --lib --target "$TRIPLE" "$@" \
              > "$RUNNER_TEMP/$name.txt" 2>&1
          }
          half every-class simd::tests::every_class_at_every_position & first=$!
          half rest simd -- --skip every_class_at_every_position & rest=$!
          status=0
          wait $first || { status=1; echo "::error::every_class_at_every_position failed under Miri ($TRIPLE)"; }
          wait $rest || { status=1; echo "::error::the other simd tests failed under Miri ($TRIPLE)"; }
          for name in every-class rest; do
            echo "::group::$name"; cat "$RUNNER_TEMP/$name.txt"; echo "::endgroup::"
          done
          exit $status

      # Reference tracking's one unsafe block (src/shared.rs, Shared::get on a link inside a read's arena): the graph
      # tests, cycles, deferred bodies and a Drop that reads another object, once (it has no per-target code).
      - name: Test reference tracking under Miri
        if: matrix.target.name == 'x86_64 SSE2'
        run: cargo +nightly miri test -p nino-serialization --locked --target "$TRIPLE" --test shared

  # Format, lints, the tests with every feature, and the MSRV. The tests without features are a job of their own:
  # the debug build's simd tests take over three minutes, and the two runs one after the other took eight.
  rust:
    name: Rust
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: runtimes/rust
    env:
      RUSTFLAGS: -D warnings
      # The tests built with optimizations, debug assertions and overflow checks still on (opt-level is all this
      # changes): the simd tests compare every block kind at every length and position, and unoptimized they took
      # over three minutes of each Rust job.
      CARGO_PROFILE_DEV_OPT_LEVEL: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The MSRV (rust-version in Cargo.toml)
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"

      - name: Toolchain (the MSRV)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-08
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      # Installed last: the default.
      - name: Toolchain (stable)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-08
        with:
          toolchain: stable
          components: rustfmt, clippy

      # Keyed by OS, CPU, job, compilers (the MSRV here) and Cargo.lock: a new stable never reuses the old one's builds.
      - name: Cache Rust builds
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: runtimes/rust -> target
          key: msrv-${{ steps.msrv.outputs.version }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-features --all-targets --locked -- -D warnings

      - name: Test
        if: ${{ !cancelled() }}
        run: cargo test --workspace --all-features --locked

      - name: MSRV
        if: ${{ !cancelled() }}
        env:
          MSRV: ${{ steps.msrv.outputs.version }}
        run: cargo +"$MSRV" check --workspace --all-features --all-targets --locked

  rust-no-features:
    name: Rust (without features)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: runtimes/rust
    env:
      RUSTFLAGS: -D warnings
      CARGO_PROFILE_DEV_OPT_LEVEL: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-08
        with:
          toolchain: stable

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: runtimes/rust -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Test without features
        run: cargo test -p nino-serialization --locked --lib --test spec --test values

  # Arm64 natively: the string writer's NEON steps (runtimes/rust/src/simd.rs) and the rest of the crate, with the
  # corpus, on the CPU they are written for (the rust-miri job interprets them, this one runs them).
  rust-arm64:
    name: Rust (Arm64)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 30
    defaults:
      run:
        working-directory: runtimes/rust
    env:
      RUSTFLAGS: -D warnings
      CARGO_PROFILE_DEV_OPT_LEVEL: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-08
        with:
          toolchain: stable

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: runtimes/rust -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Test
        run: cargo test --workspace --all-features --locked

  # The mutational fuzz in tests/conformance.rs (cargo-fuzz needs nightly), longer and optimized here, beside the
  # tests instead of after them (an optimized build of its own). The crate's one unsafe module is checked by the
  # rust-miri job.
  rust-fuzz:
    name: Rust fuzz (short)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: runtimes/rust
    env:
      RUSTFLAGS: -D warnings
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-08
        with:
          toolchain: stable

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: runtimes/rust -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Fuzz (short)
        env:
          NINO_FUZZ_ITERATIONS: 20000
        run: cargo test --release --all-features --locked --test conformance mutational_fuzz -- --nocapture

      # The same over the code nino-gen generates (tests/generated).
      - name: Fuzz the generated code (short)
        if: ${{ !cancelled() }}
        env:
          NINO_FUZZ_ITERATIONS: 3000
        run: cargo test --release --all-features --locked --test generated generated_fuzz -- --nocapture

  # The Go fuzz targets, short, on the newest Go. go test fuzzes one target at a time, with every core, so the x64
  # targets are split over two runners that each fuzz theirs one after the other (all on one runner took over four
  # minutes); the string kernels' targets also run on Arm64 (NEON), in the go-arm64 job. A new target is a new entry
  # in a row's list: <target>:<package>:<time>.
  go-fuzz:
    name: Go fuzz (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: runtimes/go
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: 1
            name: FuzzDecode, FuzzReader, FuzzString, FuzzReadVector
            targets: FuzzDecode:./internal/sample:60s FuzzReader:.:45s FuzzString:.:30s FuzzReadVector:.:30s
          - id: 2
            name: FuzzTaggedDecode, FuzzTagged, FuzzWireString
            targets: FuzzTaggedDecode:./internal/sample:60s FuzzTagged:.:45s FuzzWireString:.:30s
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache-dependency-path: runtimes/go/bench/go.sum

      - name: Fuzz (short)
        env:
          TARGETS: ${{ matrix.targets }}
        run: |
          set -uo pipefail
          status=0
          for spec in $TARGETS; do
            IFS=: read -r target package time <<< "$spec"
            echo "::group::$target ($time)"
            go test -run='^$' -fuzz="^${target}\$" -fuzztime="$time" "$package" || { status=1; echo "::error::$target failed"; }
            echo "::endgroup::"
          done
          exit $status

      - name: Keep failing fuzz inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-fuzz-failures-${{ matrix.id }}
          path: runtimes/go/**/testdata/fuzz
          if-no-files-found: ignore

  # The TypeScript runtime on the oldest Node package.json's engines allow and on the newest release, and the Go
  # runtime: the oldest Go go.mod allows and the newest (which also checks the benchmark module, staticcheck and the
  # generated assembly). The string writer has assembly for amd64 (SSE2) and arm64 (NEON) and a portable fallback
  # (build tag purego, and every other architecture): each runs its tests here and in go-arm64. Then the 32-bit and
  # big-endian hosts, which the tests above never are: the portable string writer, the block copies that are memory
  # copies only on little-endian hosts (endian_little.go, endian_other.go) and 32-bit int arithmetic. 386 runs
  # natively; Arm32 and s390x (big-endian) under qemu-user (go test -exec; Go's binaries are static). No race detector
  # on these.
  # Each check is a step that runs even after another one failed.
  go:
    name: Go and TypeScript
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: runtimes/go
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: runtimes/typescript/package-lock.json

      - name: TypeScript on Node 22 (type check and test, the corpus over the generated code included)
        working-directory: runtimes/typescript
        run: |
          npm ci
          npm test

      - name: Set up the newest Node
        if: ${{ !cancelled() }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: current

      - name: TypeScript on the newest Node
        if: ${{ !cancelled() }}
        working-directory: runtimes/typescript
        run: |
          npm ci
          npm test

      - name: Set up Go 1.22
        if: ${{ !cancelled() }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.22'
          # The stable setup below caches the build and module caches.
          cache: false

      - name: Go 1.22
        if: ${{ !cancelled() }}
        run: |
          go vet ./...
          go test -race -count=1 ./...

      - name: Set up the newest Go
        if: ${{ !cancelled() }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          # The modules the benchmarks and the assembly generator (avo) download.
          cache-dependency-path: |
            runtimes/go/bench/go.sum
            runtimes/go/internal/asm/go.sum

      - name: Vet
        if: ${{ !cancelled() }}
        run: |
          go vet ./...
          # The benchmark module needs Go 1.24 (testing.B.Loop): on 'stable' only.
          (cd bench && go vet ./...)

      # A staticcheck release reads the export data of the Go releases out when it was made: bump it when a new Go
      # becomes 'stable' and this step fails with "export data version ... is greater than maximum supported".
      - name: Staticcheck
        if: ${{ !cancelled() }}
        run: |
          if go install honnef.co/go/tools/cmd/staticcheck@2026.2.2; then
            "$(go env GOPATH)/bin/staticcheck" ./...
            (cd bench && "$(go env GOPATH)/bin/staticcheck" ./...)
          else
            echo "::warning::staticcheck could not be installed; skipped"
          fi

      - name: Test (race detector)
        if: ${{ !cancelled() }}
        run: go test -race -count=1 ./...

      # The benchmark module reads the .NET suite's cases: each written by Nino.Benchmark (bench/generate.sh --data),
      # read and written back to the same bytes by the generated model, and checked with every adapter.
      - name: Set up .NET (the benchmark's data)
        if: ${{ !cancelled() }}
        uses: ./.github/actions/setup-dotnet

      - name: Test the benchmark module
        if: ${{ !cancelled() }}
        run: |
          bench/generate.sh --data
          (cd bench && go test -count=1 ./...)

      # The string kernels' assembly is what internal/asm (its own module, with avo) writes: go generate leaves the
      # committed strings_wire_amd64.s and strings_wire_arm64.s unchanged.
      - name: Check the generated assembly
        if: ${{ !cancelled() }}
        working-directory: runtimes/go/internal/asm
        run: go vet . && go test -count=1 .

      - name: Test purego (race detector)
        if: ${{ !cancelled() }}
        run: |
          go vet -tags purego ./...
          go test -race -count=1 -tags purego ./...

      - name: Test on 386
        if: ${{ !cancelled() }}
        env:
          GOARCH: '386'
        run: go test -count=1 ./...

      - name: Install qemu
        if: ${{ !cancelled() }}
        uses: ./.github/actions/apt-install
        with:
          packages: --no-install-recommends qemu-user

      # One P: with several, Go 1.27's runtime under qemu-arm crashed in the garbage collector's lock-free lists
      # (lfstack.pop SIGSEGV) in a quarter to half of the runs, Nino's code or not (main f618b973 too, 1 of 10 runs;
      # Go 1.24 0 of 8, GOMAXPROCS=1 0 of 18; platforms skill). The step tests 32-bit code, not concurrency, which the
      # race detector covers natively above.
      - name: Test on Arm32 under qemu
        if: ${{ !cancelled() }}
        env:
          GOARCH: arm
          GOMAXPROCS: '1'
        run: go test -count=1 -exec qemu-arm ./...

      - name: Test on big-endian s390x under qemu
        if: ${{ !cancelled() }}
        env:
          GOARCH: s390x
        run: go test -count=1 -exec qemu-s390x ./...

  # Arm64: the Go string writer's NEON assembly and its portable fallback, a short fuzz of the NEON code, and the
  # TypeScript runtime on the newest Node.
  go-arm64:
    name: Go and TypeScript (Arm64)
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 20
    defaults:
      run:
        working-directory: runtimes/go
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: current
          cache: npm
          cache-dependency-path: runtimes/typescript/package-lock.json

      - name: TypeScript (type check and test, the corpus over the generated code included)
        working-directory: runtimes/typescript
        run: |
          npm ci
          npm test

      - name: Set up Go
        if: ${{ !cancelled() }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache-dependency-path: runtimes/go/bench/go.sum

      - name: Test (race detector)
        if: ${{ !cancelled() }}
        run: |
          go vet ./...
          go test -race -count=1 ./...

      - name: Test purego (race detector)
        if: ${{ !cancelled() }}
        run: |
          go vet -tags purego ./...
          go test -race -count=1 -tags purego ./...

      # The NEON string kernels against the Go loops.
      - name: Fuzz the NEON string code (short)
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          status=0
          for target in FuzzString FuzzWireString FuzzReadVector; do
            echo "::group::$target (30s)"
            go test -run='^$' -fuzz="^${target}\$" -fuzztime=30s . || { status=1; echo "::error::$target failed"; }
            echo "::endgroup::"
          done
          exit $status

      - name: Keep failing fuzz inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-fuzz-failures-arm64
          path: runtimes/go/**/testdata/fuzz
          if-no-files-found: ignore

  # A pull request's quick benchmark signal for the runtimes it changed, on request, as ci.yml's .NET shards: only a
  # pull request labeled `benchmark` (adding the label starts no run: push after it). Each benchmark in quick mode
  # (NINO_BENCH_QUICK=1: Go 100 ms per benchmark, Rust 300 ms measured with 10 samples, tinybench 100 ms per task),
  # a trend check against the competitors in the same run; its section goes to the job's summary. The published
  # numbers come only from report.yml, at full length (#333).
  benchmark:
    name: Quick benchmark (${{ matrix.lang }})
    needs: changes
    if: needs.changes.outputs.bench != '[]'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      NINO_BENCH_QUICK: '1'
      REPORTS: ${{ github.workspace }}/runtimes/csharp/benchmarks/reports
      TAG: pr-${{ github.event.pull_request.number }}
    strategy:
      fail-fast: false
      matrix:
        lang: ${{ fromJSON(needs.changes.outputs.bench) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The TypeScript benchmark's data and types come from .NET (Bench.csproj and nino-gen), the Go benchmark's data
      # too (Nino.Benchmark --write-data, bench/generate.sh).
      - name: Set up .NET
        if: matrix.lang == 'typescript' || matrix.lang == 'go'
        uses: ./.github/actions/setup-dotnet

      - name: Set up Node.js
        if: matrix.lang == 'typescript'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: current

      - name: Set up Go
        if: matrix.lang == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache-dependency-path: runtimes/go/bench/go.sum

      - name: Run the TypeScript benchmark
        if: matrix.lang == 'typescript'
        working-directory: runtimes/typescript/bench
        run: |
          codegen=../../csharp/src/Nino.Codegen
          dotnet build -c Release "$codegen" > /dev/null
          dotnet build -c Release . > /dev/null
          dotnet bin/Release/net10.0/Bench.dll out/data
          dotnet "$codegen/bin/Release/net8.0/nino-gen.dll" --assembly bin/Release/net10.0/Bench.dll \
            --lang ts --out gen --import-extension .ts
          npm ci --no-audit --no-fund
          NINO_BENCH_JSON="$RUNNER_TEMP/bench.json" node --no-warnings node.ts out/data
          python3 "$REPORTS/runtimes_report.py" typescript "$RUNNER_TEMP/bench.json" "$TAG" > "$RUNNER_TEMP/section.md"

      - name: Run the Go benchmark
        if: matrix.lang == 'go'
        working-directory: runtimes/go/bench
        run: |
          ./generate.sh --data
          go install golang.org/x/perf/cmd/benchstat@v0.0.0-20261009192801-be2c69fb417e
          go test -run '^$' -bench . -benchmem -count 6 . | tee "$RUNNER_TEMP/bench.txt"
          "$(go env GOPATH)/bin/benchstat" -format csv "$RUNNER_TEMP/bench.txt" > "$RUNNER_TEMP/bench.csv"
          python3 "$REPORTS/runtimes_report.py" go "$RUNNER_TEMP/bench.csv" "$TAG" > "$RUNNER_TEMP/section.md"

      - name: Run the Rust benchmark
        if: matrix.lang == 'rust'
        working-directory: runtimes/rust
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/target
        run: |
          rustup toolchain install stable --profile minimal
          cargo bench -p nino-bench --bench compare --locked 2>&1 | tee "$RUNNER_TEMP/bench.log"
          python3 "$REPORTS/runtimes_report.py" rust "$CARGO_TARGET_DIR/criterion" "$TAG" "$RUNNER_TEMP/bench.log" \
            > "$RUNNER_TEMP/section.md"

      - name: Summary
        run: cat "$RUNNER_TEMP/section.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the section
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quick-benchmark-${{ matrix.lang }}-pr-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/section.md
          retention-days: 30
