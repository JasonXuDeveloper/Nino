name: Set up .NET
description: >-
  The .NET 11 SDK, which global.json asks for (and the .NET 8 one where asked): the runner's own, else through
  actions/setup-dotnet; and where asked the NuGet package cache of one job (~/.nuget/packages).
inputs:
  net8:
    description: Also install the .NET 8 SDK, for net8.0 builds and tests.
    default: 'false'
  net11:
    description: >-
      Kept for callers: every job installs the .NET 11 SDK now that global.json asks for it (net11.0 tests included).
    default: 'false'
  cache:
    # One cache per job, not one per OS: setup-dotnet's own cache (one key per OS and project files) was saved by
    # whichever job finished first, the short runtime internals jobs, so the unit test job on Windows restored a
    # cache without its packages and then took a minute to download them. Linux runners restore from nuget.org in
    # seconds, as fast as from a cache, so only the Windows jobs ask for one.
    description: >-
      A name for this job's NuGet package cache, keyed by it, the OS and every project file and central package
      version, and restored from the newest of the same name when a project changed; empty (or 'false') for none.
    default: ''
runs:
  using: composite
  steps:
    # global.json asks for an 11.0 SDK or later (net11.0 targets and C# 15, which the union tests use). Use the
    # runner's own SDKs when they are there, and download only what is missing: setup-dotnet resolves through aka.ms, whose download host can be
    # down (October 2026: dotnetorigin.blob.core.windows.net answered 409 to every download for hours, which failed
    # every job here at "Setup .NET").
    - id: have
      shell: bash
      env:
        NET8: ${{ inputs.net8 }}
      run: |
        sdks="$(dotnet --list-sdks 2>/dev/null || true)"
        echo "$sdks"
        grep -qE '^10\.' <<< "$sdks" && echo net10=true >> "$GITHUB_OUTPUT" || echo net10=false >> "$GITHUB_OUTPUT"
        grep -qE '^8\.' <<< "$sdks" && echo net8=true >> "$GITHUB_OUTPUT" || echo net8=false >> "$GITHUB_OUTPUT"
        grep -qE '^11\.' <<< "$sdks" && echo net11=true >> "$GITHUB_OUTPUT" || echo net11=false >> "$GITHUB_OUTPUT"
        # A self-hosted runner (maple) has no sudo, and actions/setup-dotnet installs into /usr/share/dotnet on Linux:
        # it uses its own SDKs only, and a missing one is the machine's to install, once, for the runner's user.
        if [[ "$RUNNER_ENVIRONMENT" == self-hosted ]]; then
          missing=()
          grep -qE '^10\.' <<< "$sdks" || missing+=(10.0)
          grep -qE '^11\.' <<< "$sdks" || missing+=(11.0)
          if [[ "$NET8" == true ]] && ! grep -qE '^8\.' <<< "$sdks"; then missing+=(8.0); fi
          if (( ${#missing[@]} )); then
            echo "::error::this self-hosted runner lacks the .NET SDK ${missing[*]}: install it into the dotnet root of its user (dotnet-install.sh --channel <version> --install-dir <the folder of its dotnet>); CI's jobs go to GitHub's runners while the repository variable NINO_MAPLE is false"
            exit 1
          fi
        fi

    # The .NET 10 runtime too where the image lacks it: net10.0 test builds run on it.
    - if: steps.have.outputs.net11 != 'true' || steps.have.outputs.net10 != 'true'
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: |
          10.0.x
          11.0.x

    - if: inputs.net8 == 'true' && steps.have.outputs.net8 != 'true'
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: 8.0.x

    - if: inputs.cache != '' && inputs.cache != 'false'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', 'global.json') }}
        restore-keys: nuget-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache }}-
