name: Set up .NET
description: >-
  The .NET 10 SDK (and the .NET 8 one where asked) through actions/setup-dotnet, with its NuGet package cache
  (~/.nuget/packages, keyed by the OS and every project file and central package version).
inputs:
  net8:
    description: Also install the .NET 8 SDK, for net8.0 builds and tests.
    default: 'false'
  cache:
    description: Restore the NuGet package cache, and save it when its key missed. Off for release builds.
    default: 'true'
runs:
  using: composite
  steps:
    - if: inputs.net8 != 'true'
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: 10.0.x
        cache: ${{ inputs.cache == 'true' }}
        cache-dependency-path: |
          **/*.csproj
          **/Directory.Packages.props

    - if: inputs.net8 == 'true'
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: |
          10.0.x
          8.0.x
        cache: ${{ inputs.cache == 'true' }}
        cache-dependency-path: |
          **/*.csproj
          **/Directory.Packages.props
