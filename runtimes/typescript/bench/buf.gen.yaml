# generate.sh: the .NET suite's .proto files (cases.proto, workloads.proto, protobuf-net's bcl.proto) as protobuf-es
# messages in gen/pb: JavaScript and declarations, since Node's type stripping cannot run the TypeScript
# enums target=ts writes.
version: v2
plugins:
  - local: protoc-gen-es
    out: gen/pb
    opt:
      - target=js+dts
      - import_extension=js
