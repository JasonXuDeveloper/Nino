[package]
name = "nino-bench"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
nino-serialization = { path = ".." }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
bincode = { version = "2.0.1", default-features = false, features = ["serde", "std"] }
rmp-serde = "1.3.1"
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
prost = "0.14.4"

[[bench]]
name = "compare"
harness = false

# Nino's own string writer and reader on text of each class and length (development only: not in the report).
[[bench]]
name = "text"
harness = false

# Nino's block paths on elements other than numbers (development only: not in the report).
[[bench]]
name = "blocks"
harness = false
