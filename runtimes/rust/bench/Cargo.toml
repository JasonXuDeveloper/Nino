[package]
name = "nino-bench"
version = "0.0.0"
edition = "2021"
publish = false

# The .NET suite's cases (runtimes/csharp/benchmarks) in Rust: src/model.rs is what nino-gen writes for their types
# (generate.sh), src/proto.rs the messages of their protobuf-net contracts (build.rs), data/ their bytes.
[features]
default = ["serde"]
# The generated model's serde derives (bincode, postcard, rmp-serde and serde_json read and write its types).
serde = []

[dependencies]
nino-serialization = { path = "..", features = ["derive", "indexmap", "serde"] }
serde = { version = "1.0.229", features = ["derive"] }
indexmap = { version = "2.14.2", features = ["serde"] }
prost = "0.14.4"
prost-types = "0.14.4"

[build-dependencies]
# The .proto files compiled without protoc.
prost-build = "0.14.4"
protox = "0.10.0"
heck = "0.5.0"

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false }
serde_json = "1.0.154"
bincode = { version = "2.0.1", default-features = false, features = ["serde", "std"] }
rmp-serde = "1.3.1"
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }

[[bench]]
name = "compare"
harness = false

# Nino's own string writer and reader on text of each class and length (development only: not in the report).
[[bench]]
name = "text"
harness = false

# Nino's block paths on elements other than numbers (development only: not in the report).
[[bench]]
name = "blocks"
harness = false

# Byte-copy research (#263), without changing the library's copy paths.
[[bench]]
name = "copy"
harness = false
