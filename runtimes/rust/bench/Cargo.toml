[package]
name = "nino-bench"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
nino-runtime = { path = ".." }

[dev-dependencies]
criterion = { version = "0.5", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = { version = "1" }
rmp-serde = "1"
postcard = { version = "1", default-features = false, features = ["alloc"] }

[[bench]]
name = "compare"
harness = false
