[package]
name = "nino-serialization-derive"
version = "4.0.0-rc.7"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "#[derive(NinoRead, NinoWrite)] for nino-serialization: the codecs Nino's generator writes, from attributes."
repository = "https://github.com/JasonXuDeveloper/Nino"
keywords = ["nino", "serialization", "derive"]
categories = ["encoding"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "3.0.9", default-features = false, features = ["derive", "parsing", "printing", "proc-macro", "clone-impls"] }
