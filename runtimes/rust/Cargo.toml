[package]
name = "nino-serialization"
version = "0.1.0"
edition = "2021"
# slice::as_chunks (1.88) keeps fixed-size element loops free of bounds checks and panics.
rust-version = "1.88"
publish = false
license = "MIT"
description = "Reads and writes Nino's binary wire format (the bytes Nino v4 writes in .NET)."
repository = "https://github.com/JasonXuDeveloper/Nino"
readme = "README.md"

[lib]
name = "nino"

# No required dependencies: each optional one converts Nino's own value types to that crate's.
[dependencies]
uuid = { version = "1", optional = true, default-features = false }
rust_decimal = { version = "1", optional = true, default-features = false }
chrono = { version = "0.4", optional = true, default-features = false }
num-bigint = { version = "0.4", optional = true, default-features = false, features = ["std"] }
indexmap = { version = "2", optional = true, default-features = false, features = ["std"] }
nino-derive = { package = "nino-serialization-derive", version = "0.1.0", path = "nino-derive", optional = true }
serde = { version = "1", optional = true, default-features = false, features = ["std", "derive"] }

[features]
default = []
# #[derive(NinoRead, NinoWrite)].
derive = ["dep:nino-derive"]
# serde for Nino's value types, so types with Nino codecs can derive serde too.
serde = ["dep:serde", "indexmap?/serde", "uuid?/serde"]

# Test-only: the conformance test and its JSON comparison. The crate itself has no required dependencies.
[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["unbounded_depth"] }
indexmap = "2"
trybuild = "1"

# Reads the corpus's maps and sets in wire order (IndexMap), so they are written back byte for byte.
[[test]]
name = "conformance"
required-features = ["indexmap"]

# The corpus over the code nino-gen generates (tests/generated/nino_types.rs).
[[test]]
name = "generated"
required-features = ["indexmap"]

# The derive against the corpus's types.
[[test]]
name = "derive"
required-features = ["derive", "indexmap"]

[[test]]
name = "compile_fail"
required-features = ["derive"]

[workspace]
members = [".", "bench", "nino-derive"]
# Resolve dependencies to versions that build on the MSRV (rust-version) where one exists.
resolver = "3"

[profile.bench]
debug = false
