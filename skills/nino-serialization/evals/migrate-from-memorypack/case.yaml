name: migrate-from-memorypack
expected_outcome: |
  Ported.cs declares Order and OrderLine with [NinoType], excludes CachedTotal with Nino's ignore attribute, and Wire uses NinoSerializer.Serialize and NinoDeserializer.Deserialize; it compiles against Nino v4 with no NINO warnings, and PORTING.md notes real differences (wire format not compatible with MemoryPack's) without inventing APIs.
