// The workloads of WorkloadTest (WorkloadModels.cs) as Google.Protobuf messages, compiled by Grpc.Tools at build
// time. Field numbers and types follow protobuf-net's contracts of the same models at CompatibilityLevel.Level300
// (DateTime as google.protobuf.Timestamp, decimal and Guid as strings, a subtype as a field of its base), so both write
// the same messages: Verify.cs reads Google.Protobuf's bytes back through protobuf-net into the models.
syntax = "proto3";

package nino.benchmark;

import "google/protobuf/timestamp.proto";

option csharp_namespace = "Nino.Benchmark.Proto";

enum Priority {
  PRIORITY_LOW = 0;
  PRIORITY_NORMAL = 1;
  PRIORITY_HIGH = 2;
}

message RpcRequest {
  int64 request_id = 1;
  string trace_id = 2;
  string method = 3;
  string user = 4;
  string locale = 5;
  google.protobuf.Timestamp sent_at = 6;
  Priority priority = 7;
  repeated int32 item_ids = 8;
}

enum OrderStatus {
  ORDER_STATUS_PENDING = 0;
  ORDER_STATUS_PAID = 1;
  ORDER_STATUS_SHIPPED = 2;
  ORDER_STATUS_DELIVERED = 3;
  ORDER_STATUS_CANCELLED = 4;
}

message Address {
  string line1 = 1;
  optional string line2 = 2;
  string city = 3;
  string region = 4;
  string postal_code = 5;
  string country = 6;
}

message OrderLine {
  string sku = 1;
  string name = 2;
  int32 quantity = 3;
  string unit_price = 4;
  optional string discount = 5;
}

message Order {
  int64 id = 1;
  string number = 2;
  string customer_id = 3;
  string customer_name = 4;
  OrderStatus status = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp shipped_at = 7;
  optional string coupon = 8;
  string subtotal = 9;
  string tax = 10;
  string total = 11;
  Address ship_to = 12;
  repeated OrderLine lines = 13;
}

message OrdersPage {
  int32 page = 1;
  int32 page_size = 2;
  int32 total_count = 3;
  repeated Order orders = 4;
}

message UserProfile {
  int64 id = 1;
  string user_name = 2;
  string email = 3;
  string display_name = 4;
  optional string avatar_url = 5;
  optional string bio = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp last_login_at = 8;
  bool email_verified = 9;
  bool two_factor = 10;
  optional int32 birth_year = 11;
  string country = 12;
  string time_zone = 13;
  string locale = 14;
  int32 followers = 15;
  int32 following = 16;
  repeated string roles = 17;
  map<string, string> preferences = 18;
}

message Vec3 {
  float x = 1;
  float y = 2;
  float z = 3;
}

message Quat {
  float x = 1;
  float y = 2;
  float z = 3;
  float w = 4;
}

message EntityState {
  int32 id = 1;
  int32 kind = 2;
  Vec3 position = 3;
  Vec3 velocity = 4;
  Quat rotation = 5;
  float health = 6;
  uint32 flags = 7;
}

message GameSnapshot {
  int64 tick = 1;
  int32 match_id = 2;
  google.protobuf.Timestamp server_time = 3;
  repeated EntityState entities = 4;
}

enum Severity {
  SEVERITY_DEBUG = 0;
  SEVERITY_INFO = 1;
  SEVERITY_WARNING = 2;
  SEVERITY_ERROR = 3;
}

message LogEvent {
  google.protobuf.Timestamp timestamp = 1;
  Severity level = 2;
  string template = 3;
  string trace_id = 4;
  double elapsed_ms = 5;
  map<string, string> tags = 6;
}

message LogBatch {
  string service = 1;
  string host = 2;
  repeated LogEvent events = 3;
}

message OrderPlaced {
  string order_number = 1;
  string amount = 2;
  int32 item_count = 3;
}

message PaymentCaptured {
  string payment_id = 1;
  string amount = 2;
  string currency = 3;
}

message ItemShipped {
  string carrier = 1;
  string tracking_number = 2;
  google.protobuf.Timestamp estimated_delivery = 3;
}

message CustomerRenamed {
  string old_name = 1;
  string new_name = 2;
}

// The subtype first (the lowest numbers): protobuf-net reads it before the base's fields.
message DomainEvent {
  oneof kind {
    OrderPlaced order_placed = 1;
    PaymentCaptured payment_captured = 2;
    ItemShipped item_shipped = 3;
    CustomerRenamed customer_renamed = 4;
  }
  int64 sequence = 10;
  string aggregate_id = 11;
  google.protobuf.Timestamp occurred_at = 12;
}

message EventBatch {
  int64 first_sequence = 1;
  repeated DomainEvent events = 2;
}
